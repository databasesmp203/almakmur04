                                </div>

                                <div className="lg:col-span-5 xl:col-span-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between h-fit sticky top-4">
                                    <div className="space-y-3">
                                        <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                                            <h3 className="font-black text-slate-900 text-sm flex items-center gap-2">
                                                <i className="fas fa-cart-shopping text-amber-500"></i>
                                                <span>Keranjang Kasir</span>
                                            </h3>
                                            {cart.length > 0 && (
                                                <button onClick={() => setCart([])} className="text-[10px] text-rose-600 hover:underline font-bold">
                                                    Kosongkan
                                                </button>
                                            )}
                                        </div>

                                        <div className="space-y-1">
                                            <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider">Pilih Pelanggan / Tukang:</label>
                                            <select
                                                value={selectedCustomerId}
                                                onChange={e => setSelectedCustomerId(e.target.value)}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-amber-500"
                                            >
                                                {customers.map(c => (
                                                    <option key={c.id} value={c.id}>
                                                        {c.name} ({c.type}) {c.currentDebt > 0 ? `- Utang: ${formatRupiah(c.currentDebt)}` : ''}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                                            {cart.length === 0 ? (
                                                <div className="text-center py-8 text-slate-400 italic text-xs">
                                                    Belum ada barang dipilih. Klik barang di sebelah kiri.
                                                </div>
                                            ) : (
                                                cart.map(item => (
                                                    <div key={item.id} className="p-2.5 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                                                        <div className="flex-1 pr-2">
                                                            <h5 className="font-bold text-slate-900 line-clamp-1">{item.name}</h5>
                                                            <div className="text-[10px] text-slate-500">
                                                                {formatRupiah(item.price)} / {item.unit}
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <div className="flex items-center bg-white border border-slate-300 rounded-lg overflow-hidden">
                                                                <button onClick={() => updateCartQty(item.id, -1)} className="px-2 py-0.5 hover:bg-slate-100 font-bold text-slate-700">-</button>
                                                                <span className="px-2 font-black text-slate-900">{item.qty}</span>
                                                                <button onClick={() => updateCartQty(item.id, 1)} className="px-2 py-0.5 hover:bg-slate-100 font-bold text-slate-700">+</button>
                                                            </div>
                                                            <span className="font-extrabold text-slate-900 min-w-[60px] text-right">
                                                                {formatRupiah(item.price * item.qty)}
                                                            </span>
                                                            <button onClick={() => removeFromCart(item.id)} className="text-rose-500 hover:text-rose-700 p-1">
                                                                <i className="fas fa-times"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>

                                    <form onSubmit={handleCheckout} className="pt-3 border-t border-slate-200 space-y-2.5 mt-3">
                                        <div className="flex justify-between items-center text-xs font-bold text-slate-600">
                                            <span>Total Subtotal:</span>
                                            <span className="text-base font-black text-slate-900">{formatRupiah(cartSubtotal)}</span>
                                        </div>

                                        <div className="grid grid-cols-2 gap-2 text-xs">
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-500 mb-1">Metode Bayar:</label>
                                                <select
                                                    value={paymentMethod}
                                                    onChange={e => {
                                                        const method = e.target.value;
                                                        setPaymentMethod(method);
                                                        if (method === 'QRIS' || method === 'Transfer') {
                                                            setAmountPaidInput(cartSubtotal.toString());
                                                        }
                                                    }}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold text-xs"
                                                >
                                                    <option value="Tunai">Tunai / Cash</option>
                                                    <option value="QRIS">QRIS / E-Wallet</option>
                                                    <option value="Transfer">Transfer Bank</option>
                                                    <option value="Kredit">Kredit / Kasbon</option>
                                                </select>
                                            </div>

                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-500 mb-1">Jumlah Bayar (IDR):</label>
                                                <input
                                                    type="number"
                                                    value={paymentMethod === 'Kredit' ? 0 : amountPaidInput}
                                                    onChange={e => setAmountPaidInput(e.target.value)}
                                                    disabled={paymentMethod === 'Kredit'}
                                                    placeholder="0"
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-extrabold text-slate-900 text-xs disabled:opacity-50"
                                                />
                                            </div>
                                        </div>

                                        {paymentMethod === 'QRIS' && cartSubtotal > 0 && (
                                            <button
                                                type="button"
                                                onClick={() => setActiveModal('qris_pay_modal')}
                                                className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold rounded-xl text-xs flex items-center justify-center gap-2 shadow-sm"
                                            >
                                                <i className="fas fa-qrcode text-sm"></i>
                                                <span>Tampilkan Kode QRIS Kasir</span>
                                            </button>
                                        )}

                                        {paymentMethod !== 'Kredit' && paidAmount > 0 && paymentMethod !== 'QRIS' && (
                                            <div className="flex justify-between items-center p-2 bg-emerald-50 rounded-xl border border-emerald-200 text-xs">
                                                <span className="font-bold text-emerald-800">Kembalian:</span>
                                                <span className="font-black text-emerald-900">{formatRupiah(changeAmount)}</span>
                                            </div>
                                        )}

                                        <button
                                            type="submit"
                                            disabled={cart.length === 0}
                                            className="w-full py-3 bg-amber-500 hover:bg-amber-400 disabled:opacity-50 text-slate-950 font-extrabold rounded-xl text-xs shadow-md active:scale-95 transition-transform"
                                        >
                                            Bayar & Cetak Struk (Selesai)
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: DASHBOARD STORE */}
                        {activeTab === 'dashboard' && (() => {
                            const totalProfit = sales.reduce((sum, sale) => {
                                const saleProfit = sale.items.reduce((iSum, item) => iSum + ((item.price - (item.buyPrice || 0)) * item.qty), 0);
                                return sum + saleProfit;
                            }, 0);

                            const totalStockValuationHPP = products.reduce((sum, p) => sum + (p.stock * (p.buyPrice || 0)), 0);
                            const totalStockValuationSell = products.reduce((sum, p) => sum + (p.stock * p.sellPrice), 0);

                            const tunaiSalesTotal = sales.filter(s => s.paymentMethod === 'Tunai').reduce((sum, s) => sum + s.total, 0);
                            const transferSalesTotal = sales.filter(s => s.paymentMethod === 'Transfer').reduce((sum, s) => sum + s.total, 0);
                            const kreditSalesTotal = sales.filter(s => s.paymentMethod === 'Kredit').reduce((sum, s) => sum + s.total, 0);

                            const productSalesMap = {};
                            sales.forEach(s => {
                                s.items.forEach(item => {
                                    if (!productSalesMap[item.name]) {
                                        productSalesMap[item.name] = { name: item.name, qty: 0, total: 0, unit: item.unit };
                                    }
                                    productSalesMap[item.name].qty += item.qty;
                                    productSalesMap[item.name].total += (item.price * item.qty);
                                });
                            });
                            const topProducts = Object.values(productSalesMap).sort((a, b) => b.qty - a.qty).slice(0, 5);

                            return (
                                <div className="space-y-4">
                                    <div className="bg-slate-900 text-white p-4 sm:p-5 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shadow-md">
                                        <div>
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="px-2 py-0.5 bg-amber-500 text-slate-950 font-extrabold text-[10px] rounded uppercase">Dashboard Store</span>
                                                <span className="text-slate-400 text-xs font-semibold">{new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</span>
                                            </div>
                                            <h2 className="text-lg sm:text-xl font-black text-white">{storeInfo.name}</h2>
                                            <p className="text-xs text-slate-400">Ringkasan performa penjualan, keuangan, & inventaris bahan bangunan.</p>
                                        </div>
                                        <button
                                            onClick={() => setActiveTab('pos')}
                                            className="px-4 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl text-xs flex items-center gap-2 shadow-md active:scale-95 transition-transform"
                                        >
                                            <i className="fas fa-cash-register"></i>
                                            <span>Buka Kasir Penjualan</span>
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                                            <div>
                                                <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-0.5">Total Omset Penjualan</span>
                                                <h3 className="text-lg font-black text-slate-900">{formatRupiah(totalOmset)}</h3>
                                                <span className="text-[10px] text-slate-500 font-semibold">{sales.length} transaksi nota selesai</span>
                                            </div>
                                            <div className="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center font-black text-base shrink-0">
                                                <i className="fas fa-chart-line"></i>
                                            </div>
                                        </div>

                                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                                            <div>
                                                <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-0.5">Estimasi Keuntungan Kotor</span>
                                                <h3 className="text-lg font-black text-emerald-600">{formatRupiah(totalProfit)}</h3>
                                                <span className="text-[10px] text-emerald-700 font-semibold">Selisih Harga Jual vs HPP</span>
                                            </div>
                                            <div className="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-black text-base shrink-0">
                                                <i className="fas fa-wallet"></i>
                                            </div>
                                        </div>

                                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                                            <div>
                                                <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-0.5">Total Piutang Tukang</span>
                                                <h3 className="text-lg font-black text-rose-600">{formatRupiah(totalPiutangTukang)}</h3>
                                                <span className="text-[10px] text-rose-700 font-semibold">{customers.filter(c => c.currentDebt > 0).length} pelanggan berpiutang</span>
                                            </div>
                                            <div className="w-10 h-10 rounded-xl bg-rose-100 text-rose-700 flex items-center justify-center font-black text-base shrink-0">
                                                <i className="fas fa-hand-holding-dollar"></i>
                                            </div>
                                        </div>

                                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                                            <div>
                                                <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-0.5">Total Utang Supplier</span>
                                                <h3 className="text-lg font-black text-slate-900">{formatRupiah(totalUtangSupplier)}</h3>
                                                <span className="text-[10px] text-amber-700 font-semibold">{suppliers.filter(s => s.currentDebt > 0).length} supplier berutang</span>
                                            </div>
                                            <div className="w-10 h-10 rounded-xl bg-slate-100 text-slate-800 flex items-center justify-center font-black text-base shrink-0">
                                                <i className="fas fa-truck"></i>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                        <div className="bg-slate-900 text-white p-4 rounded-2xl shadow-sm flex items-center justify-between">
                                            <div>
                                                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Nilai Modal Stok (HPP)</span>
                                                <h4 className="text-base font-black text-amber-400">{formatRupiah(totalStockValuationHPP)}</h4>
                                                <p className="text-[10px] text-slate-400">Total modal terikat pada barang toko</p>
                                            </div>
                                            <i className="fas fa-boxes-stacked text-2xl text-slate-700"></i>
                                        </div>

                                        <div className="bg-slate-900 text-white p-4 rounded-2xl shadow-sm flex items-center justify-between">
                                            <div>
                                                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Potensi Omset Stok Jual</span>
                                                <h4 className="text-base font-black text-emerald-400">{formatRupiah(totalStockValuationSell)}</h4>
                                                <p className="text-[10px] text-slate-400">Nilai total jika semua stok terjual habis</p>
                                            </div>
                                            <i className="fas fa-coins text-2xl text-slate-700"></i>
                                        </div>

                                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                                            <div>
                                                <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">Barang Perlu Restok</span>
                                                <h4 className={`text-base font-black ${lowStockProducts.length > 0 ? 'text-rose-600' : 'text-emerald-600'}`}>
                                                    {lowStockProducts.length} Produk
                                                </h4>
                                                <p className="text-[10px] text-slate-500">Stok berada di bawah batas minimal</p>
                                            </div>
                                            <button
                                                onClick={() => setActiveTab('mutasi')}
                                                className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 font-bold text-xs rounded-xl text-slate-800"
                                            >
                                                Cek Mutasi
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                                        <div className="lg:col-span-2 space-y-4">
                                            <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                                <h3 className="font-extrabold text-slate-900 text-xs uppercase tracking-wider flex items-center gap-2">
                                                    <i className="fas fa-chart-pie text-amber-500"></i>
                                                    <span>Metode Pembayaran Transaksi</span>
                                                </h3>

                                                <div className="space-y-2.5 text-xs">
                                                    <div>
                                                        <div className="flex justify-between font-bold mb-1">
                                                            <span>Tunai / Cash</span>
                                                            <span className="text-slate-900">{formatRupiah(tunaiSalesTotal)} ({totalOmset > 0 ? Math.round((tunaiSalesTotal / totalOmset) * 100) : 0}%)</span>
                                                        </div>
                                                        <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                                            <div className="bg-emerald-500 h-full rounded-full" style={{ width: `${totalOmset > 0 ? (tunaiSalesTotal / totalOmset) * 100 : 0}%` }}></div>
                                                        </div>
                                                    </div>

                                                    <div>
                                                        <div className="flex justify-between font-bold mb-1">
                                                            <span>Transfer Bank</span>
                                                            <span className="text-slate-900">{formatRupiah(transferSalesTotal)} ({totalOmset > 0 ? Math.round((transferSalesTotal / totalOmset) * 100) : 0}%)</span>
                                                        </div>
                                                        <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                                            <div className="bg-blue-500 h-full rounded-full" style={{ width: `${totalOmset > 0 ? (transferSalesTotal / totalOmset) * 100 : 0}%` }}></div>
                                                        </div>
                                                    </div>

                                                    <div>
                                                        <div className="flex justify-between font-bold mb-1">
                                                            <span>Kredit Kasbon</span>
                                                            <span className="text-rose-600">{formatRupiah(kreditSalesTotal)} ({totalOmset > 0 ? Math.round((kreditSalesTotal / totalOmset) * 100) : 0}%)</span>
                                                        </div>
                                                        <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                                            <div className="bg-rose-500 h-full rounded-full" style={{ width: `${totalOmset > 0 ? (kreditSalesTotal / totalOmset) * 100 : 0}%` }}></div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                                <h3 className="font-extrabold text-slate-900 text-xs uppercase tracking-wider flex items-center gap-2">
                                                    <i className="fas fa-trophy text-amber-500"></i>
                                                    <span>5 Barang Bangunan Terlaris</span>
                                                </h3>

                                                {topProducts.length === 0 ? (
                                                    <div className="text-center py-6 text-slate-400 text-xs italic">Belum ada data penjualan produk.</div>
                                                ) : (
                                                    <div className="divide-y divide-slate-100 text-xs">
                                                        {topProducts.map((p, idx) => (
                                                            <div key={idx} className="py-2.5 flex justify-between items-center">
                                                                <div className="flex items-center gap-2.5">
                                                                    <span className="w-6 h-6 rounded-lg bg-slate-900 text-amber-400 font-black text-[10px] flex items-center justify-center">#{idx + 1}</span>
                                                                    <div>
                                                                        <h5 className="font-bold text-slate-900">{p.name}</h5>
                                                                        <span className="text-[10px] text-slate-400">Terjual: {p.qty} {p.unit}</span>
                                                                    </div>
                                                                </div>
                                                                <span className="font-extrabold text-amber-600">{formatRupiah(p.total)}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        <div className="space-y-4">
                                            <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                                <div className="flex justify-between items-center">
                                                    <h3 className="font-extrabold text-slate-900 text-xs uppercase tracking-wider flex items-center gap-2">
                                                        <i className="fas fa-triangle-exclamation text-rose-500"></i>
                                                        <span>Peringatan Stok Menipis</span>
                                                    </h3>
                                                    <span className="text-[10px] bg-rose-100 text-rose-700 font-extrabold px-2 py-0.5 rounded-md">
                                                        {lowStockProducts.length} Item
                                                    </span>
                                                </div>

                                                <div className="space-y-2 max-h-72 overflow-y-auto pr-1 text-xs">
                                                    {lowStockProducts.length === 0 ? (
                                                        <div className="text-center py-6 text-emerald-600 font-bold bg-emerald-50 rounded-xl p-3">
                                                            <i className="fas fa-check-circle text-lg mb-1 block"></i>
                                                            Semua stok barang aman di atas batas minimal!
                                                        </div>
                                                    ) : (
                                                        lowStockProducts.map(p => (
                                                            <div key={p.id} className="p-2.5 bg-rose-50 border border-rose-100 rounded-xl flex justify-between items-center">
                                                                <div>
                                                                    <h5 className="font-bold text-slate-900">{p.name}</h5>
                                                                    <p className="text-[10px] text-rose-700 font-bold">
                                                                        Sisa: {p.stock} {p.unit} (Min: {p.minStock})
                                                                    </p>
                                                                </div>
                                                                <button
                                                                    onClick={() => {
                                                                        setMutationFormData({ productId: p.id, type: 'MASUK', qty: '', supplierId: '', note: 'Restok Cepat dari Dashboard', proofImage: '' });
                                                                        setActiveModal('mutation_add');
                                                                    }}
                                                                    className="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 text-amber-400 font-extrabold text-[10px] rounded-lg shadow-sm"
                                                                >
                                                                    Restok
                                                                </button>
                                                            </div>
                                                        ))
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}

                        {/* TAB 3: SALES HISTORY */}
                        {activeTab === 'sales_history' && (
                            <div className="space-y-4">
                                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                    <h3 className="font-extrabold text-slate-900 text-sm">Riwayat & Daftar Nota Penjualan Kasir</h3>
                                    
                                    <div className="flex flex-col sm:flex-row gap-2">
                                        <div className="relative flex-1">
                                            <i className="fas fa-search absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                                            <input
                                                type="text"
                                                placeholder="Cari ID Invoice atau nama pelanggan..."
                                                value={salesSearchTerm}
                                                onChange={e => setSalesSearchTerm(e.target.value)}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500"
                                            />
                                        </div>
                                        <div className="flex gap-1.5 text-xs overflow-x-auto pb-1 no-scrollbar">
                                            {['Semua', 'Lunas', 'Kredit', 'Tunai', 'QRIS', 'Transfer'].map(status => (
                                                <button
                                                    key={status}
                                                    onClick={() => setSalesStatusFilter(status)}
                                                    className={`px-3 py-2 rounded-xl font-bold shrink-0 text-xs transition-colors ${salesStatusFilter === status ? 'bg-slate-900 text-amber-400' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                                >
                                                    {status}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-xs">
                                            <thead className="bg-slate-900 text-amber-400 font-bold uppercase text-[10px]">
                                                <tr>
                                                    <th className="p-3">No. Invoice</th>
                                                    <th className="p-3">Tanggal Transaksi</th>
                                                    <th className="p-3">Pelanggan</th>
                                                    <th className="p-3">Metode</th>
                                                    <th className="p-3">Status</th>
                                                    <th className="p-3">Total Belanja</th>
                                                    <th className="p-3 text-right">Aksi</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-semibold text-slate-800">
                                                {filteredSales.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="7" className="p-6 text-center text-slate-400">Belum ada riwayat transaksi penjualan.</td>
                                                    </tr>
                                                ) : (
                                                    filteredSales.map(sale => (
                                                        <tr key={sale.id} className="hover:bg-slate-50">
                                                            <td className="p-3 font-extrabold text-amber-600">{sale.id}</td>
                                                            <td className="p-3 text-slate-500">{new Date(sale.date).toLocaleString('id-ID')}</td>
                                                            <td className="p-3 font-bold text-slate-900">{sale.customer?.name || 'Umum'}</td>
                                                            <td className="p-3"><span className="bg-slate-100 px-2 py-0.5 rounded text-[10px] font-bold">{sale.paymentMethod}</span></td>
                                                            <td className="p-3">
                                                                <span className={`px-2 py-0.5 rounded-md text-[10px] font-black ${sale.status === 'Lunas' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                                                    {sale.status}
                                                                </span>
                                                            </td>
                                                            <td className="p-3 font-black text-slate-900">{formatRupiah(sale.total)}</td>
                                                            <td className="p-3 text-right space-x-1">
                                                                <button
                                                                    onClick={() => { setSelectedSaleDetail(sale); setActiveModal('selectedSaleDetail'); }}
                                                                    className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-lg text-[10px] font-bold"
                                                                >
                                                                    <i className="fas fa-eye mr-1"></i> Rincian
                                                                </button>
                                                                <button
                                                                    onClick={() => { setLastCompletedSale(sale); setActiveModal('receipt'); }}
                                                                    className="px-2.5 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-lg text-[10px] font-extrabold"
                                                                >
                                                                    <i className="fas fa-print mr-1"></i> Struk
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 4: PURCHASES */}
                        {activeTab === 'pembelian' && (() => {
                            const totalPembelianSum = purchases.reduce((sum, p) => sum + p.total, 0);
                            const totalTunaiSum = purchases.filter(p => p.paymentMethod !== 'Tempo').reduce((sum, p) => sum + p.total, 0);
                            const totalTempoSum = purchases.filter(p => p.paymentMethod === 'Tempo').reduce((sum, p) => sum + p.total, 0);

                            const filteredPurchases = purchases.filter(p => {
                                const matchSearch = (p.invoiceNo || '').toLowerCase().includes(purchaseSearchTerm.toLowerCase()) || (p.supplier?.name || '').toLowerCase().includes(purchaseSearchTerm.toLowerCase());
                                return matchSearch;
                            });

                            return (
                                <div className="space-y-4">
                                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                        <div>
                                            <h3 className="font-extrabold text-slate-900 text-sm">Data Pembelian & Kulakan Barang dari Distributor</h3>
                                            <p className="text-[11px] text-slate-500">Catat transaksi pasokan stok masuk, harga HPP, serta bukti faktur distributor.</p>
                                        </div>
                                        <button
                                            onClick={() => {
                                                setSelectedPurchaseSupplierId(suppliers[0]?.id || '');
                                                setPurchaseCart([]);
                                                setPurchaseInvoiceNo('');
                                                setPurchaseProofImage('');
                                                setActiveModal('purchase_form');
                                            }}
                                            className="px-3.5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl text-xs flex items-center gap-1.5 shadow-sm active:scale-95 transition-transform"
                                        >
                                            <i className="fas fa-plus"></i>
                                            <span>+ Catat Pembelian Baru</span>
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div className="bg-slate-900 text-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
                                            <div>
                                                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Total Pembelian/Kulakan</span>
                                                <h4 className="text-base font-black text-amber-400">{formatRupiah(totalPembelianSum)}</h4>
                                                <p className="text-[10px] text-slate-400">{purchases.length} Faktur Terdaftar</p>
                                            </div>
                                            <i className="fas fa-truck-ramp-box text-2xl text-slate-700"></i>
                                        </div>

                                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                                            <div>
                                                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Pembelian Tunai / Cash</span>
                                                <h4 className="text-base font-black text-emerald-600">{formatRupiah(totalTunaiSum)}</h4>
                                                <p className="text-[10px] text-slate-500">Selesai & Lunas</p>
                                            </div>
                                            <i className="fas fa-money-bill-wave text-2xl text-emerald-100"></i>
                                        </div>

                                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                                            <div>
                                                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Pembelian Tempo (Utang)</span>
                                                <h4 className="text-base font-black text-rose-600">{formatRupiah(totalTempoSum)}</h4>
                                                <p className="text-[10px] text-rose-700 font-bold">Masuk Utang Toko</p>
                                            </div>
                                            <i className="fas fa-file-invoice-dollar text-2xl text-rose-100"></i>
                                        </div>
                                    </div>

                                    <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
                                        <div className="relative">
                                            <i className="fas fa-search absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                                            <input
                                                type="text"
                                                placeholder="Cari No. Faktur atau Nama Distributor..."
                                                value={purchaseSearchTerm}
                                                onChange={e => setPurchaseSearchTerm(e.target.value)}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-xs">
                                                <thead className="bg-slate-900 text-amber-400 font-bold uppercase text-[10px]">
                                                    <tr>
                                                        <th className="p-3">No. Faktur</th>
                                                        <th className="p-3">Tanggal</th>
                                                        <th className="p-3">Distributor / Supplier</th>
                                                        <th className="p-3">Metode Bayar</th>
                                                        <th className="p-3">Total Belanja</th>
                                                        <th className="p-3">Foto Faktur</th>
                                                        <th className="p-3 text-right">Aksi</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 font-semibold text-slate-800">
                                                    {filteredPurchases.length === 0 ? (
                                                        <tr>
                                                            <td colSpan="7" className="p-6 text-center text-slate-400">Belum ada data transaksi pembelian/kulakan.</td>
                                                        </tr>
                                                    ) : (
                                                        filteredPurchases.map(p => (
                                                            <tr key={p.id} className="hover:bg-slate-50">
                                                                <td className="p-3 font-extrabold text-amber-600">{p.invoiceNo}</td>
                                                                <td className="p-3 text-slate-500">{new Date(p.date).toLocaleString('id-ID')}</td>
                                                                <td className="p-3 font-bold text-slate-900">{p.supplier?.name || '-'}</td>
                                                                <td className="p-3">
                                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-black ${p.paymentMethod === 'Tempo' ? 'bg-rose-100 text-rose-800' : 'bg-emerald-100 text-emerald-800'}`}>
                                                                        {p.paymentMethod}
                                                                    </span>
                                                                </td>
                                                                <td className="p-3 font-black text-slate-900">{formatRupiah(p.total)}</td>
                                                                <td className="p-3">
                                                                    {p.proofImage ? (
                                                                        <button
                                                                            type="button"
                                                                            onClick={() => { setViewImageModalUrl(p.proofImage); setActiveModal('view_proof_image'); }}
                                                                            className="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-blue-600 font-bold rounded-lg text-[10px] flex items-center gap-1 border border-slate-200"
                                                                        >
                                                                            <i className="fas fa-image"></i>
                                                                            <span>Foto Faktur</span>
                                                                        </button>
                                                                    ) : (
                                                                        <span className="text-slate-400 text-[10px] italic">-</span>
                                                                    )}
                                                                </td>
                                                                <td className="p-3 text-right">
                                                                    <button
                                                                        onClick={() => { setSelectedPurchaseDetail(p); setActiveModal('selectedPurchaseDetail'); }}
                                                                        className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-lg text-[10px] font-bold"
                                                                    >
                                                                        <i className="fas fa-eye mr-1"></i> Detail
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}

                        {/* TAB 5: STOCK MUTATION */}
                        {activeTab === 'mutasi' && (
                            <div className="space-y-4">
                                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                    <h3 className="font-extrabold text-slate-900 text-sm">Riwayat Pergerakan & Mutasi Stok Material</h3>
                                    <button
                                        onClick={() => {
                                            setMutationFormData({ productId: products[0]?.id || '', type: 'MASUK', qty: '', supplierId: '', note: '', proofImage: '' });
                                            setActiveModal('mutation_add');
                                        }}
                                        className="px-3.5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl text-xs flex items-center gap-1.5 shadow-sm active:scale-95 transition-transform"
                                    >
                                        <i className="fas fa-plus"></i>
                                        <span>Catat Mutasi Stok Baru</span>
                                    </button>
                                </div>

                                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-xs">
                                            <thead className="bg-slate-900 text-amber-400 font-bold uppercase text-[10px]">
                                                <tr>
                                                    <th className="p-3">ID Mutasi</th>
                                                    <th className="p-3">Tanggal</th>
                                                    <th className="p-3">Nama Barang</th>
                                                    <th className="p-3">Jenis</th>
                                                    <th className="p-3">Jumlah Qty</th>
                                                    <th className="p-3">Keterangan</th>
                                                    <th className="p-3">Foto / Bukti</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-semibold text-slate-800">
                                                {mutations.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="7" className="p-6 text-center text-slate-400">Belum ada data mutasi stok.</td>
                                                    </tr>
                                                ) : (
                                                    mutations.map(m => (
                                                        <tr key={m.id} className="hover:bg-slate-50">
                                                            <td className="p-3 text-slate-400 text-[10px]">{m.id}</td>
                                                            <td className="p-3 text-slate-500">{new Date(m.date).toLocaleString('id-ID')}</td>
                                                            <td className="p-3 font-bold">{m.productName}</td>
                                                            <td className="p-3">
                                                                <span className={`px-2 py-0.5 rounded-md text-[10px] font-black ${m.type === 'MASUK' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                                                    {m.type}
                                                                </span>
                                                            </td>
                                                            <td className="p-3 font-extrabold">{m.qty}</td>
                                                            <td className="p-3 text-slate-500">{m.note}</td>
                                                            <td className="p-3">
                                                                {m.proofImage ? (
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => { setViewImageModalUrl(m.proofImage); setActiveModal('view_proof_image'); }}
                                                                        className="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-blue-600 font-bold rounded-lg text-[10px] flex items-center gap-1 border border-slate-200"
                                                                    >
                                                                        <i className="fas fa-image"></i>
                                                                        <span>Lihat Foto</span>
                                                                    </button>
                                                                ) : (
                                                                    <span className="text-slate-400 text-[10px] italic">-</span>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 6: PRODUCTS */}
                        {activeTab === 'products' && (
                            <div className="space-y-4">
                                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                    <h3 className="font-extrabold text-slate-900 text-sm">Katalog Master Material Bangunan</h3>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setActiveModal('category_manage')}
                                            className="px-3.5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-extrabold rounded-xl text-xs flex items-center gap-1.5"
                                        >
