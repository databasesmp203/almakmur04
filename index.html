                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Catatan Kaki Struk (Thermal Receipt Footer):</label>
                                            <textarea name="receiptFooter" defaultValue={storeInfo.receiptFooter} rows="2" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></textarea>
                                        </div>

                                        <div className="p-3.5 bg-amber-50 border border-amber-200 rounded-xl space-y-2.5">
                                            <label className="block font-extrabold text-slate-900 flex items-center justify-between">
                                                <span className="flex items-center gap-1.5">
                                                    <i className="fa-solid fa-cloud text-amber-600"></i>
                                                    <span>Google Apps Script Web App URL (Spreadsheet Sync Engine)</span>
                                                </span>
                                                <span className={`text-[10px] font-black px-2 py-0.5 rounded ${storeInfo.appsScriptUrl ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                                    {storeInfo.appsScriptUrl ? 'URL Terpasang' : 'URL Kosong'}
                                                </span>
                                            </label>
                                            <div className="flex gap-2">
                                                <input
                                                    type="url"
                                                    name="appsScriptUrl"
                                                    defaultValue={storeInfo.appsScriptUrl || ''}
                                                    placeholder="https://script.google.com/macros/s/AKfycb.../exec"
                                                    className="w-full bg-white border border-slate-300 rounded-xl p-2.5 font-mono text-slate-800 text-xs focus:ring-2 focus:ring-amber-500"
                                                />
                                                <button
                                                    type="button"
                                                    onClick={testAppsScriptSync}
                                                    className="px-3 bg-slate-900 hover:bg-slate-800 text-amber-400 font-extrabold rounded-xl text-xs shrink-0 shadow-sm"
                                                >
                                                    <i className="fas fa-paper-plane mr-1"></i> Tes Ping
                                                </button>
                                            </div>

                                            <div className="flex flex-col sm:flex-row gap-2 pt-1 border-t border-amber-200/60 justify-between items-center text-xs">
                                                <button
                                                    type="button"
                                                    onClick={pullDataFromSpreadsheet}
                                                    className="w-full sm:w-auto px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white font-extrabold text-[11px] rounded-lg shadow-sm flex items-center justify-center gap-1.5"
                                                >
                                                    <i className="fas fa-cloud-arrow-down"></i>
                                                    <span>Tarik Data dari Spreadsheet</span>
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={syncAllMasterDataToSheets}
                                                    className="w-full sm:w-auto px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-[11px] rounded-lg shadow-sm flex items-center justify-center gap-1.5"
                                                >
                                                    <i className="fas fa-rotate"></i>
                                                    <span>Sinkronkan Semua Master Data Ke Sheets</span>
                                                </button>
                                            </div>
                                        </div>

                                        <button type="submit" className="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl text-xs shadow-md">
                                            Simpan Pengaturan Profil Toko
                                        </button>
                                    </form>
                                </div>

                                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                    <h3 className="font-extrabold text-slate-900 text-sm border-b pb-2">Backup & Restore Database Lokal</h3>
                                    <div className="flex flex-col sm:flex-row gap-2">
                                        <button onClick={() => {
                                            const dataObj = { storeInfo, categories, products, customers, suppliers, sales, mutations, debtPayments, purchases, exportDate: new Date().toISOString() };
                                            const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json' });
                                            const url = URL.createObjectURL(blob);
                                            const a = document.createElement('a');
                                            a.href = url;
                                            a.download = `Backup_MaterialPOS_${new Date().toISOString().slice(0, 10)}.json`;
                                            a.click();
                                            showToast('Database berhasil diexport!');
                                        }} className="flex-1 py-2.5 bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold rounded-xl text-xs flex items-center justify-center gap-2">
                                            <i className="fas fa-download"></i>
                                            <span>Export Backup JSON</span>
                                        </button>
                                        <label className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold rounded-xl text-xs flex items-center justify-center gap-2 cursor-pointer">
                                            <i className="fas fa-upload"></i>
                                            <span>Import Backup JSON</span>
                                            <input type="file" accept=".json" onChange={e => {
                                                const file = e.target.files[0];
                                                if (!file) return;
                                                const reader = new FileReader();
                                                reader.onload = (evt) => {
                                                    try {
                                                        const imported = JSON.parse(evt.target.result);
                                                        if (imported.products) setProducts(imported.products);
                                                        if (imported.customers) setCustomers(imported.customers);
                                                        if (imported.suppliers) setSuppliers(imported.suppliers);
                                                        if (imported.sales) setSales(imported.sales);
                                                        if (imported.mutations) setMutations(imported.mutations);
                                                        if (imported.debtPayments) setDebtPayments(imported.debtPayments);
                                                        if (imported.purchases) setPurchases(imported.purchases);
                                                        if (imported.categories) setCategories(imported.categories);
                                                        if (imported.storeInfo) setStoreInfo(imported.storeInfo);
                                                        showToast('Restore database berhasil!');
                                                    } catch (err) {
                                                        showToast('Format file JSON tidak valid!', 'error');
                                                    }
                                                };
                                                reader.readAsText(file);
                                            }} className="hidden" />
                                        </label>
                                    </div>
                                    <div className="pt-2">
                                        <button onClick={() => setActiveModal('confirm_reset_database')} className="w-full py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 font-extrabold rounded-xl text-xs border border-rose-200">
                                            Reset Seluruh Database Toko
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {}

                    {/* Modal 1: Thermal Receipt Printer */}
                    {activeModal === 'receipt' && lastCompletedSale && (
                        <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl relative text-xs">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 no-print">
                                    <i className="fas fa-times text-lg"></i>
                                </button>

                                <div className="flex gap-2 mb-3 no-print">
                                    <button
                                        onClick={() => setPrintThermalSize('80mm')}
                                        className={`flex-1 py-1.5 rounded-lg font-bold text-[11px] ${printThermalSize === '80mm' ? 'bg-slate-900 text-amber-400' : 'bg-slate-100 text-slate-600'}`}
                                    >
                                        Ukuran 80mm
                                    </button>
                                    <button
                                        onClick={() => setPrintThermalSize('58mm')}
                                        className={`flex-1 py-1.5 rounded-lg font-bold text-[11px] ${printThermalSize === '58mm' ? 'bg-slate-900 text-amber-400' : 'bg-slate-100 text-slate-600'}`}
                                    >
                                        Ukuran 58mm
                                    </button>
                                </div>

                                <div id="printable-area" className={`mx-auto ${printThermalSize === '80mm' ? 'thermal-80mm' : 'thermal-58mm'} bg-white p-2 text-slate-900`}>
                                    <div className="text-center space-y-1 mb-2 border-b border-dashed border-slate-400 pb-2">
                                        <h2 className="font-black text-sm uppercase">{storeInfo.name}</h2>
                                        <p className="text-[10px]">{storeInfo.address}</p>
                                        <p className="text-[10px]">Telp: {storeInfo.phone}</p>
                                    </div>

                                    <div className="text-[10px] space-y-0.5 mb-2 border-b border-dashed border-slate-400 pb-2">
                                        <div className="flex justify-between">
                                            <span>No. Nota:</span>
                                            <span className="font-bold">{lastCompletedSale.id}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Tgl:</span>
                                            <span>{new Date(lastCompletedSale.date).toLocaleString('id-ID')}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Pelanggan:</span>
                                            <span>{lastCompletedSale.customer?.name || 'Umum'}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Status:</span>
                                            <span className="font-bold uppercase">{lastCompletedSale.status} ({lastCompletedSale.paymentMethod})</span>
                                        </div>
                                    </div>

                                    <div className="space-y-1 border-b border-dashed border-slate-400 pb-2 mb-2">
                                        {lastCompletedSale.items.map((item, idx) => (
                                            <div key={idx} className="text-[10px]">
                                                <div className="font-bold">{item.name}</div>
                                                <div className="flex justify-between">
                                                    <span>{item.qty} {item.unit} x {formatRupiah(item.price)}</span>
                                                    <span className="font-bold">{formatRupiah(item.price * item.qty)}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="text-[10px] space-y-0.5 border-b border-dashed border-slate-400 pb-2 mb-2">
                                        <div className="flex justify-between font-bold text-xs">
                                            <span>TOTAL:</span>
                                            <span>{formatRupiah(lastCompletedSale.total)}</span>
                                        </div>
                                        {lastCompletedSale.paymentMethod !== 'Kredit' && (
                                            <>
                                                <div className="flex justify-between">
                                                    <span>Bayar:</span>
                                                    <span>{formatRupiah(lastCompletedSale.paidAmount)}</span>
                                                </div>
                                                <div className="flex justify-between">
                                                    <span>Kembali:</span>
                                                    <span>{formatRupiah(lastCompletedSale.change)}</span>
                                                </div>
                                            </>
                                        )}
                                    </div>

                                    <div className="text-center text-[9px] text-slate-600 whitespace-pre-line pt-1">
                                        {storeInfo.receiptFooter}
                                    </div>
                                </div>

                                <button
                                    onClick={() => window.print()}
                                    className="mt-4 w-full py-3 bg-amber-500 text-slate-950 font-extrabold rounded-xl text-xs flex items-center justify-center gap-2 no-print active:scale-95 transition-transform"
                                >
                                    <i className="fas fa-print"></i>
                                    <span>Cetak Struk Thermal</span>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Modal 2: Kwitansi / Slip Pelunasan / Bon */}
                    {activeModal === 'kwitansi' && lastKwitansi && (() => {
                        const isUtang = lastKwitansi.type === 'UTANG' || lastKwitansi.type === 'UTANG_BARU';
                        const isBaru = lastKwitansi.type === 'PIUTANG_BARU' || lastKwitansi.type === 'UTANG_BARU';

                        let titleText = 'KWITANSI PEMBAYARAN PIUTANG';
                        let entityLabel = 'Telah Diterima Dari:';
                        let amountLabel = 'Jumlah Diterima (Rp):';
                        let remainingLabel = 'Sisa Piutang Tukang (Rp):';
                        let signLeftRole = 'Kasir Toko Bangunan';
                        let signRightRole = 'Penyetor / Tukang';

                        if (lastKwitansi.type === 'UTANG') {
                            titleText = 'SLIP PEMBAYARAN UTANG SUPPLIER';
                            entityLabel = 'Dibayarkan Kepada Supplier:';
                            amountLabel = 'Jumlah Dibayarkan (Rp):';
                            remainingLabel = 'Sisa Utang Toko (Rp):';
                            signLeftRole = 'Pemasok / Supplier';
                            signRightRole = 'Kasir Toko Bangunan';
                        } else if (lastKwitansi.type === 'UTANG_BARU') {
                            titleText = 'SLIP FAKTUR UTANG SUPPLIER';
                            entityLabel = 'Distributor / Supplier:';
                            amountLabel = 'Nilai Tagihan Faktur (Rp):';
                            remainingLabel = 'Total Utang Toko (Rp):';
                            signLeftRole = 'Penerima Barang';
                            signRightRole = 'Pemasok / Supplier';
                        } else if (lastKwitansi.type === 'PIUTANG_BARU') {
                            titleText = 'SLIP BON KASBON TUKANG';
                            entityLabel = 'Ditagihkan Kepada Tukang:';
                            amountLabel = 'Nominal Bon / Kasbon (Rp):';
                            remainingLabel = 'Total Kasbon Tukang (Rp):';
                            signLeftRole = 'Pemberi Kasbon / Kasir';
                            signRightRole = 'Penerima Barang / Tukang';
                        }

                        return (
                            <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
                                <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl relative text-xs">
                                    <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 no-print">
                                        <i className="fas fa-times text-lg"></i>
                                    </button>

                                    <div id="printable-area" className="bg-white p-3 border-2 border-slate-900 rounded-xl space-y-3">
                                        <div className="text-center border-b border-slate-900 pb-2">
                                            <h2 className="font-black text-sm text-slate-900">{storeInfo.name}</h2>
                                            <p className="text-[10px] text-slate-600">{storeInfo.address}</p>
                                            <div className="mt-1 inline-block px-2 py-0.5 bg-slate-900 text-amber-400 font-extrabold text-[10px] rounded uppercase">
                                                {titleText}
                                            </div>
                                        </div>

                                        <div className="flex justify-between text-[10px] text-slate-600">
                                            <span>No. Bukti: <strong className="text-slate-900">{lastKwitansi.id}</strong></span>
                                            <span>Tanggal: <strong>{new Date(lastKwitansi.date).toLocaleDateString('id-ID')}</strong></span>
                                        </div>

                                        <div className="text-xs space-y-2">
                                            <div className="flex">
                                                <span className="w-40 font-bold text-slate-600">{entityLabel}</span>
                                                <span className="font-black text-slate-900 flex-1">{lastKwitansi.entityName} ({lastKwitansi.entityType || (isUtang ? 'Supplier' : 'Tukang')})</span>
                                            </div>
                                            <div className="flex items-center">
                                                <span className="w-40 font-bold text-slate-600">{amountLabel}</span>
                                                <span className={`font-black text-sm px-2 py-0.5 rounded border ${isBaru ? 'text-rose-700 bg-rose-100 border-rose-200' : 'text-emerald-700 bg-emerald-100 border-emerald-200'}`}>
                                                    {formatRupiah(lastKwitansi.amountPaid)}
                                                </span>
                                            </div>
                                            <div className="flex">
                                                <span className="w-40 font-bold text-slate-600">Keterangan / Catatan:</span>
                                                <span className="italic flex-1">{lastKwitansi.note || '-'}</span>
                                            </div>
                                            <div className="flex">
                                                <span className="w-40 font-bold text-slate-600">Metode Transaksi:</span>
                                                <span className="font-bold">{lastKwitansi.method || 'Tunai'}</span>
                                            </div>
                                            <div className="flex">
                                                <span className="w-40 font-bold text-slate-600">{remainingLabel}</span>
                                                <span className={`font-extrabold ${isUtang ? 'text-amber-700' : 'text-rose-600'}`}>
                                                    {formatRupiah(lastKwitansi.remainingDebt)}
                                                </span>
                                            </div>
                                            {lastKwitansi.proofImage && (
                                                <div className="pt-2 border-t border-slate-200">
                                                    <p className="font-bold text-slate-600 text-[10px] mb-1">Lampiran Foto Nota / Faktur Supplier:</p>
                                                    <img src={lastKwitansi.proofImage} alt="Foto Faktur" className="h-20 w-auto object-cover rounded-lg border border-slate-300" />
                                                </div>
                                            )}
                                        </div>

                                        <div className="pt-6 flex justify-between items-end text-xs">
                                            <div className="text-center">
                                                <p className="text-[10px] text-slate-500 mb-10">{signLeftRole}</p>
                                                <p className="font-bold border-t border-slate-900 pt-1 min-w-[110px]">{storeInfo.name}</p>
                                            </div>
                                            <div className="text-center">
                                                <p className="text-[10px] text-slate-500 mb-10">{signRightRole}</p>
                                                <p className="font-bold border-t border-slate-900 pt-1 min-w-[110px]">{lastKwitansi.entityName}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <button
                                        onClick={() => window.print()}
                                        className="mt-4 w-full py-3 bg-slate-900 text-amber-400 font-extrabold rounded-xl text-xs flex items-center justify-center gap-2 no-print active:scale-95 transition-transform"
                                    >
                                        <i className="fas fa-print"></i>
                                        <span>Cetak Slip / Kwitansi</span>
                                    </button>
                                </div>
                            </div>
                        );
                    })()}

                    {/* Modal 3: Purchase Form (Kulakan Distributor) */}
                    {activeModal === 'purchase_form' && (
                        <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
                            <div className="bg-white w-full max-w-2xl rounded-2xl p-5 sm:p-6 shadow-2xl relative text-xs">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <h3 className="font-bold text-slate-900 text-base mb-1">Catat Pembelian & Kulakan dari Distributor</h3>
                                <p className="text-xs text-slate-500 mb-3">Stok barang akan bertambah secara otomatis & HPP produk akan diperbarui.</p>

                                <form onSubmit={handleSavePurchase} className="space-y-4">
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Supplier / Distributor:</label>
                                            <select
                                                value={selectedPurchaseSupplierId}
                                                onChange={e => setSelectedPurchaseSupplierId(e.target.value)}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                                required
                                            >
                                                <option value="">-- Pilih Supplier --</option>
                                                {suppliers.map(s => (
                                                    <option key={s.id} value={s.id}>{s.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">No. Faktur Distributor:</label>
                                            <input
                                                type="text"
                                                value={purchaseInvoiceNo}
                                                onChange={e => setPurchaseInvoiceNo(e.target.value)}
                                                placeholder="FAK-xxxxxx"
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Metode Bayar:</label>
                                            <select
                                                value={purchasePaymentMethod}
                                                onChange={e => setPurchasePaymentMethod(e.target.value)}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                            >
                                                <option value="Tunai">Tunai / Cash</option>
                                                <option value="Transfer">Transfer Bank</option>
                                                <option value="Tempo">Tempo (Masuk Utang)</option>
                                            </select>
                                        </div>
                                    </div>

                                    {/* Sub-form Add Item to Purchase Cart */}
                                    <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                                        <label className="block font-bold text-slate-800 text-xs">Pilih Barang Material Yang Dibeli:</label>
                                        <div className="grid grid-cols-1 sm:grid-cols-12 gap-2">
                                            <div className="sm:col-span-5">
                                                <select
                                                    value={addItemProdId}
                                                    onChange={e => {
                                                        const pId = e.target.value;
                                                        setAddItemProdId(pId);
                                                        const p = products.find(x => x.id === pId);
                                                        if (p) setAddItemBuyPrice(p.buyPrice || '');
                                                    }}
                                                    className="w-full bg-white border border-slate-200 rounded-xl p-2 font-bold text-xs"
                                                >
                                                    <option value="">-- Pilih Produk Material --</option>
                                                    {products.map(p => (
                                                        <option key={p.id} value={p.id}>{p.name} ({p.unit})</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div className="sm:col-span-2">
                                                <input
                                                    type="number"
                                                    value={addItemQty}
                                                    onChange={e => setAddItemQty(e.target.value)}
                                                    placeholder="Qty"
                                                    className="w-full bg-white border border-slate-200 rounded-xl p-2 font-bold text-xs"
                                                />
                                            </div>
                                            <div className="sm:col-span-3">
                                                <input
                                                    type="number"
                                                    value={addItemBuyPrice}
                                                    onChange={e => setAddItemBuyPrice(e.target.value)}
                                                    placeholder="Harga HPP (Rp)"
                                                    className="w-full bg-white border border-slate-200 rounded-xl p-2 font-bold text-xs"
                                                />
                                            </div>
                                            <div className="sm:col-span-2">
                                                <button
                                                    type="button"
                                                    onClick={handleAddItemToPurchaseCart}
                                                    className="w-full py-2 bg-slate-900 text-amber-400 font-extrabold rounded-xl text-xs hover:bg-slate-800"
                                                >
                                                    + Tambah
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Purchase Cart Table */}
                                    <div className="border border-slate-200 rounded-xl overflow-hidden">
                                        <table className="w-full text-left text-xs">
                                            <thead className="bg-slate-100 font-bold uppercase text-[10px]">
                                                <tr>
                                                    <th className="p-2">Barang</th>
                                                    <th className="p-2">Qty</th>
                                                    <th className="p-2">Harga HPP</th>
                                                    <th className="p-2">Subtotal</th>
                                                    <th className="p-2 text-right">Aksi</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {purchaseCart.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="5" className="p-4 text-center text-slate-400 italic">Belum ada item ditambahkan ke nota pembelian.</td>
                                                    </tr>
                                                ) : (
                                                    purchaseCart.map((item, idx) => (
                                                        <tr key={idx}>
                                                            <td className="p-2 font-bold text-slate-900">{item.name}</td>
                                                            <td className="p-2 font-bold">{item.qty} {item.unit}</td>
                                                            <td className="p-2">{formatRupiah(item.buyPrice)}</td>
                                                            <td className="p-2 font-black text-slate-900">{formatRupiah(item.buyPrice * item.qty)}</td>
                                                            <td className="p-2 text-right">
                                                                <button
                                                                    type="button"
                                                                    onClick={() => setPurchaseCart(prev => prev.filter((_, i) => i !== idx))}
                                                                    className="text-rose-500 hover:text-rose-700"
                                                                >
                                                                    <i className="fas fa-trash"></i>
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>

                                    <div className="flex justify-between items-center bg-amber-50 p-3 rounded-xl border border-amber-200">
                                        <span className="font-extrabold text-slate-900">Total Biaya Kulakan:</span>
                                        <span className="font-black text-base text-slate-900">
                                            {formatRupiah(purchaseCart.reduce((sum, item) => sum + (item.buyPrice * item.qty), 0))}
                                        </span>
                                    </div>

                                    {/* Image Proof Upload */}
                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">Upload Bukti Foto Faktur / Nota (JPG/PNG):</label>
                                        <input

                                    <i className="fas fa-user-minus"></i>
                                </div>
                                <h3 className="font-extrabold text-slate-900 text-sm">Hapus Kontak {deletingContact.name}?</h3>
                                <p className="text-xs text-slate-500">Kontak yang dihapus tidak dapat dipulihkan kembali dari direktori.</p>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setActiveModal(null)} className="flex-1 py-2.5 bg-slate-100 font-bold rounded-xl text-xs text-slate-700">Batal</button>
                                    <button onClick={handleDeleteContact} className="flex-1 py-2.5 bg-rose-600 font-extrabold rounded-xl text-xs text-white shadow">Ya, Hapus</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal 13: Confirm Delete Product */}
                    {activeModal === 'confirm_delete_product' && (
                        <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl text-center space-y-3">
                                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-lg font-black">
                                    <i className="fas fa-trash"></i>
                                </div>
                                <h3 className="font-extrabold text-slate-900 text-sm">Hapus Produk Ini?</h3>
                                <p className="text-xs text-slate-500">Produk yang dihapus tidak dapat dipulihkan kembali dari katalog lokal.</p>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setActiveModal(null)} className="flex-1 py-2.5 bg-slate-100 font-bold rounded-xl text-xs text-slate-700">Batal</button>
                                    <button onClick={handleConfirmDeleteProduct} className="flex-1 py-2.5 bg-rose-600 font-extrabold rounded-xl text-xs text-white shadow">Ya, Hapus</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal 14: Confirm Reset Database */}
                    {activeModal === 'confirm_reset_database' && (
                        <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl text-center space-y-3">
                                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-lg font-black">
                                    <i className="fas fa-triangle-exclamation"></i>
                                </div>
                                <h3 className="font-extrabold text-slate-900 text-sm">Reset Seluruh Database Toko?</h3>
                                <p className="text-xs text-slate-500">Semua riwayat transaksi penjualan, pembelian, produk, dan catatan piutang/utang akan dihapus dari penyimpanan lokal.</p>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setActiveModal(null)} className="flex-1 py-2.5 bg-slate-100 font-bold rounded-xl text-xs text-slate-700">Batal</button>
                                    <button onClick={handleConfirmResetDatabase} className="flex-1 py-2.5 bg-rose-600 font-extrabold rounded-xl text-xs text-white shadow">Reset Total</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal 15: Pay Piutang Tukang */}
                    {activeModal === 'pay_piutang' && selectedDebtCustomer && (
                        <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
                            <div className="bg-white w-full max-w-md rounded-2xl p-5 sm:p-6 shadow-2xl relative">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <h3 className="font-bold text-slate-900 text-base mb-1">Pembayaran Piutang Tukang</h3>
                                <p className="text-xs text-slate-500 mb-3">Pelanggan: <strong className="text-slate-900">{selectedDebtCustomer.name}</strong></p>

                                <form onSubmit={handlePayPiutang} className="space-y-3 text-xs">
                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                        <div className="flex justify-between text-xs">
                                            <span className="text-slate-500 font-bold">Total Sisa Kasbon Saat Ini:</span>
                                            <span className="font-extrabold text-rose-600">{formatRupiah(selectedDebtCustomer.currentDebt)}</span>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">Nominal Pembayaran (IDR):</label>
                                        <input
                                            type="number"
                                            value={payAmountInput}
                                            onChange={e => setPayAmountInput(e.target.value)}
                                            placeholder="Masukkan nominal..."
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-extrabold text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                            required
                                        />
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">Metode Bayar:</label>
                                        <select
                                            value={paymentMethod}
                                            onChange={e => setPaymentMethod(e.target.value)}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                        >
                                            <option value="Tunai">Tunai / Cash</option>
                                            <option value="Transfer">Transfer Bank</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">Catatan Pembayaran:</label>
                                        <input
                                            type="text"
                                            value={paymentNote}
                                            onChange={e => setPaymentNote(e.target.value)}
                                            placeholder="Misal: Cicilan nota semen minggu lalu..."
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"
                                        />
                                    </div>

                                    <button type="submit" className="w-full py-3.5 bg-amber-500 text-slate-950 font-extrabold rounded-xl text-xs shadow-md active:scale-95">
                                        Proses Bayar & Terbit Kwitansi
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal 16: Pay Utang Supplier */}
                    {activeModal === 'pay_utang' && selectedDebtSupplier && (
                        <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
                            <div className="bg-white w-full max-w-md rounded-2xl p-5 sm:p-6 shadow-2xl relative">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <h3 className="font-bold text-slate-900 text-base mb-1">Pembayaran Utang Toko ke Supplier</h3>
                                <p className="text-xs text-slate-500 mb-3">Supplier: <strong className="text-slate-900">{selectedDebtSupplier.name}</strong></p>

                                <form onSubmit={handlePayUtang} className="space-y-3 text-xs">
                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                        <div className="flex justify-between text-xs">
                                            <span className="text-slate-500 font-bold">Total Tanggungan Utang:</span>
                                            <span className="font-extrabold text-slate-900">{formatRupiah(selectedDebtSupplier.currentDebt)}</span>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">Nominal Pembayaran (IDR):</label>
                                        <input
                                            type="number"
                                            value={payAmountInput}
                                            onChange={e => setPayAmountInput(e.target.value)}
                                            placeholder="Masukkan nominal..."
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-extrabold text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                            required
                                        />
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">Metode Bayar:</label>
                                        <select
                                            value={paymentMethod}
                                            onChange={e => setPaymentMethod(e.target.value)}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                        >
                                            <option value="Tunai">Tunai / Cash</option>
                                            <option value="Transfer">Transfer Bank</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">Catatan Pembayaran:</label>
                                        <input
                                            type="text"
                                            value={paymentNote}
                                            onChange={e => setPaymentNote(e.target.value)}
                                            placeholder="Misal: Pelunasan faktur besi..."
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"
                                        />
                                    </div>

                                    <button type="submit" className="w-full py-3.5 bg-slate-900 text-amber-400 font-extrabold rounded-xl text-xs shadow-md active:scale-95">
                                        Proses Bayar & Terbit Kwitansi
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal 17: Product Form */}
                    {activeModal === 'product_form' && (
                        <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
                            <div className="bg-white w-full max-w-lg rounded-2xl p-5 sm:p-6 shadow-2xl relative">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <h3 className="font-bold text-slate-900 text-base mb-3">
                                    {editingProduct ? 'Edit Data Barang Material' : 'Tambah Produk Material Baru'}
                                </h3>

                                <form onSubmit={handleSaveProduct} className="space-y-3 text-xs">
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Kode SKU / Barcode:</label>
                                            <div className="flex gap-1">
                                                <input
                                                    type="text"
                                                    name="sku"
                                                    value={editingProduct ? undefined : (scannedSkuForForm || undefined)}
                                                    defaultValue={editingProduct?.sku || (scannedSkuForForm ? undefined : 'SMN-' + Math.floor(100 + Math.random() * 900))}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                                    required
                                                />
                                                <button
                                                    type="button"
                                                    onClick={() => { setScanTargetField('sku_input'); setIsScannerOpen(true); }}
                                                    className="px-2.5 bg-slate-800 text-amber-400 rounded-xl font-bold hover:bg-slate-700 text-xs shrink-0"
                                                    title="Scan Barcode Fisik Barang"
                                                >
                                                    <i className="fas fa-barcode"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Kategori:</label>
                                            <select
                                                name="category"
                                                defaultValue={editingProduct?.category || categories[0]}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                            >
                                                {categories.map(cat => (
                                                    <option key={cat} value={cat}>{cat}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">Nama Barang Material:</label>
                                        <input
                                            type="text"
                                            name="name"
                                            defaultValue={editingProduct?.name || ''}
                                            placeholder="Contoh: Semen Gresik 40kg / Besi Beton 10mm SNI"
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                            required
                                        />
                                    </div>

                                    <div className="grid grid-cols-3 gap-2">
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Satuan Utama:</label>
                                            <input
                                                type="text"
                                                name="unit"
                                                defaultValue={editingProduct?.unit || 'Sak'}
                                                placeholder="Sak / Btg / Dus"
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Harga Beli (HPP):</label>
                                            <input
                                                type="number"
                                                name="buyPrice"
                                                defaultValue={editingProduct?.buyPrice || ''}
                                                placeholder="0"
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Harga Jual Toko:</label>
                                            <input
                                                type="number"
                                                name="sellPrice"
                                                defaultValue={editingProduct?.sellPrice || ''}
                                                placeholder="0"
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                                required
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Stok Saat Ini:</label>
                                            <input
                                                type="number"
                                                name="stock"
                                                defaultValue={editingProduct?.stock || 0}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Batas Stok Minimal:</label>
                                            <input
                                                type="number"
                                                name="minStock"
                                                defaultValue={editingProduct?.minStock || 5}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                                required
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">Catatan Konversi Satuan (Opsional):</label>
                                        <input
                                            type="text"
                                            name="conversionNote"
                                            defaultValue={editingProduct?.conversionNote || ''}
                                            placeholder="Misal: 1 Dus = 1.44 M2, 1 Sak = 40 Kg"
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"
                                        />
                                    </div>

                                    <button type="submit" className="w-full py-3.5 bg-amber-500 text-slate-950 font-extrabold rounded-xl text-xs shadow-md active:scale-95">
                                        Simpan Data Barang
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal 18: Contact Form */}
                    {activeModal === 'contact_form' && (
                        <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
                            <div className="bg-white w-full max-w-md rounded-2xl p-5 sm:p-6 shadow-2xl relative">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <h3 className="font-bold text-slate-900 text-base mb-3">
                                    {editingContact ? `Edit Data ${contactType === 'pelanggan' ? 'Pelanggan' : 'Supplier'}` : `Tambah ${contactType === 'pelanggan' ? 'Pelanggan / Tukang' : 'Supplier / Distributor'} Baru`}
                                </h3>

                                <form onSubmit={handleSaveContact} className="space-y-3 text-xs">
                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">Nama Lengkap / Toko Supplier:</label>
                                        <input
                                            type="text"
                                            name="contactName"
                                            defaultValue={editingContact?.name || ''}
                                            placeholder="Misal: Pak Budi Tukang / PT Semen Indonesia"
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                            required
                                        />
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">No. WhatsApp / Telepon:</label>
                                        <input
                                            type="text"
                                            name="contactPhone"
                                            defaultValue={editingContact?.phone || ''}
                                            placeholder="08xxxxxxxxxx"
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                        />
                                    </div>

                                    {contactType === 'pelanggan' && (
                                        <>
                                            <div>
                                                <label className="block font-semibold text-slate-700 mb-1">Alamat Lengkap / Lokasi Proyek:</label>
                                                <textarea
                                                    name="contactAddress"
                                                    defaultValue={editingContact?.address || ''}
                                                    rows="2"
                                                    placeholder="Jl. Merdeka No. 12, Proyek Perumahan A"
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"
                                                ></textarea>
                                            </div>

                                            <div className="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label className="block font-semibold text-slate-700 mb-1">Tipe Pelanggan:</label>
                                                    <select
                                                        name="customerType"
                                                        defaultValue={editingContact?.type || 'Tukang'}
                                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                                    >
                                                        <option value="Tukang">Tukang Bangunan</option>
                                                        <option value="Kontraktor">Kontraktor / Proyek</option>
                                                        <option value="Umum">Pelanggan Umum</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block font-semibold text-slate-700 mb-1">Batas Limit Kasbon (IDR):</label>
                                                    <input
                                                        type="number"
                                                        name="maxLimit"
                                                        defaultValue={editingContact?.maxLimit || 5000000}
                                                        placeholder="0 = Tanpa Limit"
                                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold"
                                                    />
                                                </div>
                                            </div>
                                        </>
                                    )}

                                    <button type="submit" className="w-full py-3.5 bg-amber-500 text-slate-950 font-extrabold rounded-xl text-xs shadow-md active:scale-95">
                                        Simpan Data Kontak
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal 21: Interactive QRIS Payment Pop-up */}
                    {activeModal === 'qris_pay_modal' && (
                        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl text-center space-y-4 relative">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                                    <i className="fas fa-times text-lg"></i>
                                </button>

                                <div className="flex items-center justify-center gap-2 border-b pb-2">
                                    <div className="w-8 h-8 rounded-xl bg-indigo-600 text-white font-black flex items-center justify-center text-sm">
                                        <i className="fas fa-qrcode"></i>
                                    </div>
                                    <div className="text-left">
                                        <h3 className="font-black text-slate-900 text-sm">Pembayaran QRIS Kasir</h3>
                                        <p className="text-[10px] text-slate-500">Scan dengan BCA, GoPay, OVO, Dana, ShopeePay, dll</p>
                                    </div>
                                </div>

                                <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                                    <div className="font-extrabold text-slate-900 text-xs">{storeInfo.qrisName || storeInfo.name}</div>
                                    {storeInfo.qrisNmid && <div className="text-[10px] text-slate-500 font-mono">NMID: {storeInfo.qrisNmid}</div>}

                                    <div className="bg-white p-3 rounded-xl border border-slate-200 flex flex-col items-center justify-center shadow-inner my-2">
                                        {storeInfo.qrisImage ? (
                                            <img src={storeInfo.qrisImage} alt="QRIS Merchant" className="w-48 h-48 object-contain rounded-lg" />
                                        ) : (
                                            <div className="w-48 h-48 bg-slate-100 rounded-lg flex flex-col items-center justify-center p-4 text-center border-2 border-dashed border-slate-300 space-y-2">
                                                <i className="fas fa-qrcode text-4xl text-indigo-400"></i>
                                                <p className="text-[10px] text-slate-500 font-bold">QRIS Toko Belum Diupload</p>
                                                <p className="text-[9px] text-slate-400">Atur gambar QRIS resmi toko di menu Pengaturan Toko.</p>
                                            </div>
                                        )}
                                    </div>

                                    <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-2 text-center">
                                        <span className="text-[10px] font-bold text-indigo-800 uppercase block">Total Nominal Scan QRIS</span>
                                        <span className="text-base font-black text-indigo-950">{formatRupiah(cartSubtotal)}</span>
                                    </div>
                                </div>

                                <button
                                    onClick={(e) => {
                                        setActiveModal(null);
                                        handleCheckout(e);
                                    }}
                                    className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2"
                                >
                                    <i className="fas fa-check-circle text-sm"></i>
                                    <span>Konfirmasi Pembayaran QRIS Selesai</span>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Modal 19: Lightbox Foto Modal */}
                    {activeModal === 'view_proof_image' && viewImageModalUrl && (
                        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4" onClick={() => setActiveModal(null)}>
                            <div className="bg-white rounded-2xl p-4 max-w-lg w-full relative" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-3 pb-2 border-b">
                                    <h3 className="font-extrabold text-xs text-slate-900">Bukti Foto Faktur / Nota / Mutasi</h3>
                                    <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fas fa-times text-base"></i>
                                    </button>
                                </div>
                                <div className="max-h-[75vh] overflow-y-auto flex justify-center bg-slate-100 rounded-xl p-2">
                                    <img src={viewImageModalUrl} alt="Bukti Foto" className="max-w-full h-auto rounded-lg object-contain" />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal 20: Barcode / QR Code Camera Scanner */}
                    {isScannerOpen && (
                        <BarcodeScannerModal
                            onClose={() => setIsScannerOpen(false)}
                            onScanSuccess={(scannedText) => {
                                playBeepSound();
                                if (scanTargetField === 'cart') {
                                    const targetProd = products.find(p => p.sku.toLowerCase() === scannedText.toLowerCase() || p.id.toLowerCase() === scannedText.toLowerCase());
                                    if (targetProd) {
                                        addToCart(targetProd);
                                        showToast(`Scan Berhasil! Ditambahkan: ${targetProd.name}`);
                                    } else {
                                        setSearchTerm(scannedText);
                                        showToast(`SKU/Barcode "${scannedText}" tidak ditemukan. Menampilkan pencarian.`, 'error');
                                    }
                                } else if (scanTargetField === 'sku_input') {
                                    setScannedSkuForForm(scannedText);
                                    showToast(`SKU Barcode "${scannedText}" berhasil disalin ke form.`);
                                    setIsScannerOpen(false);
                                }
                            }}
                        />
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MaterialPOSApp />);
    </script>
</body>
</html>
