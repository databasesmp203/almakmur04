<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>MaterialPOS Pro v5.0 Ultimate - Kasir Toko Bangunan</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            900: '#78350f',
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome & Inter Font -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- HTML5 QR & Barcode Scanner CDN -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #printable-area, #printable-area * {
                visibility: visible;
            }
            #printable-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
        }

        .thermal-80mm {
            width: 300px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            line-height: 1.2;
        }

        .thermal-58mm {
            width: 220px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            line-height: 1.1;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased select-none min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const DEFAULT_STORE_INFO = {
            name: 'TB. JAYA MATERIAL PRO',
            tagline: 'Penyedia Bahan Bangunan & Alat Pertukangan Lengkap',
            address: 'Jl. Raya Industri Material No. 88, Kota Maju',
            phone: '0812-3456-7890',
            email: 'admin@jayamaterial.com',
            bankInfo: 'BCA 8830123456 a/n TB Jaya Material',
            qrisName: 'TB. JAYA MATERIAL PRO',
            qrisNmid: 'ID1020304050607',
            qrisImage: '',
            receiptFooter: 'Terima Kasih Atas Kunjungan Anda!\nBarang yang telah dibeli tidak dapat ditukar/dikembalikan.',
            appsScriptUrl: ''
        };

        const DEFAULT_CATEGORIES = [
            'Semen & Adukan',
            'Besi & Baja',
            'Cat & Thinner',
            'Keramik & Granit',
            'Pipa & Sanitari',
            'Kayu & Triplek',
            'Paku & Mur Baut',
            'Lain-lain'
        ];

        const DEFAULT_CUSTOMERS = [
            { id: 'CUST-000', name: 'Pelanggan Umum (Eceran)', phone: '-', address: '-', type: 'Umum', maxLimit: 0, currentDebt: 0 }
        ];

        const formatRupiah = (num) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(num || 0);
        };

        const playBeepSound = () => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) {}
        };

        function BarcodeScannerModal({ onClose, onScanSuccess }) {
            const [scannerStatus, setScannerStatus] = React.useState('Menginisialisasi kamera...');
            const [manualCode, setManualCode] = React.useState('');
            const html5QrcodeRef = React.useRef(null);

            React.useEffect(() => {
                let isMounted = true;

                const initScanner = async () => {
                    try {
                        const devices = await Html5Qrcode.getCameras();
                        if (!isMounted) return;

                        if (devices && devices.length > 0) {
                            const backCam = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear') || d.label.toLowerCase().includes('environment')) || devices[devices.length - 1];
                            const html5Qrcode = new Html5Qrcode("interactive-qr-reader");
                            html5QrcodeRef.current = html5Qrcode;

                            await html5Qrcode.start(
                                backCam.id,
                                { fps: 10, qrbox: { width: 250, height: 160 } },
                                (decodedText) => {
                                    if (isMounted) onScanSuccess(decodedText);
                                },
                                () => {}
                            );
                            if (isMounted) setScannerStatus('Arahkan kamera ke Barcode / QR Code barang');
                        } else {
                            if (isMounted) setScannerStatus('Kamera tidak ditemukan pada perangkat ini.');
                        }
                    } catch (err) {
                        if (isMounted) setScannerStatus('Izin kamera ditolak atau tidak tersedia.');
                    }
                };

                const timer = setTimeout(initScanner, 300);

                return () => {
                    isMounted = false;
                    clearTimeout(timer);
                    if (html5QrcodeRef.current) {
                        try {
                            html5QrcodeRef.current.stop().catch(() => {}).then(() => {
                                try { html5QrcodeRef.current.clear(); } catch(e){}
                            });
                        } catch(e) {}
                    }
                };
            }, []);

            const handleManualSubmit = (e) => {
                e.preventDefault();
                if (!manualCode.trim()) return;
                onScanSuccess(manualCode.trim());
                setManualCode('');
            };

            return (
                <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                    <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl relative text-xs space-y-3">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 z-10">
                            <i className="fas fa-times text-lg"></i>
                        </button>

                        <div className="flex items-center gap-2 border-b pb-2">
                            <div className="w-8 h-8 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-black">
                                <i className="fas fa-barcode"></i>
                            </div>
                            <div>
                                <h3 className="font-extrabold text-slate-900 text-sm">Scanner Barcode & QR Code</h3>
                                <p className="text-[10px] text-slate-500">Scan otomatis SKU/Barcode material bangunan</p>
                            </div>
                        </div>

                        <div className="bg-slate-900 rounded-xl overflow-hidden relative min-h-[220px] flex flex-col items-center justify-center text-white p-2">
                            <div id="interactive-qr-reader" className="w-full"></div>
                            <div className="text-center p-2 text-[11px] text-amber-400 font-bold">
                                <i className="fas fa-camera mr-1"></i>
                                <span>{scannerStatus}</span>
                            </div>
                        </div>

                        <form onSubmit={handleManualSubmit} className="pt-2 border-t space-y-1.5">
                            <label className="block text-[10px] font-bold text-slate-500">Atau Masukkan SKU Barcode Manual / Handheld Scanner:</label>
                            <div className="flex gap-2">
                                <input
                                    type="text"
                                    value={manualCode}
                                    onChange={e => setManualCode(e.target.value)}
                                    placeholder="Ketik/Scan dengan USB Gun Scanner..."
                                    className="flex-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-mono text-xs font-bold"
                                    autoFocus
                                />
                                <button type="submit" className="px-3.5 bg-amber-500 text-slate-950 font-extrabold rounded-xl text-xs hover:bg-amber-400">
                                    Proses
                                </button>
                            </div>
                        </form>

                        <div className="flex justify-between items-center text-[10px] text-slate-400 pt-1">
                            <span>Mendukung Barcode USB Gun, Kamera HP & Tablet</span>
                            <button onClick={onClose} className="text-slate-600 font-bold hover:underline">Tutup Scanner</button>
                        </div>
                    </div>
                </div>
            );
        }

        function MaterialPOSApp() {
            // Persistent States
            const [storeInfo, setStoreInfo] = React.useState(() => {
                const saved = localStorage.getItem('mpos_store_info');
                return saved ? { ...DEFAULT_STORE_INFO, ...JSON.parse(saved) } : DEFAULT_STORE_INFO;
            });

            const [categories, setCategories] = React.useState(() => {
                const saved = localStorage.getItem('mpos_categories');
                return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
            });

            const [products, setProducts] = React.useState(() => {
                const saved = localStorage.getItem('mpos_products');
                return saved ? JSON.parse(saved) : [];
            });

            const [customers, setCustomers] = React.useState(() => {
                const saved = localStorage.getItem('mpos_customers');
                return saved ? JSON.parse(saved) : DEFAULT_CUSTOMERS;
            });

            const [suppliers, setSuppliers] = React.useState(() => {
                const saved = localStorage.getItem('mpos_suppliers');
                return saved ? JSON.parse(saved) : [];
            });

            const [sales, setSales] = React.useState(() => {
                const saved = localStorage.getItem('mpos_sales');
                return saved ? JSON.parse(saved) : [];
            });

            const [mutations, setMutations] = React.useState(() => {
                const saved = localStorage.getItem('mpos_mutations');
                return saved ? JSON.parse(saved) : [];
            });

            const [debtPayments, setDebtPayments] = React.useState(() => {
                const saved = localStorage.getItem('mpos_debt_payments');
                return saved ? JSON.parse(saved) : [];
            });

            const [purchases, setPurchases] = React.useState(() => {
                const saved = localStorage.getItem('mpos_purchases');
                return saved ? JSON.parse(saved) : [];
            });

            const [activeTab, setActiveTab] = React.useState('pos');
            const [activeModal, setActiveModal] = React.useState(null);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = React.useState(false);
            const [isFullscreen, setIsFullscreen] = React.useState(false);
            const [isSyncing, setIsSyncing] = React.useState(false);

            // Toast Alert State
            const [toast, setToast] = React.useState({ show: false, message: '', type: 'success' });

            const showToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3500);
            };

            // LocalStorage Auto Save
            React.useEffect(() => { localStorage.setItem('mpos_store_info', JSON.stringify(storeInfo)); }, [storeInfo]);
            React.useEffect(() => { localStorage.setItem('mpos_categories', JSON.stringify(categories)); }, [categories]);
            React.useEffect(() => { localStorage.setItem('mpos_products', JSON.stringify(products)); }, [products]);
            React.useEffect(() => { localStorage.setItem('mpos_customers', JSON.stringify(customers)); }, [customers]);
            React.useEffect(() => { localStorage.setItem('mpos_suppliers', JSON.stringify(suppliers)); }, [suppliers]);
            React.useEffect(() => { localStorage.setItem('mpos_sales', JSON.stringify(sales)); }, [sales]);
            React.useEffect(() => { localStorage.setItem('mpos_mutations', JSON.stringify(mutations)); }, [mutations]);
            React.useEffect(() => { localStorage.setItem('mpos_debt_payments', JSON.stringify(debtPayments)); }, [debtPayments]);
            React.useEffect(() => { localStorage.setItem('mpos_purchases', JSON.stringify(purchases)); }, [purchases]);

            // POS Cashier
            const [cart, setCart] = React.useState([]);
            const [selectedCategory, setSelectedCategory] = React.useState('Semua');
            const [searchTerm, setSearchTerm] = React.useState('');
            const [selectedCustomerId, setSelectedCustomerId] = React.useState('CUST-000');
            const [paymentMethod, setPaymentMethod] = React.useState('Tunai');
            const [amountPaidInput, setAmountPaidInput] = React.useState('');
            const [printThermalSize, setPrintThermalSize] = React.useState('80mm');
            const [lastCompletedSale, setLastCompletedSale] = React.useState(null);

            // Purchases
            const [purchaseCart, setPurchaseCart] = React.useState([]);
            const [selectedPurchaseSupplierId, setSelectedPurchaseSupplierId] = React.useState('');
            const [purchaseInvoiceNo, setPurchaseInvoiceNo] = React.useState('');
            const [purchasePaymentMethod, setPurchasePaymentMethod] = React.useState('Tunai');
            const [purchaseProofImage, setPurchaseProofImage] = React.useState('');
            const [selectedPurchaseDetail, setSelectedPurchaseDetail] = React.useState(null);
            const [purchaseSearchTerm, setPurchaseSearchTerm] = React.useState('');
            const [addItemProdId, setAddItemProdId] = React.useState('');
            const [addItemQty, setAddItemQty] = React.useState('1');
            const [addItemBuyPrice, setAddItemBuyPrice] = React.useState('');

            // Dialog / Modal Form Sub-states
            const [editingProduct, setEditingProduct] = React.useState(null);
            const [deletingProductId, setDeletingProductId] = React.useState(null);
            const [editingContact, setEditingContact] = React.useState(null);
            const [contactType, setContactType] = React.useState('pelanggan');
            const [deletingContact, setDeletingContact] = React.useState(null);
            const [selectedDebtCustomer, setSelectedDebtCustomer] = React.useState(null);
            const [selectedDebtSupplier, setSelectedDebtSupplier] = React.useState(null);
            const [selectedDistributorDetail, setSelectedDistributorDetail] = React.useState(null);
            const [selectedCustomerDebtDetail, setSelectedCustomerDebtDetail] = React.useState(null);
            const [payAmountInput, setPayAmountInput] = React.useState('');
            const [paymentNote, setPaymentNote] = React.useState('');
            const [manualDebtFormData, setManualDebtFormData] = React.useState({ entityId: '', amount: '', note: '', proofImage: '' });
            const [newCategoryInput, setNewCategoryInput] = React.useState('');
            const [lastKwitansi, setLastKwitansi] = React.useState(null);
            const [selectedSaleDetail, setSelectedSaleDetail] = React.useState(null);
            const [viewImageModalUrl, setViewImageModalUrl] = React.useState(null);

            // Barcode Scanner State
            const [isScannerOpen, setIsScannerOpen] = React.useState(false);
            const [scanTargetField, setScanTargetField] = React.useState('cart');
            const [scannedSkuForForm, setScannedSkuForForm] = React.useState('');

            // Filters
            const [salesSearchTerm, setSalesSearchTerm] = React.useState('');
            const [salesStatusFilter, setSalesStatusFilter] = React.useState('Semua');

            // Stock Mutation Form State
            const [mutationFormData, setMutationFormData] = React.useState({
                productId: '', type: 'MASUK', qty: '', supplierId: '', note: '', proofImage: ''
            });

            const syncToAppsScript = async (actionType, payloadData) => {
                if (!storeInfo.appsScriptUrl || !storeInfo.appsScriptUrl.startsWith('http')) return;
                setIsSyncing(true);
                try {
                    await fetch(storeInfo.appsScriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: actionType, data: payloadData, store: storeInfo.name, timestamp: new Date().toISOString() })
                    });
                } catch (err) {
                    console.error('Error Sync Apps Script:', err);
                } finally {
                    setIsSyncing(false);
                }
            };

            const pullDataFromSpreadsheet = async () => {
                if (!storeInfo.appsScriptUrl || !storeInfo.appsScriptUrl.startsWith('http')) {
                    showToast('Isi dan simpan URL Google Apps Script terlebih dahulu!', 'error');
                    return;
                }
                setIsSyncing(true);
                showToast('Mengambil data dari Google Sheets...', 'success');
                try {
                    const fetchUrl = `${storeInfo.appsScriptUrl}?action=GET_ALL_DATA`;
                    const res = await fetch(fetchUrl);
                    if (!res.ok) throw new Error('Respon server error');
                    const json = await res.json();
                    if (json.status === 'success') {
                        if (Array.isArray(json.products) && json.products.length > 0) {
                            const formattedProds = json.products.map((p, idx) => ({
                                id: p['ID Produk'] || p.id || 'PRD-' + idx,
                                sku: p['SKU / Barcode'] || p.sku || 'SKU-' + idx,
                                name: p['Nama Barang Material'] || p.name || 'Barang ' + idx,
                                category: p['Kategori'] || p.category || 'Lain-lain',
                                unit: p['Satuan'] || p.unit || 'Pcs',
                                buyPrice: parseFloat(p['Harga Beli HPP (Rp)']) || p.buyPrice || 0,
                                sellPrice: parseFloat(p['Harga Jual (Rp)']) || p.sellPrice || 0,
                                stock: parseFloat(p['Stok Saat Ini']) || p.stock || 0,
                                minStock: parseFloat(p['Stok Minimal']) || p.minStock || 5,
                                conversionNote: p['Catatan Konversi'] || p.conversionNote || ''
                            }));
                            setProducts(formattedProds);
                        }
                        showToast('Data dari Google Sheets berhasil ditarik!');
                    } else {
                        showToast('Gagal memuat data dari Spreadsheet', 'error');
                    }
                } catch (err) {
                    showToast('Gagal tarik data: ' + err.message, 'error');
                } finally {
                    setIsSyncing(false);
                }
            };

            const syncAllMasterDataToSheets = async () => {
                if (!storeInfo.appsScriptUrl || !storeInfo.appsScriptUrl.startsWith('http')) {
                    showToast('URL Google Apps Script belum terpasang!', 'error');
                    return;
                }
                showToast('Menyinkronkan seluruh master data ke Google Sheets...', 'success');
                try {
                    await syncToAppsScript('SYNC_PRODUK', { products });
                    await syncToAppsScript('SYNC_PELANGGAN', { customers });
                    await syncToAppsScript('SYNC_SUPPLIER', { suppliers });
                    await syncToAppsScript('SYNC_KATEGORI', { categories });
                    showToast('Semua Master Data berhasil tersimpan di Google Sheets!');
                } catch (err) {
                    showToast('Gagal sinkronisasi data: ' + err.message, 'error');
                }
            };

            const testAppsScriptSync = async () => {
                const inputUrl = storeInfo.appsScriptUrl;
                if (!inputUrl || !inputUrl.startsWith('http')) {
                    showToast('Isi URL Google Apps Script dengan benar!', 'error');
                    return;
                }
                showToast('Mengirim sinyal tes ke Google Apps Script...', 'success');
                try {
                    await fetch(inputUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'TEST_CONNECTION', message: 'Tes Koneksi MaterialPOS Pro v5.0', timestamp: new Date().toISOString() })
                    });
                    showToast('Sinyal tes berhasil dikirim ke Google Sheets!');
                } catch (err) {
                    showToast('Gagal terhubung: ' + err.message, 'error');
                }
            };

            const toggleFullScreen = () => {
                if (!document.fullscreenElement) {
                    const docEl = document.documentElement;
                    const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
                    if (req) {
                        try {
                            const p = req.call(docEl);
                            if (p && p.catch) {
                                p.then(() => setIsFullscreen(true)).catch(() => {
                                    showToast('Mode Layar Penuh dibatasi browser', 'error');
                                });
                            } else {
                                setIsFullscreen(true);
                            }
                        } catch (e) {
                            showToast('Layar penuh tidak didukung perangkat ini', 'error');
                        }
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen().then(() => setIsFullscreen(false)).catch(() => {});
                    }
                }
            };

            const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const activeCustomer = customers.find(c => c.id === selectedCustomerId) || customers[0];
            const paidAmount = parseFloat(amountPaidInput) || 0;
            const changeAmount = Math.max(0, paidAmount - cartSubtotal);

            const addToCart = (product) => {
                if (product.stock <= 0) {
                    showToast('Stok barang habis!', 'error');
                    return;
                }
                setCart(prev => {
                    const existing = prev.find(i => i.id === product.id);
                    if (existing) {
                        if (existing.qty + 1 > product.stock) {
                            showToast(`Stok ${product.name} hanya tersisa ${product.stock}`, 'error');
                            return prev;
                        }
                        return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
                    }
                    return [...prev, {
                        id: product.id,
                        sku: product.sku,
                        name: product.name,
                        unit: product.unit,
                        price: product.sellPrice,
                        buyPrice: product.buyPrice,
                        qty: 1,
                        maxStock: product.stock
                    }];
                });
            };

            const updateCartQty = (productId, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === productId) {
                        const newQty = item.qty + delta;
                        if (newQty <= 0) return null;
                        if (newQty > item.maxStock) {
                            showToast(`Batas stok maksimum (${item.maxStock}) tercapai!`, 'error');
                            return item;
                        }
                        return { ...item, qty: newQty };
                    }
                    return item;
                }).filter(Boolean));
            };

            const removeFromCart = (productId) => {
                setCart(prev => prev.filter(item => item.id !== productId));
            };

            const handleCheckout = (e) => {
                e.preventDefault();
                if (cart.length === 0) {
                    showToast('Keranjang belanja masih kosong!', 'error');
                    return;
                }

                if (paymentMethod === 'Kredit') {
                    if (activeCustomer.type === 'Umum') {
                        showToast('Pelanggan Umum tidak diperbolehkan kasbon/kredit!', 'error');
                        return;
                    }
                    const totalDebtAfter = activeCustomer.currentDebt + cartSubtotal;
                    if (activeCustomer.maxLimit > 0 && totalDebtAfter > activeCustomer.maxLimit) {
                        showToast(`Batas limit kasbon ${activeCustomer.name} (${formatRupiah(activeCustomer.maxLimit)}) terlampaui!`, 'error');
                        return;
                    }
                } else {
                    if (paidAmount < cartSubtotal) {
                        showToast('Jumlah pembayaran kurang dari total tagihan!', 'error');
                        return;
                    }
                }

                const saleId = 'INV-' + Date.now().toString().slice(-6);
                const saleRecord = {
                    id: saleId,
                    date: new Date().toISOString(),
                    customer: { id: activeCustomer.id, name: activeCustomer.name, type: activeCustomer.type },
                    items: [...cart],
                    total: cartSubtotal,
                    paymentMethod,
                    paidAmount: paymentMethod === 'Kredit' ? 0 : paidAmount,
                    change: paymentMethod === 'Kredit' ? 0 : changeAmount,
                    status: paymentMethod === 'Kredit' ? 'Kredit' : 'Lunas'
                };

                const updatedProducts = products.map(prod => {
                    const cartItem = cart.find(c => c.id === prod.id);
                    if (cartItem) {
                        return { ...prod, stock: prod.stock - cartItem.qty };
                    }
                    return prod;
                });
                setProducts(updatedProducts);

                const newMutations = cart.map(c => ({
                    id: 'MUT-' + Math.random().toString(36).substr(2, 7),
                    date: new Date().toISOString(),
                    productId: c.id,
                    productName: c.name,
                    type: 'KELUAR',
                    qty: c.qty,
                    note: `Penjualan Kasir #${saleId}`
                }));
                setMutations(prev => [...newMutations, ...prev]);

                let updatedCustomers = customers;
                if (paymentMethod === 'Kredit') {
                    updatedCustomers = customers.map(c => c.id === activeCustomer.id ? { ...c, currentDebt: c.currentDebt + cartSubtotal } : c);
                    setCustomers(updatedCustomers);

                    const piutangRecord = {
                        id: 'KAS-' + saleId,
                        date: new Date().toISOString(),
                        type: 'PIUTANG_BARU',
                        entityName: activeCustomer.name,
                        entityType: activeCustomer.type,
                        amountPaid: cartSubtotal,
                        remainingDebt: activeCustomer.currentDebt + cartSubtotal,
                        method: 'Kredit Kasbon',
                        note: `Penjualan Kasbon No. Nota #${saleId}`
                    };
                    setDebtPayments(prev => [piutangRecord, ...prev]);
                }

                setSales(prev => [saleRecord, ...prev]);
                setLastCompletedSale(saleRecord);

                syncToAppsScript('PENJUALAN', saleRecord);
                syncToAppsScript('SYNC_PRODUK', { products: updatedProducts });
                if (paymentMethod === 'Kredit') {
                    syncToAppsScript('SYNC_PELANGGAN', { customers: updatedCustomers });
                }

                setCart([]);
                setAmountPaidInput('');
                setActiveModal('receipt');
                showToast(`Transaksi #${saleId} berhasil diselesaikan!`);
            };

            const handleAddItemToPurchaseCart = () => {
                const qtyVal = parseFloat(addItemQty) || 0;
                const buyPriceVal = parseFloat(addItemBuyPrice) || 0;
                if (!addItemProdId || qtyVal <= 0 || buyPriceVal <= 0) {
                    showToast('Pilih produk, qty, dan isi harga beli dengan benar!', 'error');
                    return;
                }
                const prod = products.find(p => p.id === addItemProdId);
                if (!prod) return;

                setPurchaseCart(prev => {
                    const existing = prev.find(i => i.id === prod.id);
                    if (existing) {
                        return prev.map(i => i.id === prod.id ? { ...i, qty: i.qty + qtyVal, buyPrice: buyPriceVal } : i);
                    }
                    return [...prev, {
                        id: prod.id,
                        sku: prod.sku,
                        name: prod.name,
                        unit: prod.unit,
                        buyPrice: buyPriceVal,
                        qty: qtyVal
                    }];
                });

                setAddItemProdId('');
                setAddItemQty('1');
                setAddItemBuyPrice('');
                showToast('Barang ditambahkan ke daftar pembelian');
            };

            const handleSavePurchase = (e) => {
                e.preventDefault();
                if (purchaseCart.length === 0) {
                    showToast('Daftar pembelian barang masih kosong!', 'error');
                    return;
                }

                const targetSup = suppliers.find(s => s.id === selectedPurchaseSupplierId);
                const invoiceNo = purchaseInvoiceNo.trim() || 'FAK-' + Date.now().toString().slice(-6);
                const purchaseTotal = purchaseCart.reduce((sum, item) => sum + (item.buyPrice * item.qty), 0);

                const newPurchaseRecord = {
                    id: 'PUR-' + Date.now().toString().slice(-6),
                    invoiceNo: invoiceNo,
                    date: new Date().toISOString(),
                    supplier: targetSup ? { id: targetSup.id, name: targetSup.name, phone: targetSup.phone } : null,
                    items: [...purchaseCart],
                    total: purchaseTotal,
                    paymentMethod: purchasePaymentMethod,
                    proofImage: purchaseProofImage || null,
                    status: purchasePaymentMethod === 'Tempo' ? 'Belum Lunas' : 'Lunas'
                };

                const updatedProducts = products.map(prod => {
                    const itemInCart = purchaseCart.find(c => c.id === prod.id);
                    if (itemInCart) {
                        return {
                            ...prod,
                            stock: prod.stock + itemInCart.qty,
                            buyPrice: itemInCart.buyPrice
                        };
                    }
                    return prod;
                });
                setProducts(updatedProducts);

                const newMutations = purchaseCart.map(c => ({
                    id: 'MUT-' + Math.random().toString(36).substr(2, 7),
                    date: new Date().toISOString(),
                    productId: c.id,
                    productName: c.name,
                    type: 'MASUK',
                    qty: c.qty,
                    note: `Kulakan Distributor #${invoiceNo}`,
                    proofImage: purchaseProofImage || null
                }));
                setMutations(prev => [...newMutations, ...prev]);

                if (purchasePaymentMethod === 'Tempo' && targetSup) {
                    const newDebtVal = targetSup.currentDebt + purchaseTotal;
                    setSuppliers(prev => prev.map(s => s.id === targetSup.id ? { ...s, currentDebt: newDebtVal } : s));

                    const debtRecord = {
                        id: 'UTG-' + invoiceNo,
                        date: new Date().toISOString(),
                        type: 'UTANG_BARU',
                        entityName: targetSup.name,
                        entityType: 'Supplier',
                        amountPaid: purchaseTotal,
                        remainingDebt: newDebtVal,
                        method: 'Tempo / Faktur',
                        note: `Pembelian Kulakan No. Faktur #${invoiceNo}`,
                        proofImage: purchaseProofImage || null
                    };
                    setDebtPayments(prev => [debtRecord, ...prev]);
                }

                setPurchases(prev => [newPurchaseRecord, ...prev]);

                syncToAppsScript('PEMBELIAN', newPurchaseRecord);
                syncToAppsScript('SYNC_PRODUK', { products: updatedProducts });
                if (purchasePaymentMethod === 'Tempo' && targetSup) {
                    const updatedSuppliers = suppliers.map(s => s.id === targetSup.id ? { ...s, currentDebt: s.currentDebt + purchaseTotal } : s);
                    syncToAppsScript('SYNC_SUPPLIER', { suppliers: updatedSuppliers });
                }

                setPurchaseCart([]);
                setPurchaseInvoiceNo('');
                setPurchaseProofImage('');
                setActiveModal(null);
                showToast(`Pembelian Faktur #${invoiceNo} berhasil disimpan!`);
            };

            const handleAddMutation = (e) => {
                e.preventDefault();
                const qtyVal = parseFloat(mutationFormData.qty) || 0;
                if (!mutationFormData.productId || qtyVal <= 0) {
                    showToast('Pilih barang dan isi jumlah mutasi dengan benar', 'error');
                    return;
                }
                const targetProduct = products.find(p => p.id === mutationFormData.productId);
                if (!targetProduct) return;

                if (mutationFormData.type === 'KELUAR' && qtyVal > targetProduct.stock) {
                    showToast('Jumlah stok keluar melebihi sisa stok toko!', 'error');
                    return;
                }

                const updatedProducts = products.map(p => {
                    if (p.id === targetProduct.id) {
                        const newStock = mutationFormData.type === 'MASUK' ? p.stock + qtyVal : p.stock - qtyVal;
                        return { ...p, stock: newStock };
                    }
                    return p;
                });
                setProducts(updatedProducts);

                const newMut = {
                    id: 'MUT-' + Date.now().toString().slice(-6),
                    date: new Date().toISOString(),
                    productId: targetProduct.id,
                    productName: targetProduct.name,
                    type: mutationFormData.type,
                    qty: qtyVal,
                    note: mutationFormData.note || (mutationFormData.type === 'MASUK' ? 'Stok Masuk Tambahan' : 'Penyesuaian Stok / Rusak'),
                    proofImage: mutationFormData.proofImage || null
                };

                setMutations(prev => [newMut, ...prev]);

                syncToAppsScript('MUTASI_STOK', newMut);
                syncToAppsScript('SYNC_PRODUK', { products: updatedProducts });

                showToast('Mutasi stok berhasil dicatat & tersimpan!');
                setActiveModal(null);
                setMutationFormData({ productId: '', type: 'MASUK', qty: '', supplierId: '', note: '', proofImage: '' });
            };

            const handlePayPiutang = (e) => {
                e.preventDefault();
                const payVal = parseFloat(payAmountInput) || 0;
                if (!selectedDebtCustomer || payVal <= 0) {
                    showToast('Nominal pembayaran piutang tidak valid', 'error');
                    return;
                }
                if (payVal > selectedDebtCustomer.currentDebt) {
                    showToast('Nominal pembayaran melebihi sisa piutang pelanggan!', 'error');
                    return;
                }

                const newDebtVal = selectedDebtCustomer.currentDebt - payVal;
                const updatedCustomers = customers.map(c => c.id === selectedDebtCustomer.id ? { ...c, currentDebt: newDebtVal } : c);
                setCustomers(updatedCustomers);

                const kwitansiRecord = {
                    id: 'KWT-P-' + Date.now().toString().slice(-6),
                    date: new Date().toISOString(),
                    type: 'PIUTANG',
                    entityName: selectedDebtCustomer.name,
                    entityType: selectedDebtCustomer.type,
                    amountPaid: payVal,
                    remainingDebt: newDebtVal,
                    method: paymentMethod,
                    note: paymentNote || 'Pembayaran Cicilan Piutang Tukang'
                };

                setDebtPayments(prev => [kwitansiRecord, ...prev]);
                setLastKwitansi(kwitansiRecord);

                syncToAppsScript('PEMBAYARAN_PIUTANG', kwitansiRecord);
                syncToAppsScript('SYNC_PELANGGAN', { customers: updatedCustomers });

                showToast(`Pembayaran piutang ${selectedDebtCustomer.name} sebesar ${formatRupiah(payVal)} berhasil!`);
                setActiveModal('kwitansi');
                setPayAmountInput('');
                setPaymentNote('');
                setSelectedDebtCustomer(null);
            };

            const handlePayUtang = (e) => {
                e.preventDefault();
                const payVal = parseFloat(payAmountInput) || 0;
                if (!selectedDebtSupplier || payVal <= 0) {
                    showToast('Nominal pembayaran utang tidak valid', 'error');
                    return;
                }
                if (payVal > selectedDebtSupplier.currentDebt) {
                    showToast('Nominal pembayaran melebihi sisa utang toko!', 'error');
                    return;
                }

                const newDebtVal = selectedDebtSupplier.currentDebt - payVal;
                const updatedSuppliers = suppliers.map(s => s.id === selectedDebtSupplier.id ? { ...s, currentDebt: newDebtVal } : s);
                setSuppliers(updatedSuppliers);

                const kwitansiRecord = {
                    id: 'KWT-U-' + Date.now().toString().slice(-6),
                    date: new Date().toISOString(),
                    type: 'UTANG',
                    entityName: selectedDebtSupplier.name,
                    entityType: 'Supplier',
                    amountPaid: payVal,
                    remainingDebt: newDebtVal,
                    method: paymentMethod,
                    note: paymentNote || 'Pembayaran Utang Pembelian Material Tempo'
                };

                setDebtPayments(prev => [kwitansiRecord, ...prev]);
                setLastKwitansi(kwitansiRecord);

                syncToAppsScript('PEMBAYARAN_UTANG', kwitansiRecord);
                syncToAppsScript('SYNC_SUPPLIER', { suppliers: updatedSuppliers });

                showToast(`Pembayaran utang ke ${selectedDebtSupplier.name} sebesar ${formatRupiah(payVal)} berhasil!`);
                setActiveModal('kwitansi');
                setPayAmountInput('');
                setPaymentNote('');
                setSelectedDebtSupplier(null);
            };

            // Manual Piutang / Utang Handlers
            const handleSaveManualPiutang = (e) => {
                e.preventDefault();
                const amtVal = parseFloat(manualDebtFormData.amount) || 0;
                const cust = customers.find(c => c.id === manualDebtFormData.entityId);
                if (!cust || amtVal <= 0) {
                    showToast('Pilih pelanggan dan isi nominal piutang', 'error');
                    return;
                }

                const newDebtVal = cust.currentDebt + amtVal;
                const updatedCusts = customers.map(c => c.id === cust.id ? { ...c, currentDebt: newDebtVal } : c);
                setCustomers(updatedCusts);

                const piutangRecord = {
                    id: 'KAS-' + Date.now().toString().slice(-6),
                    date: new Date().toISOString(),
                    type: 'PIUTANG_BARU',
                    entityName: cust.name,
                    entityType: cust.type,
                    amountPaid: amtVal,
                    remainingDebt: newDebtVal,
                    method: 'Kredit Kasbon',
                    note: manualDebtFormData.note || 'Penambahan Kasbon Manual'
                };

                setDebtPayments(prev => [piutangRecord, ...prev]);
                setLastKwitansi(piutangRecord);

                syncToAppsScript('PEMBAYARAN_PIUTANG', piutangRecord);
                syncToAppsScript('SYNC_PELANGGAN', { customers: updatedCusts });

                showToast(`Piutang baru ${cust.name} sebesar ${formatRupiah(amtVal)} dicatat!`);
                setActiveModal('kwitansi');
                setManualDebtFormData({ entityId: '', amount: '', note: '', proofImage: '' });
            };

            const handleSaveManualUtang = (e) => {
                e.preventDefault();
                const amtVal = parseFloat(manualDebtFormData.amount) || 0;
                const sup = suppliers.find(s => s.id === manualDebtFormData.entityId);
                if (!sup || amtVal <= 0) {
                    showToast('Pilih supplier dan isi nominal utang', 'error');
                    return;
                }

                const newDebtVal = sup.currentDebt + amtVal;
                const updatedSups = suppliers.map(s => s.id === sup.id ? { ...s, currentDebt: newDebtVal } : s);
                setSuppliers(updatedSups);

                const utangRecord = {
                    id: 'UTG-' + Date.now().toString().slice(-6),
                    date: new Date().toISOString(),
                    type: 'UTANG_BARU',
                    entityName: sup.name,
                    entityType: 'Supplier',
                    amountPaid: amtVal,
                    remainingDebt: newDebtVal,
                    method: 'Tempo / Faktur',
                    note: manualDebtFormData.note || 'Penambahan Utang Manual',
                    proofImage: manualDebtFormData.proofImage || null
                };

                setDebtPayments(prev => [utangRecord, ...prev]);
                setLastKwitansi(utangRecord);

                syncToAppsScript('PEMBAYARAN_UTANG', utangRecord);
                syncToAppsScript('SYNC_SUPPLIER', { suppliers: updatedSups });

                showToast(`Utang baru ke ${sup.name} sebesar ${formatRupiah(amtVal)} dicatat!`);
                setActiveModal('kwitansi');
                setManualDebtFormData({ entityId: '', amount: '', note: '', proofImage: '' });
            };

            const handleAddCategory = (e) => {
                e.preventDefault();
                const catName = newCategoryInput.trim();
                if (!catName) return;
                if (categories.includes(catName)) {
                    showToast('Kategori sudah ada!', 'error');
                    return;
                }
                const updatedCats = [...categories, catName];
                setCategories(updatedCats);
                syncToAppsScript('SYNC_KATEGORI', { categories: updatedCats });
                setNewCategoryInput('');
                showToast(`Kategori ${catName} ditambahkan`);
            };

            const handleDeleteCategory = (catName) => {
                const updatedCats = categories.filter(c => c !== catName);
                setCategories(updatedCats);
                syncToAppsScript('DELETE_KATEGORI', { name: catName });
                syncToAppsScript('SYNC_KATEGORI', { categories: updatedCats });
                showToast(`Kategori ${catName} dihapus`);
            };

            const handleConfirmDeleteProduct = () => {
                if (!deletingProductId) return;
                const targetProd = products.find(p => p.id === deletingProductId);
                const updatedProducts = products.filter(p => p.id !== deletingProductId);
                setProducts(updatedProducts);
                
                syncToAppsScript('DELETE_PRODUK', { id: deletingProductId, name: targetProd?.name });
                syncToAppsScript('SYNC_PRODUK', { products: updatedProducts });
                
                showToast(`Produk ${targetProd?.name || ''} telah dihapus`, 'error');
                setActiveModal(null);
                setDeletingProductId(null);
            };

            const handleDeleteContact = () => {
                if (!deletingContact) return;
                if (deletingContact.type) {
                    const updatedCusts = customers.filter(c => c.id !== deletingContact.id);
                    setCustomers(updatedCusts);
                    
                    syncToAppsScript('DELETE_PELANGGAN', { id: deletingContact.id, name: deletingContact.name });
                    syncToAppsScript('SYNC_PELANGGAN', { customers: updatedCusts });
                    showToast(`Pelanggan ${deletingContact.name} dihapus`);
                } else {
                    const updatedSups = suppliers.filter(s => s.id !== deletingContact.id);
                    setSuppliers(updatedSups);
                    
                    syncToAppsScript('DELETE_SUPPLIER', { id: deletingContact.id, name: deletingContact.name });
                    syncToAppsScript('SYNC_SUPPLIER', { suppliers: updatedSups });
                    showToast(`Supplier ${deletingContact.name} dihapus`);
                }
                setActiveModal(null);
                setDeletingContact(null);
            };

            const handleConfirmResetDatabase = () => {
                setProducts([]);
                setCustomers(DEFAULT_CUSTOMERS);
                setSuppliers([]);
                setSales([]);
                setMutations([]);
                setDebtPayments([]);
                setPurchases([]);
                showToast('Seluruh database lokal toko berhasil direset!', 'error');
                setActiveModal(null);
            };

            const handleSaveProduct = (e) => {
                e.preventDefault();
                const form = e.target;
                const newProduct = {
                    id: editingProduct ? editingProduct.id : 'PRD-' + Date.now().toString().slice(-6),
                    sku: form.sku.value,
                    name: form.name.value,
                    category: form.category.value,
                    unit: form.unit.value,
                    buyPrice: parseFloat(form.buyPrice.value) || 0,
                    sellPrice: parseFloat(form.sellPrice.value) || 0,
                    stock: parseFloat(form.stock.value) || 0,
                    minStock: parseFloat(form.minStock.value) || 5,
                    conversionNote: form.conversionNote.value || ''
                };

                let updatedProducts = [];
                if (editingProduct) {
                    updatedProducts = products.map(p => p.id === editingProduct.id ? newProduct : p);
                    showToast(`Data ${newProduct.name} berhasil diperbarui`);
                } else {
                    updatedProducts = [...products, newProduct];
                    showToast(`Produk ${newProduct.name} berhasil ditambahkan`);
                }
                setProducts(updatedProducts);
                syncToAppsScript('SYNC_PRODUK', { products: updatedProducts });

                setActiveModal(null);
                setEditingProduct(null);
            };

            const handleSaveContact = (e) => {
                e.preventDefault();
                const form = e.target;
                if (contactType === 'pelanggan') {
                    const newCust = {
                        id: editingContact ? editingContact.id : 'CUST-' + Date.now().toString().slice(-6),
                        name: form.contactName.value,
                        phone: form.contactPhone.value || '-',
                        address: form.contactAddress.value || '-',
                        type: form.customerType.value,
                        maxLimit: parseFloat(form.maxLimit.value) || 0,
                        currentDebt: editingContact ? editingContact.currentDebt : 0
                    };
                    let updatedCusts = [];
                    if (editingContact) {
                        updatedCusts = customers.map(c => c.id === editingContact.id ? newCust : c);
                        showToast(`Pelanggan ${newCust.name} berhasil diperbarui`);
                    } else {
                        updatedCusts = [...customers, newCust];
                        showToast(`Pelanggan ${newCust.name} berhasil ditambahkan`);
                    }
                    setCustomers(updatedCusts);
                    syncToAppsScript('SYNC_PELANGGAN', { customers: updatedCusts });
                } else {
                    const newSup = {
                        id: editingContact ? editingContact.id : 'SUP-' + Date.now().toString().slice(-6),
                        name: form.contactName.value,
                        phone: form.contactPhone.value || '-',
                        currentDebt: editingContact ? editingContact.currentDebt : 0
                    };
                    let updatedSups = [];
                    if (editingContact) {
                        updatedSups = suppliers.map(s => s.id === editingContact.id ? newSup : s);
                        showToast(`Supplier ${newSup.name} berhasil diperbarui`);
                    } else {
                        updatedSups = [...suppliers, newSup];
                        showToast(`Supplier ${newSup.name} berhasil ditambahkan`);
                    }
                    setSuppliers(updatedSups);
                    syncToAppsScript('SYNC_SUPPLIER', { suppliers: updatedSups });
                }
                setActiveModal(null);
                setEditingContact(null);
            };

            const handleSaveStoreSettings = (e) => {
                e.preventDefault();
                const form = e.target;
                const updated = {
                    name: form.storeName.value,
                    tagline: form.tagline.value,
                    address: form.address.value,
                    phone: form.phone.value,
                    email: form.email.value,
                    bankInfo: form.bankInfo.value,
                    receiptFooter: form.receiptFooter.value,
                    appsScriptUrl: form.appsScriptUrl.value.trim()
                };
                setStoreInfo(updated);
                showToast('Profil & URL Apps Script berhasil disimpan!');
            };

            const handleImageUpload = (e, setBase64) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 3 * 1024 * 1024) {
                    showToast('Ukuran file foto maksimal 3MB', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (evt) => setBase64(evt.target.result);
                reader.readAsDataURL(file);
            };

            const filteredProducts = products.filter(p => {
                const matchCat = selectedCategory === 'Semua' || p.category === selectedCategory;
                const matchSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.sku.toLowerCase().includes(searchTerm.toLowerCase());
                return matchCat && matchSearch;
            });

            const filteredSales = sales.filter(s => {
                const matchSearch = s.id.toLowerCase().includes(salesSearchTerm.toLowerCase()) || (s.customer?.name || '').toLowerCase().includes(salesSearchTerm.toLowerCase());
                const matchStatus = salesStatusFilter === 'Semua' || s.status === salesStatusFilter || s.paymentMethod === salesStatusFilter;
                return matchSearch && matchStatus;
            });

            const totalOmset = sales.reduce((sum, s) => sum + s.total, 0);
            const totalPiutangTukang = customers.reduce((sum, c) => sum + c.currentDebt, 0);
            const totalUtangSupplier = suppliers.reduce((sum, s) => sum + s.currentDebt, 0);
            const lowStockProducts = products.filter(p => p.stock <= p.minStock);

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-slate-100">

                    {/* Toast Notification */}
                    {toast.show && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-white text-xs sm:text-sm font-bold transition-all duration-300 ${toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
                            <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} text-lg`}></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* MOBILE TOP HEADER */}
                    <div className="md:hidden bg-slate-900 text-white p-3 flex justify-between items-center sticky top-0 z-40 shadow-md">
                        <div className="flex items-center gap-2.5">
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 text-amber-400 hover:bg-slate-800 rounded-lg">
                                <i className="fas fa-bars text-lg"></i>
                            </button>
                            <div>
                                <div className="flex items-center gap-1.5">
                                    <h1 className="font-black text-sm tracking-wide text-amber-400">{storeInfo.name}</h1>
                                    <span className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-amber-400 animate-ping' : (storeInfo.appsScriptUrl ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500')}`}></span>
                                </div>
                                <p className="text-[10px] text-slate-400">MaterialPOS Pro v5.0 Ultimate</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1.5">
                            {storeInfo.appsScriptUrl && (
                                <button onClick={pullDataFromSpreadsheet} title="Tarik Data dari Sheets" className="p-2 bg-slate-800 text-emerald-400 rounded-lg text-xs font-bold active:scale-95">
                                    <i className={`fas fa-cloud-arrow-down ${isSyncing ? 'animate-bounce' : ''}`}></i>
                                </button>
                            )}
                            <button onClick={toggleFullScreen} className="p-2 bg-slate-800 text-amber-400 rounded-lg text-xs font-bold active:scale-95">
                                <i className={`fas ${isFullscreen ? 'fa-compress' : 'fa-expand'}`}></i>
                            </button>
                        </div>
                    </div>

                    {/* MOBILE NAVIGATION DRAWER */}
                    {isMobileMenuOpen && (
                        <div className="fixed inset-0 bg-slate-950/70 z-50 md:hidden flex" onClick={() => setIsMobileMenuOpen(false)}>
                            <div className="w-64 bg-slate-900 text-white h-full p-4 flex flex-col justify-between" onClick={e => e.stopPropagation()}>
                                <div>
                                    <div className="flex justify-between items-center mb-6 pb-3 border-b border-slate-800">
                                        <div className="flex items-center gap-2">
                                            <div className="w-8 h-8 rounded-lg bg-amber-500 text-slate-950 font-black flex items-center justify-center text-sm">MP</div>
                                            <span className="font-bold text-sm text-amber-400">Navigasi Menu</span>
                                        </div>
                                        <button onClick={() => setIsMobileMenuOpen(false)} className="text-slate-400 p-1">
                                            <i className="fas fa-times"></i>
                                        </button>
                                    </div>

                                    <nav className="space-y-1 text-xs">
                                        {[

                    {/* DESKTOP SIDEBAR */}
                    <aside className="hidden md:flex md:w-64 bg-slate-900 text-white flex-col justify-between shrink-0 min-h-screen p-4 sticky top-0 h-screen overflow-y-auto">

                            <div className="flex items-center gap-3 pb-4 mb-4 border-b border-slate-800">
                                <div className="w-10 h-10 rounded-xl bg-amber-500 text-slate-950 font-black flex items-center justify-center text-lg shadow-lg">
                                    <i className="fas fa-truck-ramp-box"></i>
                                </div>
                                <div>
                                    <h2 className="font-black text-sm text-amber-400 tracking-tight leading-tight">{storeInfo.name}</h2>
                                    <div className="flex items-center gap-1.5 mt-0.5">
                                        <span className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-amber-400 animate-ping' : (storeInfo.appsScriptUrl ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500')}`}></span>
                                        <span className="text-[10px] text-slate-400 font-medium">
                                            {isSyncing ? 'Sedang Menyinkron...' : (storeInfo.appsScriptUrl ? 'Spreadsheet Terhubung' : 'URL Sheets Belum Set')}
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <nav className="space-y-1 text-xs">
                                {[
                                    { id: 'pos', icon: 'fa-cash-register', label: 'Kasir Penjualan' },
                                    { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard Store' },
                                    { id: 'sales_history', icon: 'fa-receipt', label: 'Riwayat Penjualan' },
                                    { id: 'pembelian', icon: 'fa-truck-ramp-box', label: 'Pembelian & Kulakan' },
                                    { id: 'mutasi', icon: 'fa-boxes-packing', label: 'Mutasi Stok Gudang' },
                                    { id: 'products', icon: 'fa-cubes', label: 'Katalog & Stok' },
                                    { id: 'piutang', icon: 'fa-hand-holding-dollar', label: 'Piutang Tukang' },
                                    { id: 'utang', icon: 'fa-file-invoice-dollar', label: 'Utang Supplier' },
                                    { id: 'contacts', icon: 'fa-users', label: 'Pelanggan & Supplier' },
                                    { id: 'settings', icon: 'fa-gear', label: 'Pengaturan Toko' }
                                ].map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveTab(item.id)}
                                        className={`w-full text-left px-3.5 py-3 rounded-xl font-bold flex items-center gap-3 transition-colors ${activeTab === item.id ? 'bg-amber-500 text-slate-950 shadow-md' : 'text-slate-300 hover:bg-slate-800'}`}
                                    >
                                        <i className={`fas ${item.icon} w-5 text-center`}></i>
                                        <span>{item.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                        <div className="pt-4 border-t border-slate-800 space-y-2">
                            {storeInfo.appsScriptUrl && (
                                <button onClick={pullDataFromSpreadsheet} className="w-full py-2 bg-emerald-950 hover:bg-emerald-900 border border-emerald-800/50 text-emerald-400 font-bold rounded-xl text-xs flex items-center justify-center gap-2">
                                    <i className={`fas fa-cloud-arrow-down ${isSyncing ? 'animate-bounce' : ''}`}></i>
                                    <span>Tarik Data Sheets</span>
                                </button>
                            )}
                            <button onClick={toggleFullScreen} className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold rounded-xl text-xs flex items-center justify-center gap-2">
                                <i className={`fas ${isFullscreen ? 'fa-compress' : 'fa-expand'}`}></i>
                                <span>{isFullscreen ? 'Keluar Layar Penuh' : 'Mode Layar Penuh'}</span>
                            </button>
                            <div className="text-[10px] text-slate-500 text-center font-medium">
                                MaterialPOS Pro v5.0 Ultimate &copy; 2026
                            </div>
                        </div>
                    </aside>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 p-3 sm:p-5 lg:p-6 overflow-y-auto max-w-full">

                        {/* TAB 1: POS CASHIER */}
                        {activeTab === 'pos' && (
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                                <div className="lg:col-span-7 xl:col-span-8 space-y-4">
                                    <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                        <div className="flex gap-2">
                                            <div className="relative flex-1">
                                                <i className="fas fa-search absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                                                <input
                                                    type="text"
                                                    placeholder="Cari nama bahan bangunan atau SKU..."
                                                    value={searchTerm}
                                                    onChange={e => setSearchTerm(e.target.value)}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                />
                                            </div>
                                            <button
                                                onClick={() => { setScanTargetField('cart'); setIsScannerOpen(true); }}
                                                className="px-3.5 py-2.5 bg-slate-900 hover:bg-slate-800 text-amber-400 font-extrabold rounded-xl text-xs flex items-center gap-2 shadow-sm active:scale-95 transition-transform shrink-0"
                                                title="Scan Barcode / QR Code Barang"
                                            >
                                                <i className="fas fa-barcode text-sm"></i>
                                                <span className="hidden sm:inline">Scan Barcode</span>
                                            </button>
                                        </div>

                                        <div className="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar text-xs">

                                            >
                                                Semua ({products.length})
                                            </button>
                                            {categories.map(cat => {
                                                const count = products.filter(p => p.category === cat).length;
                                                return (
                                                    <button

                                    <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-2.5">
                                        {filteredProducts.length === 0 ? (
                                            <div className="col-span-full bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 space-y-3">

                                                <p className="font-bold text-xs">Tidak ada produk material ditemukan.</p>
                                                <button

                                                                Stok: {product.stock} {product.unit}
                                                            </span>
                                                        </div>
                                                        <h4 className="font-extrabold text-slate-900 text-xs leading-snug line-clamp-2 mb-1">{product.name}</h4>

                                                            <i className="fas fa-plus text-[10px]"></i>
                                                        </span>
                                                    </div>
                                                </div>
