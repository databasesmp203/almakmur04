        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'materialpos-multi-device';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDemoConfigForFallback",
            authDomain: "demo-materialpos.firebaseapp.com",
            projectId: "demo-materialpos",
            storageBucket: "demo-materialpos.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:demomaterialpos"
        };

        window.POS_CLOUD = {
            appId,
            firebaseConfig,
            isCloudEnabled: typeof __firebase_config !== 'undefined',
            initCloudSync: async (onReady, onError) => {
                try {
                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);
                    const db = getFirestore(app);

                    let user = null;
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        const cred = await signInWithCustomToken(auth, __initial_auth_token);
                        user = cred.user;
                    } else {
                        const cred = await signInAnonymously(auth);
                        user = cred.user;
                    }

                    if (user) {
                        onReady({ db, auth, user, appId, doc, getDoc, setDoc, updateDoc, collection, onSnapshot });
                    }
                } catch (err) {
                    console.warn("Cloud sync running in local fallback mode:", err);
                    if (onError) onError(err);
                }
            }
        };
    </script>

        const playBeepSound = () => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) {}
        };

        function BarcodeScannerModal({ onClose, onScanSuccess }) {
            const [scannerStatus, setScannerStatus] = React.useState('Menginisialisasi kamera...');
            const [manualCode, setManualCode] = React.useState('');
            const html5QrcodeRef = React.useRef(null);

            React.useEffect(() => {
                let isMounted = true;
                const initScanner = async () => {
                    try {
                        const devices = await Html5Qrcode.getCameras();
                        if (!isMounted) return;
                        if (devices && devices.length > 0) {
                            const backCam = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear') || d.label.toLowerCase().includes('environment')) || devices[devices.length - 1];
                            const html5Qrcode = new Html5Qrcode("interactive-qr-reader");
                            html5QrcodeRef.current = html5Qrcode;

                            await html5Qrcode.start(
                                backCam.id,
                                { fps: 10, qrbox: { width: 250, height: 160 } },
                                (decodedText) => {
                                    if (isMounted) {
                                        playBeepSound();
                                        onScanSuccess(decodedText);
                                    }
                                },
                                () => {}
                            );
                            if (isMounted) setScannerStatus('Arahkan kamera ke Barcode / QR Code barang');
                        } else {
                            if (isMounted) setScannerStatus('Kamera tidak ditemukan pada perangkat ini.');
                        }
                    } catch (err) {
                        if (isMounted) setScannerStatus('Izin kamera ditolak atau tidak tersedia.');
                    }
                };

                const timer = setTimeout(initScanner, 300);
                return () => {
                    isMounted = false;
                    clearTimeout(timer);
                    if (html5QrcodeRef.current) {
                        try {
                            html5QrcodeRef.current.stop().catch(() => {}).then(() => {
                                try { html5QrcodeRef.current.clear(); } catch(e){}
                            });
                        } catch(e) {}
                    }
                };
            }, []);

            const handleManualSubmit = (e) => {
                e.preventDefault();
                if (!manualCode.trim()) return;
                playBeepSound();
                onScanSuccess(manualCode.trim());
                setManualCode('');
            };

            return (
                <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                    <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl relative text-xs space-y-3">

                        </button>

                        <div className="flex items-center gap-2 border-b pb-2">

                                <i className="fas fa-barcode"></i>
                            </div>
                            <div>
                                <h3 className="font-extrabold text-slate-900 text-sm">Scanner Barcode & QR Code</h3>
                                <p className="text-[10px] text-slate-500">Scan otomatis SKU/Barcode material bangunan</p>
                            </div>
                        </div>

                        <div className="bg-slate-900 rounded-xl overflow-hidden relative min-h-[220px] flex flex-col items-center justify-center text-white p-2">
                            <div id="interactive-qr-reader" className="w-full"></div>
                            <div className="text-center p-2 text-[11px] text-amber-400 font-bold">
                                <i className="fas fa-camera mr-1"></i>
                                <span>{scannerStatus}</span>
                            </div>
                        </div>

                        <form onSubmit={handleManualSubmit} className="pt-2 border-t space-y-1.5">
                            <label className="block text-[10px] font-bold text-slate-500">Masukkan SKU Barcode Manual / Handheld Scanner:</label>
                            <div className="flex gap-2">
                                <input
                                    type="text"
                                    value={manualCode}
                                    onChange={e => setManualCode(e.target.value)}

                                />

                                    Proses
                                </button>
                            </div>
                        </form>

                        <div className="flex justify-between items-center text-[10px] text-slate-400 pt-1">
                            <span>Mendukung Barcode USB Gun, Kamera HP & Tablet</span>
                            <button onClick={onClose} className="text-slate-600 font-bold hover:underline">Tutup Scanner</button>
                        </div>
                    </div>
                </div>
            );
        }

        function PaginationControls({ currentPage, totalPages, onPageChange, totalItems, pageSize }) {
            if (totalPages <= 1) return null;

            const startIdx = (currentPage - 1) * pageSize + 1;
            const endIdx = Math.min(currentPage * pageSize, totalItems);

            return (
                <div className="flex flex-col sm:flex-row justify-between items-center gap-2 p-3 bg-slate-50 border-t text-xs">
                    <span className="text-slate-500 text-[11px] font-medium">
                        Menampilkan <strong className="text-slate-800">{startIdx} - {endIdx}</strong> dari <strong className="text-slate-800">{totalItems}</strong> data
                    </span>
                    <div className="flex items-center gap-1">
                        <button
                            disabled={currentPage === 1}
                            onClick={() => onPageChange(1)}
                            className="px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-slate-700 font-bold hover:bg-slate-100 disabled:opacity-40"
                        >
                            &laquo;
                        </button>
                        <button
                            disabled={currentPage === 1}
                            onClick={() => onPageChange(currentPage - 1)}
                            className="px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-slate-700 font-bold hover:bg-slate-100 disabled:opacity-40"
                        >
                            &lsaquo;
                        </button>
                        <span className="px-3 py-1 bg-amber-500 text-slate-950 font-extrabold rounded-lg">
                            {currentPage} / {totalPages}
                        </span>
                        <button
                            disabled={currentPage === totalPages}
                            onClick={() => onPageChange(currentPage + 1)}
                            className="px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-slate-700 font-bold hover:bg-slate-100 disabled:opacity-40"
                        >
                            &rsaquo;
                        </button>
                        <button
                            disabled={currentPage === totalPages}
                            onClick={() => onPageChange(totalPages)}
                            className="px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-slate-700 font-bold hover:bg-slate-100 disabled:opacity-40"
                        >
                            &raquo;
                        </button>
                    </div>
                </div>
            );
        }

            const executeDelete = () => {
                const { type, item } = deleteConfirmModal;
                if (!item && type !== 'all_mutations') return;

                if (type === 'sale') {
                    const updatedProducts = products.map(p => {
                        const saleItem = item.items.find(i => i.id === p.id);
                        if (saleItem) {
                            const updatedStock = p.stock + saleItem.qty;
                            saveToCloud('products', p.id, { ...p, stock: updatedStock });
                            return { ...p, stock: updatedStock };
                        }
                        return p;
                    });
                    setProducts(updatedProducts);

                    if (item.paymentMethod === 'Kredit' || item.status === 'Kredit') {
                        const targetCust = customers.find(c => c.id === item.customer?.id || c.name === item.customer?.name);
                        if (targetCust) {
                            const newDebt = Math.max(0, targetCust.currentDebt - item.total);
                            const updatedCusts = customers.map(c => c.id === targetCust.id ? { ...c, currentDebt: newDebt } : c);
                            setCustomers(updatedCusts);
                            saveToCloud('customers', targetCust.id, { ...targetCust, currentDebt: newDebt });

                    saveToCloud('sales', item.id, { ...item, _deleted: true });

                    if (selectedSaleDetail && selectedSaleDetail.id === item.id) {
                        setSelectedSaleDetail(null);
                        setActiveModal(null);
                    }
                } else if (type === 'purchase') {
                    const updatedProducts = products.map(p => {
                        const purchasedItem = item.items?.find(i => i.productId === p.id || i.productName === p.name);
                        if (purchasedItem) {
                            const updatedStock = Math.max(0, p.stock - purchasedItem.qty);
                            saveToCloud('products', p.id, { ...p, stock: updatedStock });
                            return { ...p, stock: updatedStock };
                        }
                        return p;
                    });
                    setProducts(updatedProducts);

                        if (targetSup) {
                            const newDebt = Math.max(0, targetSup.currentDebt - item.total);

                            setSuppliers(updatedSups);
                            saveToCloud('suppliers', targetSup.id, { ...targetSup, currentDebt: newDebt });

                    const targetProd = products.find(p => p.id === item.productId || p.name === item.productName);

                        const newStock = item.type === 'MASUK' 
                            ? Math.max(0, targetProd.stock - item.qty) 
                            : targetProd.stock + item.qty;
                        const updatedProducts = products.map(p => p.id === targetProd.id ? { ...p, stock: newStock } : p);

                        saveToCloud('products', targetProd.id, { ...targetProd, stock: newStock });

                    saveToCloud('mutations', item.id, { ...item, _deleted: true });

                        return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);

            const handleBarcodeScanSuccess = (code) => {
                setIsScannerOpen(false);
                if (scanTargetField === 'cart') {
                    const cleanCode = code.toLowerCase().trim();
                    const match = productMap.get(cleanCode) || products.find(p => p.sku.toLowerCase() === cleanCode || p.id.toLowerCase() === cleanCode);
                    if (match) {
                        addToCart(match);
                        showToast(`Barang [${match.name}] ditambahkan ke keranjang`);
                    } else {
                        showToast(`Produk dengan SKU/Barcode [${code}] tidak ditemukan!`, 'error');
                    }
                } else if (scanTargetField === 'product_sku' && editingProduct) {
                    setEditingProduct(prev => ({ ...prev, sku: code }));
                    showToast(`SKU Barcode [${code}] berhasil di-scan!`);
                }
            };

            const updateCartQty = (productId, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === productId) {
                        const newQty = item.qty + delta;
                        if (newQty <= 0) return null;
                        if (newQty > item.maxStock) {
                            showToast(`Batas stok maksimum (${item.maxStock}) tercapai!`, 'error');
                            return item;
                        }
                        return { ...item, qty: newQty };
                    }
                    return item;
                }).filter(Boolean));
            };

            const removeFromCart = (productId) => {
                setCart(prev => prev.filter(item => item.id !== productId));
            };

            const handleCheckout = (e) => {
                e.preventDefault();
                if (cart.length === 0) {
                    showToast('Keranjang belanja masih kosong!', 'error');
                    return;
                }

                if (paymentMethod === 'Kredit') {
                    if (activeCustomer.type === 'Umum') {
                        showToast('Pelanggan Umum tidak diperbolehkan kasbon/kredit!', 'error');
                        return;
                    }
                    const totalDebtAfter = activeCustomer.currentDebt + cartSubtotal;
                    if (activeCustomer.maxLimit > 0 && totalDebtAfter > activeCustomer.maxLimit) {
                        showToast(`Batas limit kasbon ${activeCustomer.name} (${formatRupiah(activeCustomer.maxLimit)}) terlampaui!`, 'error');
                        return;
                    }
                } else {
                    if (paidAmount < cartSubtotal) {
                        showToast('Jumlah pembayaran kurang dari total tagihan!', 'error');
                        return;
                    }
                }

                const saleId = 'INV-' + deviceInfo.id.slice(-4) + '-' + Date.now().toString().slice(-6);
                const saleRecord = {
                    id: saleId,
                    date: new Date().toISOString(),
                    device: { id: deviceInfo.id, name: deviceInfo.name, operator: deviceInfo.operator },
                    customer: { id: activeCustomer.id, name: activeCustomer.name, type: activeCustomer.type },
                    items: [...cart],
                    total: cartSubtotal,
                    paymentMethod,
                    paidAmount: paymentMethod === 'Kredit' ? 0 : paidAmount,
                    change: paymentMethod === 'Kredit' ? 0 : changeAmount,
                    status: paymentMethod === 'Kredit' ? 'Kredit' : 'Lunas'
                };

                const updatedProducts = products.map(prod => {
                    const cartItem = cart.find(c => c.id === prod.id);
                    if (cartItem) {
                        const updated = { ...prod, stock: Math.max(0, prod.stock - cartItem.qty) };
                        saveToCloud('products', prod.id, updated);
                        return updated;
                    }
                    return prod;
                });
                setProducts(updatedProducts);

                const newMutations = cart.map(c => {
                    const mut = {
                        id: 'MUT-' + Math.random().toString(36).substr(2, 7),
                        date: new Date().toISOString(),
                        deviceId: deviceInfo.id,
                        productId: c.id,
                        productName: c.name,
                        type: 'KELUAR',
                        qty: c.qty,
                        note: `Penjualan [${deviceInfo.name}] Nota #${saleId}`
                    };
                    saveToCloud('mutations', mut.id, mut);
                    return mut;
                });
                setMutations(prev => [...newMutations, ...prev]);

                if (paymentMethod === 'Kredit') {
                    const newDebt = activeCustomer.currentDebt + cartSubtotal;
                    const updatedCusts = customers.map(c => c.id === activeCustomer.id ? { ...c, currentDebt: newDebt } : c);
                    setCustomers(updatedCusts);

                    const targetCustObj = updatedCusts.find(c => c.id === activeCustomer.id);
                    saveToCloud('customers', activeCustomer.id, targetCustObj);

                    const piutangRecord = {
                        id: 'KAS-' + saleId,
                        date: new Date().toISOString(),
                        type: 'PIUTANG_BARU',
                        entityName: activeCustomer.name,
                        entityType: activeCustomer.type,
                        amountPaid: cartSubtotal,
                        remainingDebt: newDebt,
                        method: 'Kredit Kasbon',
                        note: `Kasbon [${deviceInfo.name}] No. Nota #${saleId}`
                    };
                    setDebtPayments(prev => [piutangRecord, ...prev]);
                    saveToCloud('debt_payments', piutangRecord.id, piutangRecord);
                }

                setSales(prev => [saleRecord, ...prev]);
                saveToCloud('sales', saleRecord.id, saleRecord);

                sendToAppsScript('syncSale', saleRecord);

                setLastCompletedSale(saleRecord);
                setCart([]);
                setAmountPaidInput('');
                setActiveModal('receipt');
                showToast(`Transaksi #${saleId} Berhasil!`);
            };

            const handleSaveProduct = (e) => {
                e.preventDefault();
                if (!editingProduct.name.trim()) {
                    showToast('Nama produk tidak boleh kosong!', 'error');
                    return;
                }
                const isExisting = products.some(p => p.id === editingProduct.id);
                let updatedList = [];
                if (isExisting) {
                    updatedList = products.map(p => p.id === editingProduct.id ? editingProduct : p);
                } else {
                    updatedList = [editingProduct, ...products];
                }
                setProducts(updatedList);
                saveToCloud('products', editingProduct.id, editingProduct);
                showToast(`Produk ${editingProduct.name} berhasil disimpan!`);
                setEditingProduct(null);
            };

            const handleAddNewCategory = (e) => {
                e.preventDefault();
                if (!newCategoryInput.trim()) return;
                const formattedCat = newCategoryInput.trim();
                if (categories.includes(formattedCat)) {
                    showToast('Kategori tersebut sudah ada!', 'error');
                    return;
                }
                const updatedCats = [...categories, formattedCat];
                setCategories(updatedCats);
                localStorage.setItem('mpos_categories', JSON.stringify(updatedCats));
                showToast(`Kategori [${formattedCat}] berhasil ditambahkan!`);
                setNewCategoryInput('');
                setIsAddingCategoryModal(false);
            };

            const handleSaveContact = (e) => {
                e.preventDefault();
                if (!editingContact.name.trim()) {
                    showToast('Nama kontak tidak boleh kosong!', 'error');
                    return;
                }
                if (contactTab === 'pelanggan') {
                    const exists = customers.some(c => c.id === editingContact.id);
                    const updated = exists ? customers.map(c => c.id === editingContact.id ? editingContact : c) : [editingContact, ...customers];
                    setCustomers(updated);
                    saveToCloud('customers', editingContact.id, editingContact);
                } else {
                    const exists = suppliers.some(s => s.id === editingContact.id);
                    const updated = exists ? suppliers.map(s => s.id === editingContact.id ? editingContact : s) : [editingContact, ...suppliers];
                    setSuppliers(updated);
                    saveToCloud('suppliers', editingContact.id, editingContact);
                }
                showToast(`Data ${editingContact.name} berhasil disimpan!`);
                setEditingContact(null);
            };

            const handlePayCustomerDebt = (e) => {
                e.preventDefault();
                const payAmt = parseFloat(payAmountInput) || 0;
                if (payAmt <= 0) {
                    showToast('Masukkan jumlah pembayaran yang valid!', 'error');
                    return;
                }
                const targetCust = customers.find(c => c.id === selectedDebtCustomer.id);
                if (!targetCust) return;

                const newDebt = Math.max(0, targetCust.currentDebt - payAmt);
                const updatedCusts = customers.map(c => c.id === targetCust.id ? { ...c, currentDebt: newDebt } : c);
                setCustomers(updatedCusts);
                saveToCloud('customers', targetCust.id, { ...targetCust, currentDebt: newDebt });

                const kwitansiRecord = {
                    id: 'KW-' + Date.now().toString().slice(-6),
                    date: new Date().toISOString(),
                    type: 'PELANGGAN',
                    entityName: targetCust.name,
                    amountPaid: payAmt,
                    remainingDebt: newDebt,
                    method: paymentMethod,
                    note: paymentNote || 'Pembayaran Cicilan Piutang Tukang'
                };
                setDebtPayments(prev => [kwitansiRecord, ...prev]);
                saveToCloud('debt_payments', kwitansiRecord.id, kwitansiRecord);

                sendToAppsScript('syncDebtPayment', kwitansiRecord);

                setLastKwitansi(kwitansiRecord);
                setSelectedDebtCustomer(null);
                setPayAmountInput('');
                setPaymentNote('');
                setActiveModal('kwitansi');
                showToast('Pembayaran piutang berhasil dicatat!');
            };

            const handlePaySupplierDebt = (e) => {
                e.preventDefault();
                const payAmt = parseFloat(payAmountInput) || 0;
                if (payAmt <= 0) {
                    showToast('Masukkan jumlah pembayaran yang valid!', 'error');
                    return;
                }
                const targetSup = suppliers.find(s => s.id === selectedDebtSupplier.id);
                if (!targetSup) return;

                const newDebt = Math.max(0, targetSup.currentDebt - payAmt);
                const updatedSups = suppliers.map(s => s.id === targetSup.id ? { ...s, currentDebt: newDebt } : s);
                setSuppliers(updatedSups);
                saveToCloud('suppliers', targetSup.id, { ...targetSup, currentDebt: newDebt });

                const kwitansiRecord = {
                    id: 'KW-SUP-' + Date.now().toString().slice(-6),
                    date: new Date().toISOString(),
                    type: 'SUPPLIER',
                    entityName: targetSup.name,
                    amountPaid: payAmt,
                    remainingDebt: newDebt,
                    method: paymentMethod,
                    note: paymentNote || 'Pembayaran Tagihan Supplier'
                };
                setDebtPayments(prev => [kwitansiRecord, ...prev]);
                saveToCloud('debt_payments', kwitansiRecord.id, kwitansiRecord);

                sendToAppsScript('syncDebtPayment', kwitansiRecord);

                setLastKwitansi(kwitansiRecord);
                setSelectedDebtSupplier(null);
                setPayAmountInput('');
                setPaymentNote('');
                setActiveModal('kwitansi');
                showToast('Pembayaran tagihan supplier berhasil dicatat!');
            };

            const handleAddCustomerDebtManual = (e) => {
                e.preventDefault();
                const form = e.target;
                const custId = form.customerId.value;
                const addDebtAmt = parseFloat(form.debtAmount.value) || 0;
                const note = form.note.value;

                if (addDebtAmt <= 0) {
                    showToast('Masukkan jumlah piutang yang valid!', 'error');
                    return;
                }

                const targetCust = customers.find(c => c.id === custId);
                if (!targetCust) return;

                const newDebt = targetCust.currentDebt + addDebtAmt;
                const updatedCusts = customers.map(c => c.id === custId ? { ...c, currentDebt: newDebt } : c);
                setCustomers(updatedCusts);
                saveToCloud('customers', custId, { ...targetCust, currentDebt: newDebt });

                const piutangRecord = {
                    id: 'KASMAN-' + Date.now().toString().slice(-6),
                    date: new Date().toISOString(),
                    type: 'PIUTANG_MANUAL',
                    entityName: targetCust.name,
                    entityType: targetCust.type,
                    amountPaid: addDebtAmt,
                    remainingDebt: newDebt,
                    method: 'Pencatatan Manual',
                    note: note || 'Penambahan piutang/kasbon manual tukang',
                    debtPhoto: uploadedCustomerDebtPhoto || null
                };
                setDebtPayments(prev => [piutangRecord, ...prev]);
                saveToCloud('debt_payments', piutangRecord.id, piutangRecord);

                sendToAppsScript('syncDebtPayment', piutangRecord);

                setIsAddingCustomerDebt(null);
                setUploadedCustomerDebtPhoto(null);
                showToast(`Piutang ${targetCust.name} berhasil ditambahkan!`);
            };

            const handleAddSupplierDebtManual = (e) => {
                e.preventDefault();
                const form = e.target;
                const supId = form.supplierId.value;
                const addDebtAmt = parseFloat(form.debtAmount.value) || 0;
                const note = form.note.value;

                if (addDebtAmt <= 0) {
                    showToast('Masukkan jumlah utang yang valid!', 'error');
                    return;
                }

                const targetSup = suppliers.find(s => s.id === supId);
                if (!targetSup) return;

                const newDebt = targetSup.currentDebt + addDebtAmt;
                const updatedSups = suppliers.map(s => s.id === supId ? { ...s, currentDebt: newDebt } : s);
                setSuppliers(updatedSups);
                saveToCloud('suppliers', supId, { ...targetSup, currentDebt: newDebt });

                const utangRecord = {
                    id: 'UTGMAN-' + Date.now().toString().slice(-6),
                    date: new Date().toISOString(),
                    type: 'UTANG_SUPPLIER_MANUAL',
                    entityName: targetSup.name,
                    amountPaid: addDebtAmt,
                    remainingDebt: newDebt,
                    method: 'Pencatatan Tempo Manual',
                    note: note || 'Penambahan tagihan utang supplier manual',
                    invoicePhoto: uploadedInvoicePhoto || null
                };
                setDebtPayments(prev => [utangRecord, ...prev]);
                saveToCloud('debt_payments', utangRecord.id, utangRecord);

                sendToAppsScript('syncDebtPayment', utangRecord);

                setIsAddingSupplierDebt(null);
                setUploadedInvoicePhoto(null);
                showToast(`Utang ke supplier ${targetSup.name} berhasil ditambahkan!`);
            };

            const handleAddPurchase = (e) => {
                e.preventDefault();
                const form = e.target;
                const prodId = form.productId.value;
                const supName = form.supplierName.value;
                const qty = parseInt(form.qty.value) || 0;
                const buyPrice = parseFloat(form.buyPrice.value) || 0;
                const payType = form.payType.value;

                if (qty <= 0) {
                    showToast('Jumlah barang kulakan harus lebih dari 0!', 'error');
                    return;
                }

                const targetProd = products.find(p => p.id === prodId);
                if (!targetProd) return;

                const totalCost = qty * buyPrice;

                const updatedProducts = products.map(p => {
                    if (p.id === prodId) {
                        return {
                            ...p,
                            stock: p.stock + qty,
                            buyPrice: buyPrice > 0 ? buyPrice : p.buyPrice
                        };
                    }
                    return p;
                });
                setProducts(updatedProducts);
                const updatedTargetProd = updatedProducts.find(p => p.id === prodId);
                saveToCloud('products', prodId, updatedTargetProd);

                const mut = {
                    id: 'MUT-' + Math.random().toString(36).substr(2, 7),
                    date: new Date().toISOString(),
                    deviceId: deviceInfo.id,
                    productId: targetProd.id,
                    productName: targetProd.name,
                    type: 'MASUK',
                    qty: qty,
                    note: `Kulakan / Restock Supplier [${supName}]`
                };
                setMutations(prev => [mut, ...prev]);
                saveToCloud('mutations', mut.id, mut);

                if (payType === 'Tempo (Utang)') {
                    const targetSup = suppliers.find(s => s.name.toLowerCase() === supName.toLowerCase());
                    if (targetSup) {
                        const newDebt = targetSup.currentDebt + totalCost;
                        const updatedSups = suppliers.map(s => s.id === targetSup.id ? { ...s, currentDebt: newDebt } : s);
                        setSuppliers(updatedSups);
                        saveToCloud('suppliers', targetSup.id, { ...targetSup, currentDebt: newDebt });
                    }
                }

                const purchaseRec = {
                    id: 'KUL-' + Date.now().toString().slice(-6),
                    date: new Date().toISOString(),
                    supplierName: supName,
                    items: [{ productId: targetProd.id, productName: targetProd.name, qty, buyPrice }],
                    total: totalCost,
                    paymentMethod: payType,
                    invoicePhoto: uploadedPurchasePhoto || null
                };
                setPurchases(prev => [purchaseRec, ...prev]);
                saveToCloud('purchases', purchaseRec.id, purchaseRec);

                sendToAppsScript('syncPurchase', purchaseRec);

                setIsAddingPurchase(null);
                setUploadedPurchasePhoto(null);
                showToast(`Restock ${targetProd.name} sebanyak ${qty} ${targetProd.unit} berhasil!`);
            };

            const handleAddMutation = (e) => {
                e.preventDefault();
                const form = e.target;
                const prodId = form.productId.value;
                const type = form.type.value;
                const qty = parseInt(form.qty.value) || 0;
                const note = form.note.value;

                if (qty <= 0) {
                    showToast('Jumlah mutasi harus lebih dari 0!', 'error');
                    return;
                }

                const targetProd = products.find(p => p.id === prodId);
                if (!targetProd) return;

                const newStock = type === 'MASUK' ? targetProd.stock + qty : Math.max(0, targetProd.stock - qty);
                const updatedProducts = products.map(p => p.id === prodId ? { ...p, stock: newStock } : p);
                setProducts(updatedProducts);
                saveToCloud('products', targetProd.id, { ...targetProd, stock: newStock });

                const mut = {
                    id: 'MUT-' + Math.random().toString(36).substr(2, 7),
                    date: new Date().toISOString(),
                    deviceId: deviceInfo.id,
                    productId: targetProd.id,
                    productName: targetProd.name,
                    type: type,
                    qty: qty,
                    note: note || 'Penyesuaian stok gudang manual'
                };
                setMutations(prev => [mut, ...prev]);
                saveToCloud('mutations', mut.id, mut);

                setIsAddingMutation(null);
                showToast(`Mutasi stok ${targetProd.name} berhasil disimpan!`);
            };

            const filteredProducts = React.useMemo(() => {
                const searchLower = searchTerm.toLowerCase().trim();
                return products.filter(p => {
                    const matchCat = selectedCategory === 'Semua' || p.category === selectedCategory;
                    const matchSearch = !searchLower || p.name.toLowerCase().includes(searchLower) || (p.sku && p.sku.toLowerCase().includes(searchLower));
                    return matchCat && matchSearch;
                });
            }, [products, selectedCategory, searchTerm]);

            // High Performance: Display limited products in POS view to avoid lag with thousands of items
            const posVisibleProducts = React.useMemo(() => {
                return filteredProducts.slice(0, posDisplayLimit);
            }, [filteredProducts, posDisplayLimit]);

            const filteredSales = React.useMemo(() => {
                const searchLower = salesSearchTerm.toLowerCase().trim();
                return sales.filter(s => {
                    const matchSearch = !searchLower || s.id.toLowerCase().includes(searchLower) || (s.customer?.name || '').toLowerCase().includes(searchLower);
                    const matchStatus = salesStatusFilter === 'Semua' || s.status === salesStatusFilter || s.paymentMethod === salesStatusFilter;
                    const matchDevice = salesDeviceFilter === 'Semua' || (s.device?.id === salesDeviceFilter);
                    const matchDate = !salesDateFilter || new Date(s.date).toISOString().split('T')[0] === salesDateFilter;
                    return matchSearch && matchStatus && matchDevice && matchDate;
                });
            }, [sales, salesSearchTerm, salesStatusFilter, salesDeviceFilter, salesDateFilter]);

            const totalOmset = React.useMemo(() => sales.reduce((sum, s) => sum + s.total, 0), [sales]);
            const totalPiutangTukang = React.useMemo(() => customers.reduce((sum, c) => sum + (c.currentDebt || 0), 0), [customers]);
            const totalUtangSupplier = React.useMemo(() => suppliers.reduce((sum, s) => sum + (s.currentDebt || 0), 0), [suppliers]);
            const lowStockProducts = React.useMemo(() => products.filter(p => p.stock <= p.minStock), [products]);

            const paginatedSales = React.useMemo(() => {
                const start = (salesPage - 1) * PAGE_SIZE;
                return filteredSales.slice(start, start + PAGE_SIZE);
            }, [filteredSales, salesPage]);

            const paginatedMutations = React.useMemo(() => {
                const start = (mutationsPage - 1) * PAGE_SIZE;
                return mutations.slice(start, start + PAGE_SIZE);
            }, [mutations, mutationsPage]);

            const paginatedPurchases = React.useMemo(() => {
                const start = (purchasesPage - 1) * PAGE_SIZE;
                return purchases.slice(start, start + PAGE_SIZE);
            }, [purchases, purchasesPage]);

            const paginatedProducts = React.useMemo(() => {
                const start = (productsPage - 1) * PAGE_SIZE;
                return filteredProducts.slice(start, start + PAGE_SIZE);
            }, [filteredProducts, productsPage]);

            const testAppsScriptSync = async () => {
                if (!storeInfo.appsScriptUrl || !storeInfo.appsScriptUrl.startsWith('http')) {
                    showToast('Masukkan URL Apps Script yang valid terlebih dahulu!', 'error');
                    return;
                }
                try {
                    showToast('Mengirim tes koneksi ke Google Sheets...');
                    await fetch(storeInfo.appsScriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'ping', storeName: storeInfo.name, time: new Date().toISOString() })
                    });
                    showToast('Berhasil mengirim tes ping ke Google Sheets!');
                } catch (e) {
                    showToast('Gagal terhubung ke URL Apps Script.', 'error');
                }
            };

            const syncAllMasterDataToSheets = async () => {
                if (!storeInfo.appsScriptUrl || !storeInfo.appsScriptUrl.startsWith('http')) {
                    showToast('URL Apps Script belum diset di pengaturan!', 'error');
                    return;
                }
                try {
                    showToast('Mengirim sinkronisasi master data ke Google Sheets...');
                    const payload = {
                        action: 'syncAll',
                        storeName: storeInfo.name,
                        products: products,
                        customers: customers,
                        suppliers: suppliers,
                        sales: sales,
                        timestamp: new Date().toISOString()
                    };
                    await fetch(storeInfo.appsScriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    showToast('Master data berhasil dikirim ke Cloud Google Sheets!');
                } catch (e) {
                    showToast('Sinkronisasi Google Sheets gagal.', 'error');
                }
            };

            const copyAppsScriptCodeToClipboard = () => {
                const textarea = document.createElement('textarea');
                textarea.value = APPS_SCRIPT_CODE_TEMPLATE;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('Kode Google Apps Script berhasil disalin!');
                } catch (err) {
                    showToast('Gagal menyalin kode secara otomatis', 'error');
                }
                document.body.removeChild(textarea);
            };

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-slate-100">

                    {toast.show && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-white text-xs sm:text-sm font-bold transition-all duration-300 ${toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
                            <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} text-lg`}></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* Mobile Header */}
                    <div className="md:hidden bg-slate-900 text-white p-3 flex justify-between items-center sticky top-0 z-40 shadow-md">
                        <div className="flex items-center gap-2.5">
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 text-amber-400 hover:bg-slate-800 rounded-lg">
                                <i className="fas fa-bars text-lg"></i>
                            </button>
                            <div>
                                <div className="flex items-center gap-1.5">
                                    <h1 className="font-black text-xs sm:text-sm tracking-wide text-amber-400">{storeInfo.name}</h1>
                                    <span className={`w-2.5 h-2.5 rounded-full ${isCloudLive ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                                </div>
                                <p className="text-[10px] text-slate-400">{deviceInfo.name} ({deviceInfo.operator})</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <button onClick={() => setActiveModal('device_modal')} className="px-2 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-lg text-[10px] font-bold flex items-center gap-1">
                                <i className="fas fa-laptop text-[10px]"></i>
                                <span>Perangkat</span>
                            </button>
                            <button onClick={toggleFullScreen} className="p-2 bg-slate-800 text-amber-400 rounded-lg text-xs font-bold active:scale-95">
                                <i className={`fas ${isFullscreen ? 'fa-compress' : 'fa-expand'}`}></i>
                            </button>
                        </div>
                    </div>

                    {/* Mobile Menu Drawer */}
                    {isMobileMenuOpen && (
                        <div className="fixed inset-0 bg-slate-950/70 z-50 md:hidden flex" onClick={() => setIsMobileMenuOpen(false)}>
                            <div className="w-64 bg-slate-900 text-white h-full p-4 flex flex-col justify-between" onClick={e => e.stopPropagation()}>
                                <div>

                                </div>
                                <button type="submit" className="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl">Simpan Kategori</button>
                            </form>
                        </div>

                                        <label className="block font-bold text-slate-600 mb-1">Nama Lengkap:</label>

                                            <input type="number" value={editingContact.maxLimit} onChange={e => setEditingContact(prev => ({ ...prev, maxLimit: parseFloat(e.target.value) || 0 }))} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" />
                                        </div>
                                    )}
                                </div>
                                <button type="submit" className="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl">Simpan Kontak</button>
                            </form>
                        </div>

                    {/* Pay Customer Debt Modal */}
                    {selectedDebtCustomer && (
                        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">

                                <button type="button" onClick={() => setSelectedDebtCustomer(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <h3 className="font-black text-sm text-slate-900 border-b pb-2">Pembayaran Piutang {selectedDebtCustomer.name}</h3>
                                <div className="space-y-2">

                                <button type="submit" className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl">Proses Pembayaran & Cetak Kwitansi</button>

                        </div>

                    {/* Pay Supplier Debt Modal */}

                                        <span className="text-rose-700">{formatRupiah(selectedDebtSupplier.currentDebt)}</span>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">Nominal Pelunasan (Rp):</label>
                                        <input type="number" value={payAmountInput} onChange={e => setPayAmountInput(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-black text-emerald-700" required />

                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">Catatan Pembayaran:</label>

                                </div>
                                <button type="submit" className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl">Proses Pelunasan Tagihan</button>

                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">Jumlah Kasbon Baru (Rp):</label>
                                        <input type="number" name="debtAmount" placeholder="0" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-black text-amber-700" required />

                                        <label className="block font-bold text-slate-600 mb-1">Jumlah Utang / Tagihan (Rp):</label>

                    {/* Purchase Restock Modal */}
                    {isAddingPurchase && (
                        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                            <form onSubmit={handleAddPurchase} className="bg-white rounded-2xl p-5 shadow-2xl max-w-md w-full space-y-3 relative text-xs">
                                <button type="button" onClick={() => { setIsAddingPurchase(null); setUploadedPurchasePhoto(null); }} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <h3 className="font-black text-sm text-slate-900 border-b pb-2">Catat Pembelian Kulakan Barang Material</h3>
                                <div className="space-y-2">
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">Pilih Barang Material:</label>
                                        <select name="productId" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" required>
                                            {products.map(p => <option key={p.id} value={p.id}>{p.name} (Stok: {p.stock} {p.unit})</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">Nama Supplier / Distributor:</label>
                                        <input type="text" name="supplierName" defaultValue={suppliers[0]?.name || ''} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-extrabold" required />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">Jumlah Masuk (Qty):</label>
                                            <input type="number" name="qty" defaultValue="10" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" required />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">Harga Beli Satuan (Rp):</label>
                                            <input type="number" name="buyPrice" defaultValue="0" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" required />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">Metode Pembayaran:</label>
                                        <select name="payType" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold">
                                            <option value="Tunai">Tunai / Cash Toko</option>
                                            <option value="Transfer">Transfer Bank</option>
                                            <option value="Tempo (Utang)">Tempo (Utang Supplier)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">Foto Faktur Kulakan:</label>
                                        <input type="file" accept="image/*" onChange={handlePurchasePhotoUpload} className="w-full text-xs font-bold" />
                                    </div>
                                </div>
                                <button type="submit" className="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl">Proses Kulakan & Tambah Stok</button>
                            </form>
                        </div>
                    )}

                    {/* Stock Mutation Input Modal */}
                    {isAddingMutation && (
                        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                            <form onSubmit={handleAddMutation} className="bg-white rounded-2xl p-5 shadow-2xl max-w-md w-full space-y-3 relative text-xs">
                                <button type="button" onClick={() => setIsAddingMutation(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <h3 className="font-black text-sm text-slate-900 border-b pb-2">Input Mutasi Stok Manual</h3>
                                <div className="space-y-2">
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">Pilih Produk:</label>
                                        <select name="productId" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" required>
                                            {products.map(p => <option key={p.id} value={p.id}>{p.name} (Stok: {p.stock} {p.unit})</option>)}
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">Tipe Mutasi:</label>
                                            <select name="type" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold">
                                                <option value="MASUK">MASUK (+)</option>
                                                <option value="KELUAR">KELUAR (-)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">Jumlah (Qty):</label>
                                            <input type="number" name="qty" defaultValue="1" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" required />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">Alasan / Keterangan Mutasi:</label>
                                        <input type="text" name="note" placeholder="Kerusakan, Pecah, Retur, Stok Opname..." className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" required />
                                    </div>
                                </div>
                                <button type="submit" className="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl">Simpan Mutasi Stok</button>
                            </form>
                        </div>
                    )}

                    {/* View Photo Attachment Modal */}
                    {viewPhotoModal && (
                        <div className="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-3 sm:p-4" onClick={() => setViewPhotoModal(null)}>
                            <div className="bg-white rounded-2xl p-4 shadow-2xl max-w-lg w-full space-y-3 relative text-xs" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setViewPhotoModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <h3 className="font-black text-sm text-slate-900 border-b pb-2">{viewPhotoModal.title}</h3>
                                <div className="max-h-[70vh] overflow-auto flex justify-center bg-slate-900 rounded-xl p-2">
                                    <img src={viewPhotoModal.src} alt="Foto Faktur" className="max-w-full h-auto object-contain rounded-lg" />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Barcode Scanner Modal Component */}
                    {isScannerOpen && (
                        <BarcodeScannerModal onClose={() => setIsScannerOpen(false)} onScanSuccess={handleBarcodeScanSuccess} />
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MaterialPOSApp />);
    </script>
</body>
</html>
