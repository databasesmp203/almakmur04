        const playBeepSound = () => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) {}
        };

        function BarcodeScannerModal({ onClose, onScanSuccess }) {
            const [scannerStatus, setScannerStatus] = React.useState('Menginisialisasi kamera...');
            const [manualCode, setManualCode] = React.useState('');
            const html5QrcodeRef = React.useRef(null);

            React.useEffect(() => {
                let isMounted = true;

                const initScanner = async () => {
                    try {
                        const devices = await Html5Qrcode.getCameras();
                        if (!isMounted) return;

                        if (devices && devices.length > 0) {
                            const backCam = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear') || d.label.toLowerCase().includes('environment')) || devices[devices.length - 1];
                            const html5Qrcode = new Html5Qrcode("interactive-qr-reader");
                            html5QrcodeRef.current = html5Qrcode;

                            await html5Qrcode.start(
                                backCam.id,
                                { fps: 10, qrbox: { width: 250, height: 160 } },
                                (decodedText) => {
                                    if (isMounted) onScanSuccess(decodedText);
                                },
                                () => {}
                            );
                            if (isMounted) setScannerStatus('Arahkan kamera ke Barcode / QR Code barang');
                        } else {
                            if (isMounted) setScannerStatus('Kamera tidak ditemukan pada perangkat ini.');
                        }
                    } catch (err) {
                        if (isMounted) setScannerStatus('Izin kamera ditolak atau tidak tersedia.');
                    }
                };

                const timer = setTimeout(initScanner, 300);

                return () => {
                    isMounted = false;
                    clearTimeout(timer);
                    if (html5QrcodeRef.current) {
                        try {
                            html5QrcodeRef.current.stop().catch(() => {}).then(() => {
                                try { html5QrcodeRef.current.clear(); } catch(e){}
                            });
                        } catch(e) {}
                    }
                };
            }, []);

            const handleManualSubmit = (e) => {
                e.preventDefault();
                if (!manualCode.trim()) return;
                onScanSuccess(manualCode.trim());
                setManualCode('');
            };

            return (
                <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                    <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl relative text-xs space-y-3">

                            <i className="fas fa-times text-lg"></i>
                        </button>

                        <div className="flex items-center gap-2 border-b pb-2">
                            <div className="w-8 h-8 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-black">
                                <i className="fas fa-barcode"></i>
                            </div>
                            <div>
                                <h3 className="font-extrabold text-slate-900 text-sm">Scanner Barcode & QR Code</h3>
                                <p className="text-[10px] text-slate-500">Scan otomatis SKU/Barcode material bangunan</p>
                            </div>
                        </div>

                        <div className="bg-slate-900 rounded-xl overflow-hidden relative min-h-[220px] flex flex-col items-center justify-center text-white p-2">
                            <div id="interactive-qr-reader" className="w-full"></div>
                            <div className="text-center p-2 text-[11px] text-amber-400 font-bold">
                                <i className="fas fa-camera mr-1"></i>
                                <span>{scannerStatus}</span>
                            </div>
                        </div>

                        <form onSubmit={handleManualSubmit} className="pt-2 border-t space-y-1.5">
                            <label className="block text-[10px] font-bold text-slate-500">Atau Masukkan SKU Barcode Manual / Handheld Scanner:</label>
                            <div className="flex gap-2">
                                <input
                                    type="text"
                                    value={manualCode}
                                    onChange={e => setManualCode(e.target.value)}
                                    placeholder="Ketik/Scan dengan USB Gun Scanner..."
                                    className="flex-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-mono text-xs font-bold"
                                    autoFocus
                                />

                                    Proses
                                </button>
                            </div>
                        </form>

                        <div className="flex justify-between items-center text-[10px] text-slate-400 pt-1">

                            <button onClick={onClose} className="text-slate-600 font-bold hover:underline">Tutup Scanner</button>
                        </div>
                    </div>
                </div>
            );
        }

                try {

                if (!storeInfo.appsScriptUrl || !storeInfo.appsScriptUrl.startsWith('http')) {

                            const p = req.call(docEl);

                        return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);

                            showToast(`Batas stok maksimum (${item.maxStock}) tercapai!`, 'error');

                syncToAppsScript('PEMBAYARAN_UTANG', utangRecord);

                showToast(`Utang baru ke ${sup.name} sebesar ${formatRupiah(amtVal)} dicatat!`);
                setActiveModal('kwitansi');
                setManualDebtFormData({ entityId: '', amount: '', note: '', proofImage: '' });
            };

            const handleAddCategory = (e) => {
                e.preventDefault();
                const catName = newCategoryInput.trim();
                if (!catName) return;
                if (categories.includes(catName)) {
                    showToast('Kategori sudah ada!', 'error');
                    return;
                }
                const updatedCats = [...categories, catName];
                setCategories(updatedCats);
                syncToAppsScript('SYNC_KATEGORI', { categories: updatedCats });
                setNewCategoryInput('');
                showToast(`Kategori ${catName} ditambahkan`);
            };

            const handleDeleteCategory = (catName) => {
                const updatedCats = categories.filter(c => c !== catName);
                setCategories(updatedCats);
                syncToAppsScript('DELETE_KATEGORI', { name: catName });
                syncToAppsScript('SYNC_KATEGORI', { categories: updatedCats });
                showToast(`Kategori ${catName} dihapus`);
            };

            const handleConfirmDeleteProduct = () => {
                if (!deletingProductId) return;
                const targetProd = products.find(p => p.id === deletingProductId);
                const updatedProducts = products.filter(p => p.id !== deletingProductId);
                setProducts(updatedProducts);
                
                syncToAppsScript('DELETE_PRODUK', { id: deletingProductId, name: targetProd?.name });
                syncToAppsScript('SYNC_PRODUK', { products: updatedProducts });
                
                showToast(`Produk ${targetProd?.name || ''} telah dihapus`, 'error');
                setActiveModal(null);
                setDeletingProductId(null);
            };

            const handleDeleteContact = () => {
                if (!deletingContact) return;
                if (deletingContact.type) {
                    const updatedCusts = customers.filter(c => c.id !== deletingContact.id);
                    setCustomers(updatedCusts);
                    
                    syncToAppsScript('DELETE_PELANGGAN', { id: deletingContact.id, name: deletingContact.name });
                    syncToAppsScript('SYNC_PELANGGAN', { customers: updatedCusts });
                    showToast(`Pelanggan ${deletingContact.name} dihapus`);
                } else {
                    const updatedSups = suppliers.filter(s => s.id !== deletingContact.id);
                    setSuppliers(updatedSups);
                    
                    syncToAppsScript('DELETE_SUPPLIER', { id: deletingContact.id, name: deletingContact.name });
                    syncToAppsScript('SYNC_SUPPLIER', { suppliers: updatedSups });
                    showToast(`Supplier ${deletingContact.name} dihapus`);
                }
                setActiveModal(null);
                setDeletingContact(null);
            };

            const handleConfirmResetDatabase = () => {
                setProducts(DEFAULT_PRODUCTS);
                setCustomers(DEFAULT_CUSTOMERS);
                setSuppliers(DEFAULT_SUPPLIERS);
                setSales(DEFAULT_SALES);
                setMutations(DEFAULT_MUTATIONS);
                setDebtPayments(DEFAULT_DEBT_PAYMENTS);
                setPurchases(DEFAULT_PURCHASES);
                showToast('Database lokal dikembalikan ke data sampel awal!', 'error');
                setActiveModal(null);
            };

            const handleSaveProduct = (e) => {
                e.preventDefault();
                const form = e.target;
                const newProduct = {
                    id: editingProduct ? editingProduct.id : 'PRD-' + Date.now().toString().slice(-6),
                    sku: form.sku.value,
                    name: form.name.value,
                    category: form.category.value,
                    unit: form.unit.value,
                    buyPrice: parseFloat(form.buyPrice.value) || 0,
                    sellPrice: parseFloat(form.sellPrice.value) || 0,
                    stock: parseFloat(form.stock.value) || 0,
                    minStock: parseFloat(form.minStock.value) || 5,
                    conversionNote: form.conversionNote.value || ''
                };

                let updatedProducts = [];
                if (editingProduct) {
                    updatedProducts = products.map(p => p.id === editingProduct.id ? newProduct : p);
                    showToast(`Data ${newProduct.name} berhasil diperbarui`);
                } else {
                    updatedProducts = [...products, newProduct];
                    showToast(`Produk ${newProduct.name} berhasil ditambahkan`);
                }
                setProducts(updatedProducts);
                syncToAppsScript('SYNC_PRODUK', { products: updatedProducts });

                setActiveModal(null);
                setEditingProduct(null);
            };

            const handleSaveContact = (e) => {
                e.preventDefault();
                const form = e.target;
                if (contactType === 'pelanggan') {
                    const newCust = {
                        id: editingContact ? editingContact.id : 'CUST-' + Date.now().toString().slice(-6),
                        name: form.contactName.value,
                        phone: form.contactPhone.value || '-',
                        address: form.contactAddress.value || '-',
                        type: form.customerType.value,
                        maxLimit: parseFloat(form.maxLimit.value) || 0,
                        currentDebt: editingContact ? editingContact.currentDebt : 0
                    };
                    let updatedCusts = [];
                    if (editingContact) {
                        updatedCusts = customers.map(c => c.id === editingContact.id ? newCust : c);
                        showToast(`Pelanggan ${newCust.name} berhasil diperbarui`);
                    } else {
                        updatedCusts = [...customers, newCust];
                        showToast(`Pelanggan ${newCust.name} berhasil ditambahkan`);
                    }
                    setCustomers(updatedCusts);
                    syncToAppsScript('SYNC_PELANGGAN', { customers: updatedCusts });
                } else {
                    const newSup = {
                        id: editingContact ? editingContact.id : 'SUP-' + Date.now().toString().slice(-6),
                        name: form.contactName.value,
                        phone: form.contactPhone.value || '-',
                        currentDebt: editingContact ? editingContact.currentDebt : 0
                    };
                    let updatedSups = [];
                    if (editingContact) {
                        updatedSups = suppliers.map(s => s.id === editingContact.id ? newSup : s);
                        showToast(`Supplier ${newSup.name} berhasil diperbarui`);
                    } else {
                        updatedSups = [...suppliers, newSup];
                        showToast(`Supplier ${newSup.name} berhasil ditambahkan`);
                    }
                    setSuppliers(updatedSups);
                    syncToAppsScript('SYNC_SUPPLIER', { suppliers: updatedSups });
                }
                setActiveModal(null);
                setEditingContact(null);
            };

            const handleSaveStoreSettings = (e) => {
                e.preventDefault();
                const form = e.target;
                const updated = {
                    ...storeInfo,
                    name: form.storeName.value,
                    tagline: form.tagline.value,
                    address: form.address.value,
                    phone: form.phone.value,
                    email: form.email.value,
                    bankInfo: form.bankInfo.value,
                    receiptFooter: form.receiptFooter.value,
                    qrisName: form.qrisName.value,
                    qrisNmid: form.qrisNmid.value,
                    appsScriptUrl: form.appsScriptUrl.value.trim()
                };
                setStoreInfo(updated);
                showToast('Pengaturan Profil Toko & QRIS berhasil disimpan!');
            };

            const handleImageUpload = (e, setBase64) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 3 * 1024 * 1024) {
                    showToast('Ukuran file foto maksimal 3MB', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (evt) => setBase64(evt.target.result);
                reader.readAsDataURL(file);
            };

            const exportSalesCSV = () => {
                if (sales.length === 0) {
                    showToast('Tidak ada data penjualan untuk diekspor', 'error');
                    return;
                }
                let csvContent = "data:text/csv;charset=utf-8,";
                csvContent += "No Invoice,Waktu,Pelanggan,Total Belanja,Metode Bayar,Status\n";
                sales.forEach(s => {
                    csvContent += `"${s.id}","${s.date}","${s.customer?.name || 'Umum'}","${s.total}","${s.paymentMethod}","${s.status}"\n`;
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Laporan_Penjualan_${storeInfo.name}_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('Laporan penjualan berhasil di-download sebagai CSV');
            };

            const filteredProducts = products.filter(p => {
                const matchCat = selectedCategory === 'Semua' || p.category === selectedCategory;
                const matchSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.sku.toLowerCase().includes(searchTerm.toLowerCase());
                return matchCat && matchSearch;
            });

            const filteredSales = sales.filter(s => {
                const matchSearch = s.id.toLowerCase().includes(salesSearchTerm.toLowerCase()) || (s.customer?.name || '').toLowerCase().includes(salesSearchTerm.toLowerCase());
                const matchStatus = salesStatusFilter === 'Semua' || s.status === salesStatusFilter || s.paymentMethod === salesStatusFilter;
                return matchSearch && matchStatus;
            });

            const totalOmset = sales.filter(s => s.status !== 'DIBATALKAN').reduce((sum, s) => sum + s.total, 0);
            const totalHPPEstimated = sales.filter(s => s.status !== 'DIBATALKAN').reduce((sum, s) => {
                const invoiceHPP = s.items.reduce((iSum, item) => iSum + ((item.buyPrice || 0) * item.qty), 0);
                return sum + invoiceHPP;
            }, 0);
            const estimatedProfit = Math.max(0, totalOmset - totalHPPEstimated);

            const totalPiutangTukang = customers.reduce((sum, c) => sum + (c.currentDebt || 0), 0);
            const totalUtangSupplier = suppliers.reduce((sum, s) => sum + (s.currentDebt || 0), 0);
            const totalStockValuation = products.reduce((sum, p) => sum + ((p.stock || 0) * (p.buyPrice || 0)), 0);
            const lowStockProducts = products.filter(p => p.stock <= p.minStock);

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-slate-100">

                    {}

                            <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'} text-lg`}></i>
                            <span>{toast.message}</span>
                        </div>

                    {/* MOBILE TOP HEADER */}

                                <i className="fas fa-bars text-lg"></i>
                            </button>
                            <div>
                                <div className="flex items-center gap-1.5">
                                    <h1 className="font-black text-sm tracking-wide text-amber-400">{storeInfo.name}</h1>
                                    <span className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-amber-400 animate-ping' : (storeInfo.appsScriptUrl ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500')}`}></span>
                                </div>
                                <p className="text-[10px] text-slate-400">⚡ Auto-Sync Realtime (Multi-Device)</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1.5">

                                <i className={`fas ${isFullscreen ? 'fa-compress' : 'fa-expand'}`}></i>
                            </button>
                        </div>
                    </div>

                    {/* MOBILE NAVIGATION DRAWER */}

                                    <div className="flex justify-between items-center mb-6 pb-3 border-b border-slate-800">

                                            <span className="font-bold text-sm text-amber-400">Navigasi Menu</span>
                                        </div>
                                        <button onClick={() => setIsMobileMenuOpen(false)} className="text-slate-400 p-1">
                                            <i className="fas fa-times"></i>
                                        </button>
                                    </div>

                                        {[
                                            { id: 'pos', icon: 'fa-cash-register', label: 'Kasir Penjualan' },

                                            { id: 'sales_history', icon: 'fa-receipt', label: 'Riwayat Penjualan' },
                                            { id: 'pembelian', icon: 'fa-truck-ramp-box', label: 'Pembelian & Kulakan' },
                                            { id: 'mutasi', icon: 'fa-boxes-packing', label: 'Mutasi Stok Gudang' },
                                            { id: 'products', icon: 'fa-cubes', label: 'Katalog & Stok' },
                                            { id: 'piutang', icon: 'fa-hand-holding-dollar', label: 'Piutang Tukang' },
                                            { id: 'utang', icon: 'fa-file-invoice-dollar', label: 'Utang Supplier' },
                                            { id: 'contacts', icon: 'fa-users', label: 'Pelanggan & Supplier' },

                                        ].map(item => (
                                            <button
                                                key={item.id}

                                            >
                                                <i className={`fas ${item.icon} w-5 text-center`}></i>
                                                <span>{item.label}</span>
                                            </button>
                                        ))}
                                    </nav>
                                </div>
                                <div className="text-[10px] text-slate-500 pt-4 border-t border-slate-800 text-center">
                                    {storeInfo.name} &copy; 2026
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    <aside className="hidden md:flex md:w-64 bg-slate-900 text-white flex-col justify-between shrink-0 min-h-screen p-4 sticky top-0 h-screen overflow-y-auto">
                        <div>
                            <div className="flex items-center gap-3 pb-4 mb-4 border-b border-slate-800">
                                <div className="w-10 h-10 rounded-xl bg-amber-500 text-slate-950 font-black flex items-center justify-center text-lg shadow-lg">
                                    <i className="fas fa-truck-ramp-box"></i>
                                </div>
                                <div>
                                    <h2 className="font-black text-sm text-amber-400 tracking-tight leading-tight">{storeInfo.name}</h2>
                                    <div className="flex items-center gap-1.5 mt-0.5">
                                        <span className={`w-2 h-2 rounded-full ${isSyncing ? 'bg-amber-400 animate-ping' : (storeInfo.appsScriptUrl ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500')}`}></span>
                                        <span className="text-[10px] text-slate-400 font-medium">
                                            {isSyncing ? 'Menyinkronkan...' : (storeInfo.appsScriptUrl ? '⚡ Auto-Sync Realtime' : 'URL Sheets Belum Set')}

                            <nav className="space-y-1 text-xs">
                                {[

                                    { id: 'sales_history', icon: 'fa-receipt', label: 'Riwayat Penjualan' },

                                    { id: 'utang', icon: 'fa-file-invoice-dollar', label: 'Utang Supplier' },
                                    { id: 'contacts', icon: 'fa-users', label: 'Pelanggan & Supplier' },

                                        key={item.id}

                        <div className="pt-4 border-t border-slate-800 space-y-2">

                                <div className="flex items-center justify-center gap-1.5 text-emerald-400 text-xs font-bold">
                                    <i className="fas fa-bolt text-[10px] animate-bounce"></i>
                                    <span>Auto Sync Aktif</span>
                                </div>
                                <p className="text-[9px] text-slate-400 leading-tight">Data otomatis ter-update antar HP/Tablet tanpa tarik manual</p>
                            </div>
                            <button onClick={toggleFullScreen} className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold rounded-xl text-xs flex items-center justify-center gap-2">
                                <i className={`fas ${isFullscreen ? 'fa-compress' : 'fa-expand'}`}></i>
                                <span>{isFullscreen ? 'Keluar Layar Penuh' : 'Mode Layar Penuh'}</span>
                            </button>
                            <div className="text-[10px] text-slate-500 text-center font-medium">

                        {}
                        {activeTab === 'pos' && (

                                    const targetProd = products.find(p => p.sku.toLowerCase() === scannedText.toLowerCase() || p.id.toLowerCase() === scannedText.toLowerCase());
                                    if (targetProd) {
                                        addToCart(targetProd);
                                        showToast(`Scan Berhasil! Ditambahkan: ${targetProd.name}`);
                                    } else {
                                        setSearchTerm(scannedText);
                                        showToast(`SKU/Barcode "${scannedText}" tidak ditemukan. Menampilkan pencarian.`, 'error');
                                    }
                                } else if (scanTargetField === 'product_form') {
                                    setScannedSkuForForm(scannedText);
                                    showToast(`SKU Barcode "${scannedText}" ditempelkan ke form!`);
                                }
                                setIsScannerOpen(false);
                            }}
                        />
                    )}

                    {/* MODAL: CETAK STRUK RECEIPT */}
                    {activeModal === 'receipt' && lastCompletedSale && (
                        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-white rounded-2xl p-5 shadow-2xl max-w-sm w-full space-y-4 relative text-xs">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 no-print">
                                    <i className="fas fa-times text-lg"></i>
                                </button>

                                <div id="printable-area" className={`mx-auto ${printThermalSize === '58mm' ? 'thermal-58mm' : 'thermal-80mm'}`}>
                                    <div className="text-center space-y-1 pb-2 border-b border-dashed border-slate-400">
                                        <h2 className="font-bold text-sm uppercase">{storeInfo.name}</h2>
                                        <p className="text-[10px]">{storeInfo.address}</p>
                                        <p className="text-[10px]">Telp: {storeInfo.phone}</p>
                                    </div>

                                    <div className="py-2 space-y-1 text-[10px] border-b border-dashed border-slate-400">
                                        <div className="flex justify-between"><span>No Nota:</span><span className="font-bold">{lastCompletedSale.id}</span></div>
                                        <div className="flex justify-between"><span>Waktu:</span><span>{formatDateIndo(lastCompletedSale.date)}</span></div>
                                        <div className="flex justify-between"><span>Pelanggan:</span><span className="font-bold">{lastCompletedSale.customer?.name}</span></div>
                                        <div className="flex justify-between"><span>Metode:</span><span>{lastCompletedSale.paymentMethod}</span></div>
                                    </div>

                                    <div className="py-2 border-b border-dashed border-slate-400 space-y-1 text-[10px]">
                                        {lastCompletedSale.items.map((item, idx) => (
                                            <div key={idx} className="space-y-0.5">
                                                <div className="font-bold">{item.name}</div>
                                                <div className="flex justify-between">
                                                    <span>{item.qty} {item.unit} x {formatRupiah(item.price)}</span>
                                                    <span className="font-bold">{formatRupiah(item.price * item.qty)}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="py-2 space-y-1 text-[10px] font-bold border-b border-dashed border-slate-400">
                                        {lastCompletedSale.subtotal && lastCompletedSale.subtotal !== lastCompletedSale.total && (
                                            <div className="flex justify-between"><span>Subtotal:</span><span>{formatRupiah(lastCompletedSale.subtotal)}</span></div>
                                        )}
                                        {lastCompletedSale.discount > 0 && (
                                            <div className="flex justify-between text-rose-600"><span>Diskon:</span><span>-{formatRupiah(lastCompletedSale.discount)}</span></div>
                                        )}
                                        {lastCompletedSale.shippingFee > 0 && (
                                            <div className="flex justify-between"><span>Ongkir Transport:</span><span>+{formatRupiah(lastCompletedSale.shippingFee)}</span></div>
                                        )}
                                        <div className="flex justify-between text-xs font-black"><span>TOTAL:</span><span>{formatRupiah(lastCompletedSale.total)}</span></div>
                                        <div className="flex justify-between"><span>Bayar:</span><span>{formatRupiah(lastCompletedSale.paidAmount)}</span></div>
                                        <div className="flex justify-between"><span>Kembali:</span><span>{formatRupiah(lastCompletedSale.change)}</span></div>
                                    </div>

                                    <div className="pt-2 text-center text-[9px] text-slate-500 whitespace-pre-line">
                                        {storeInfo.receiptFooter}
                                    </div>
                                </div>

                                <div className="no-print space-y-2 pt-2 border-t">
                                    <div className="flex gap-2">
                                        <button onClick={() => setPrintThermalSize('58mm')} className={`flex-1 py-1.5 rounded-lg text-[10px] font-bold ${printThermalSize === '58mm' ? 'bg-amber-500 text-slate-950' : 'bg-slate-100'}`}>Kertas 58mm</button>
                                        <button onClick={() => setPrintThermalSize('80mm')} className={`flex-1 py-1.5 rounded-lg text-[10px] font-bold ${printThermalSize === '80mm' ? 'bg-amber-500 text-slate-950' : 'bg-slate-100'}`}>Kertas 80mm</button>
                                    </div>
                                    <button onClick={() => window.print()} className="w-full py-2.5 bg-slate-900 text-amber-400 font-extrabold rounded-xl text-xs flex items-center justify-center gap-2">
                                        <i className="fas fa-print"></i>
                                        <span>Cetak Struk Thermal</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: PRODUCT FORM */}
                    {activeModal === 'product_form' && (
                        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-white rounded-2xl p-5 shadow-2xl max-w-md w-full space-y-3 relative text-xs">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <h3 className="font-extrabold text-slate-900 text-sm border-b pb-2">
                                    {editingProduct ? 'Edit Barang Material' : 'Tambah Produk Material Baru'}
                                </h3>

                                <form onSubmit={handleSaveProduct} className="space-y-3">
                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">SKU / Kode Barcode:</label>
                                        <div className="flex gap-2">
                                            <input
                                                type="text"
                                                name="sku"
                                                defaultValue={scannedSkuForForm || (editingProduct ? editingProduct.sku : 'SKU-' + Date.now().toString().slice(-4))}
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-mono font-bold"
                                                required
                                            />
                                            <button
                                                type="button"
                                                onClick={() => { setScanTargetField('product_form'); setIsScannerOpen(true); }}
                                                className="px-3 bg-slate-900 text-amber-400 rounded-xl font-bold"
                                            >
                                                <i className="fas fa-barcode"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">Nama Barang Material:</label>
                                        <input type="text" name="name" defaultValue={editingProduct ? editingProduct.name : ''} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" required />
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Kategori:</label>
                                            <select name="category" defaultValue={editingProduct ? editingProduct.category : categories[0]} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold">
                                                {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Satuan:</label>
                                            <input type="text" name="unit" defaultValue={editingProduct ? editingProduct.unit : 'Sak'} placeholder="Sak / Batang / Kg" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" required />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Harga Beli HPP (Rp):</label>
                                            <input type="number" name="buyPrice" defaultValue={editingProduct ? editingProduct.buyPrice : ''} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" required />
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Harga Jual (Rp):</label>
                                            <input type="number" name="sellPrice" defaultValue={editingProduct ? editingProduct.sellPrice : ''} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" required />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Stok Awal:</label>
                                            <input type="number" name="stock" defaultValue={editingProduct ? editingProduct.stock : '10'} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" required />
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Stok Minimal:</label>
                                            <input type="number" name="minStock" defaultValue={editingProduct ? editingProduct.minStock : '5'} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" required />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-slate-700 mb-1">Catatan Konversi / Spesifikasi:</label>
                                        <input type="text" name="conversionNote" defaultValue={editingProduct ? editingProduct.conversionNote : ''} placeholder="Contoh: 1 Sak = 50kg" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" />
                                    </div>

                                    <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl text-xs shadow-md">
                                        Simpan Produk Material
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: PURCHASE FORM KULAKAN */}
                    {activeModal === 'purchase_form' && (
                        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-white rounded-2xl p-5 shadow-2xl max-w-lg w-full space-y-3 relative text-xs max-h-[90vh] overflow-y-auto">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <h3 className="font-extrabold text-slate-900 text-sm border-b pb-2">Form Catat Pembelian Material / Kulakan</h3>

                                <form onSubmit={handleSavePurchase} className="space-y-3">
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Supplier / Distributor:</label>
                                            <select value={selectedPurchaseSupplierId} onChange={e=>setSelectedPurchaseSupplierId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold">
                                                <option value="">-- Pilih Supplier --</option>
                                                {suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">No Faktur Supplier:</label>
                                            <input type="text" value={purchaseInvoiceNo} onChange={e=>setPurchaseInvoiceNo(e.target.value)} placeholder="FAK-SUP-..." className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold" />
                                        </div>
                                    </div>

                                    <div className="p-3 bg-slate-50 rounded-xl border space-y-2">
                                        <label className="block font-extrabold text-slate-800">Tambah Barang Ke Daftar Belanja:</label>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                            <select value={addItemProdId} onChange={e=>{
                                                setAddItemProdId(e.target.value);
                                                const selectedP = products.find(p=>p.id===e.target.value);
                                                if(selectedP) setAddItemBuyPrice(selectedP.buyPrice.toString());
                                            }} className="bg-white border rounded-lg p-2 font-bold col-span-1 sm:col-span-3">
                                                <option value="">-- Pilih Produk --</option>
                                                {products.map(p => <option key={p.id} value={p.id}>{p.name} (Stok: {p.stock} {p.unit})</option>)}
                                            </select>
                                            <input type="number" value={addItemQty} onChange={e=>setAddItemQty(e.target.value)} placeholder="Qty Sak/Pcs" className="bg-white border rounded-lg p-2 font-bold" />
                                            <input type="number" value={addItemBuyPrice} onChange={e=>setAddItemBuyPrice(e.target.value)} placeholder="Harga Beli (Rp)" className="bg-white border rounded-lg p-2 font-bold" />
                                            <button type="button" onClick={handleAddItemToPurchaseCart} className="bg-amber-500 text-slate-950 font-extrabold rounded-lg p-2">
                                                + Tambah
                                            </button>
                                        </div>
                                    </div>

                                    <div className="space-y-1 max-h-40 overflow-y-auto">
                                        {purchaseCart.map(item => (
                                            <div key={item.id} className="p-2 bg-slate-100 rounded-lg flex justify-between items-center text-xs">
                                                <div>
                                                    <div className="font-bold text-slate-900">{item.name}</div>
                                                    <div className="text-[10px] text-slate-500">{item.qty} {item.unit} x {formatRupiah(item.buyPrice)}</div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <span className="font-black text-slate-900">{formatRupiah(item.qty * item.buyPrice)}</span>
                                                    <button type="button" onClick={() => setPurchaseCart(prev=>prev.filter(i=>i.id!==item.id))} className="text-rose-500 p-1"><i className="fas fa-times"></i></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Metode Bayar Kulakan:</label>
                                            <select value={purchasePaymentMethod} onChange={e=>setPurchasePaymentMethod(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold">
                                                <option value="Tunai">Tunai / Cash</option>
                                                <option value="Tempo">Tempo / Utang Faktur</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-1">Upload Bukti Faktur (Foto):</label>
                                            <input type="file" accept="image/*" onChange={e => handleImageUpload(e, setPurchaseProofImage)} className="w-full text-[10px]" />
                                        </div>
                                    </div>

                                    <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl text-xs shadow-md">
                                        Simpan Transaksi Kulakan
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: QRIS DISPLAY */}
                    {activeModal === 'qris_pay_modal' && (
                        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-white rounded-2xl p-5 shadow-2xl max-w-xs w-full text-center space-y-3 relative">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <h3 className="font-extrabold text-slate-900 text-sm">Kode QRIS Kasir Toko</h3>
                                <p className="text-[10px] text-slate-500">{storeInfo.qrisName}</p>
                                
                                <div className="p-3 bg-slate-900 rounded-xl inline-block">
                                    <img
                                        src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=QRIS_${encodeURIComponent(storeInfo.qrisName)}_${cartGrandTotal}`}
                                        alt="Kode QRIS"
                                        className="w-48 h-48 mx-auto rounded-lg bg-white p-2"
                                    />
                                </div>
                                
                                <div>
                                    <div className="text-[10px] text-slate-400 font-bold uppercase">Total Pembayaran</div>
                                    <div className="text-lg font-black text-amber-600">{formatRupiah(cartGrandTotal)}</div>
                                </div>

                                <button onClick={() => setActiveModal(null)} className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-xl text-xs">
                                    Konfirmasi Pembayaran Selesai
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MaterialPOSApp />);
    </script>
</body>
</html>
