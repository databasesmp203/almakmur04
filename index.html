        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'materialpos-multi-device';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDemoConfigForFallback",
            authDomain: "demo-materialpos.firebaseapp.com",
            projectId: "demo-materialpos",
            storageBucket: "demo-materialpos.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:demomaterialpos"
        };

        window.POS_CLOUD = {
            appId,
            firebaseConfig,
            isCloudEnabled: typeof __firebase_config !== 'undefined',
            initCloudSync: async (onReady, onError) => {
                try {
                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);
                    const db = getFirestore(app);

                    let user = null;
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        const cred = await signInWithCustomToken(auth, __initial_auth_token);
                        user = cred.user;
                    } else {
                        const cred = await signInAnonymously(auth);
                        user = cred.user;
                    }

                    if (user) {
                        onReady({ db, auth, user, appId, doc, getDoc, setDoc, updateDoc, collection, onSnapshot });
                    }
                } catch (err) {
                    console.warn("Cloud sync running in local fallback mode:", err);
                    if (onError) onError(err);
                }
            }
        };

        const APPS_SCRIPT_CODE_TEMPLATE = `// =================================================================
// GOOGLE APPS SCRIPT BACKEND FOR MATERIALPOS PRO v5.0
// Tempatkan kode ini di Google Sheets -> Ekstensi -> Apps Script
// =================================================================

function doPost(e) {
  try {
    var data = JSON.parse(e.postData.contents);
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var action = data.action;

    if (action === 'ping') {
      return ContentService.createTextOutput(JSON.stringify({ status: 'success', message: 'Terhubung dengan Google Sheets!' })).setMimeType(ContentService.MimeType.JSON);
    }

    if (action === 'syncSale') {
      var sheet = getOrCreateSheet(ss, 'Penjualan', ['ID Nota', 'Tanggal', 'Perangkat', 'Kasir', 'Pelanggan', 'Total Belanja', 'Metode Bayar', 'Status']);
      var sale = data.payload || {};
      sheet.appendRow([
        sale.id || '',
        sale.date || new Date().toISOString(),
        sale.device ? sale.device.name : '',
        sale.device ? sale.device.operator : '',
        sale.customer ? sale.customer.name : '',
        sale.total || 0,
        sale.paymentMethod || '',
        sale.status || 'Lunas'
      ]);
    } else if (action === 'syncDebtPayment') {
      var sheet = getOrCreateSheet(ss, 'Pembayaran_Hutang', ['ID Kwitansi', 'Tanggal', 'Tipe', 'Nama Kontak', 'Jumlah Dibayar', 'Sisa Tagihan', 'Metode Bayar', 'Keterangan']);
      var kw = data.payload || {};
      sheet.appendRow([
        kw.id || '',
        kw.date || new Date().toISOString(),
        kw.type || '',
        kw.entityName || '',
        kw.amountPaid || 0,
        kw.remainingDebt || 0,
        kw.method || '',
        kw.note || ''
      ]);
    } else if (action === 'syncPurchase') {
      var sheet = getOrCreateSheet(ss, 'Pembelian_Kulakan', ['ID Kulakan', 'Tanggal', 'Supplier', 'Metode Bayar', 'Total Belanja']);
      var pur = data.payload || {};
      sheet.appendRow([
        pur.id || '',
        pur.date || new Date().toISOString(),
        pur.supplierName || '',
        pur.paymentMethod || '',
        pur.total || 0
      ]);
    } else if (action === 'syncAll') {
      if (data.products && Array.isArray(data.products)) {
        var pSheet = getOrCreateSheet(ss, 'Master_Produk', ['SKU', 'Nama Produk', 'Kategori', 'Satuan', 'HPP Beli', 'Harga Jual', 'Stok']);
        pSheet.clear();
        pSheet.appendRow(['SKU', 'Nama Produk', 'Kategori', 'Satuan', 'HPP Beli', 'Harga Jual', 'Stok']);
        data.products.forEach(function(p) {
          pSheet.appendRow([p.sku, p.name, p.category, p.unit, p.buyPrice, p.sellPrice, p.stock]);
        });
      }
      if (data.customers && Array.isArray(data.customers)) {
        var cSheet = getOrCreateSheet(ss, 'Master_Pelanggan', ['ID', 'Nama', 'No HP', 'Alamat', 'Tipe', 'Piutang']);
        cSheet.clear();
        cSheet.appendRow(['ID', 'Nama', 'No HP', 'Alamat', 'Tipe', 'Piutang']);
        data.customers.forEach(function(c) {
          cSheet.appendRow([c.id, c.name, c.phone, c.address, c.type, c.currentDebt]);
        });
      }
      if (data.suppliers && Array.isArray(data.suppliers)) {
        var sSheet = getOrCreateSheet(ss, 'Master_Supplier', ['ID', 'Nama', 'No HP', 'Alamat', 'Kategori', 'Utang Tempo']);
        sSheet.clear();
        sSheet.appendRow(['ID', 'Nama', 'No HP', 'Alamat', 'Kategori', 'Utang Tempo']);
        data.suppliers.forEach(function(s) {
          sSheet.appendRow([s.id, s.name, s.phone, s.address, s.type, s.currentDebt]);
        });

    return ContentService.createTextOutput(JSON.stringify({ status: 'success' })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: err.toString() })).setMimeType(ContentService.MimeType.JSON);
  }
}

function getOrCreateSheet(ss, name, headers) {
  var sheet = ss.getSheetByName(name);
  if (!sheet) {
    sheet = ss.insertSheet(name);
    if (headers) sheet.appendRow(headers);
  } else if (sheet.getLastRow() === 0 && headers) {
    sheet.appendRow(headers);
  }
  return sheet;
}`;

        const formatRupiah = (num) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(num || 0);
        };

        const playBeepSound = () => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) {}
        };

        function BarcodeScannerModal({ onClose, onScanSuccess }) {
            const [scannerStatus, setScannerStatus] = React.useState('Menginisialisasi kamera...');
            const [manualCode, setManualCode] = React.useState('');
            const html5QrcodeRef = React.useRef(null);

            React.useEffect(() => {
                let isMounted = true;
                const initScanner = async () => {
                    try {
                        const devices = await Html5Qrcode.getCameras();
                        if (!isMounted) return;
                        if (devices && devices.length > 0) {
                            const backCam = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear') || d.label.toLowerCase().includes('environment')) || devices[devices.length - 1];
                            const html5Qrcode = new Html5Qrcode("interactive-qr-reader");
                            html5QrcodeRef.current = html5Qrcode;

                            await html5Qrcode.start(
                                backCam.id,
                                { fps: 10, qrbox: { width: 250, height: 160 } },
                                (decodedText) => {
                                    if (isMounted) {
                                        playBeepSound();
                                        onScanSuccess(decodedText);
                                    }
                                },
                                () => {}
                            );
                            if (isMounted) setScannerStatus('Arahkan kamera ke Barcode / QR Code barang');
                        } else {
                            if (isMounted) setScannerStatus('Kamera tidak ditemukan pada perangkat ini.');
                        }
                    } catch (err) {
                        if (isMounted) setScannerStatus('Izin kamera ditolak atau tidak tersedia.');
                    }
                };

                const timer = setTimeout(initScanner, 300);
                return () => {
                    isMounted = false;
                    clearTimeout(timer);
                    if (html5QrcodeRef.current) {
                        try {
                            html5QrcodeRef.current.stop().catch(() => {}).then(() => {
                                try { html5QrcodeRef.current.clear(); } catch(e){}
                            });
                        } catch(e) {}
                    }
                };
            }, []);

            const handleManualSubmit = (e) => {
                e.preventDefault();
                if (!manualCode.trim()) return;
                playBeepSound();
                onScanSuccess(manualCode.trim());
                setManualCode('');
            };

            return (
                <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                    <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl relative text-xs space-y-3">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 z-10">
                            <i className="fas fa-times text-lg"></i>
                        </button>

                        <div className="flex items-center gap-2 border-b pb-2">
                            <div className="w-8 h-8 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-black">
                                <i className="fas fa-barcode"></i>
                            </div>
                            <div>
                                <h3 className="font-extrabold text-slate-900 text-sm">Scanner Barcode & QR Code</h3>
                                <p className="text-[10px] text-slate-500">Scan otomatis SKU/Barcode material bangunan</p>
                            </div>
                        </div>

                        <div className="bg-slate-900 rounded-xl overflow-hidden relative min-h-[220px] flex flex-col items-center justify-center text-white p-2">
                            <div id="interactive-qr-reader" className="w-full"></div>
                            <div className="text-center p-2 text-[11px] text-amber-400 font-bold">
                                <i className="fas fa-camera mr-1"></i>
                                <span>{scannerStatus}</span>
                            </div>
                        </div>

                        <form onSubmit={handleManualSubmit} className="pt-2 border-t space-y-1.5">
                            <label className="block text-[10px] font-bold text-slate-500">Masukkan SKU Barcode Manual / Handheld Scanner:</label>
                            <div className="flex gap-2">
                                <input
                                    type="text"
                                    value={manualCode}
                                    onChange={e => setManualCode(e.target.value)}
                                    placeholder="Ketik/Scan dengan USB Gun Scanner..."
                                    className="flex-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-mono text-xs font-bold"
                                    autoFocus
                                />
                                <button type="submit" className="px-3.5 bg-amber-500 text-slate-950 font-extrabold rounded-xl text-xs hover:bg-amber-400">
                                    Proses
                                </button>
                            </div>
                        </form>

                        <div className="flex justify-between items-center text-[10px] text-slate-400 pt-1">
                            <span>Mendukung Barcode USB Gun, Kamera HP & Tablet</span>
                            <button onClick={onClose} className="text-slate-600 font-bold hover:underline">Tutup Scanner</button>
                        </div>
                    </div>
                </div>
            );
        }

                        return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);

                    return [...prev, {
                        id: product.id,

                const matchSearch = s.id.toLowerCase().includes(salesSearchTerm.toLowerCase()) || (s.customer?.name || '').toLowerCase().includes(salesSearchTerm.toLowerCase());
                const matchStatus = salesStatusFilter === 'Semua' || s.status === salesStatusFilter || s.paymentMethod === salesStatusFilter;
                const matchDevice = salesDeviceFilter === 'Semua' || (s.device?.id === salesDeviceFilter);
                return matchSearch && matchStatus && matchDevice;
            });

            const totalOmset = sales.reduce((sum, s) => sum + s.total, 0);
            const totalPiutangTukang = customers.reduce((sum, c) => sum + c.currentDebt, 0);
            const totalUtangSupplier = suppliers.reduce((sum, s) => sum + s.currentDebt, 0);
            const lowStockProducts = products.filter(p => p.stock <= p.minStock);

            const testAppsScriptSync = async () => {
                if (!storeInfo.appsScriptUrl || !storeInfo.appsScriptUrl.startsWith('http')) {
                    showToast('Masukkan URL Apps Script yang valid terlebih dahulu!', 'error');
                    return;
                }
                try {
                    showToast('Mengirim tes koneksi ke Google Sheets...');
                    await fetch(storeInfo.appsScriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'ping', storeName: storeInfo.name, time: new Date().toISOString() })
                    });
                    showToast('Berhasil mengirim tes ping ke Google Sheets!');
                } catch (e) {
                    showToast('Gagal terhubung ke URL Apps Script.', 'error');
                }
            };

            const syncAllMasterDataToSheets = async () => {
                if (!storeInfo.appsScriptUrl || !storeInfo.appsScriptUrl.startsWith('http')) {
                    showToast('URL Apps Script belum diset di pengaturan!', 'error');
                    return;
                }
                try {
                    showToast('Mengirim sinkronisasi master data ke Google Sheets...');
                    const payload = {
                        action: 'syncAll',
                        storeName: storeInfo.name,
                        products: products,
                        customers: customers,
                        suppliers: suppliers,
                        sales: sales,
                        timestamp: new Date().toISOString()
                    };
                    await fetch(storeInfo.appsScriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    showToast('Master data berhasil dikirim ke Cloud Google Sheets!');
                } catch (e) {
                    showToast('Sinkronisasi Google Sheets gagal.', 'error');
                }
            };

            const copyAppsScriptCodeToClipboard = () => {
                const textarea = document.createElement('textarea');
                textarea.value = APPS_SCRIPT_CODE_TEMPLATE;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('Kode Google Apps Script berhasil disalin!');
                } catch (err) {
                    showToast('Gagal menyalin kode secara otomatis', 'error');
                }
                document.body.removeChild(textarea);
            };

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-slate-100">

                    {toast.show && (

                            <span>{toast.message}</span>
                        </div>

                                <div className="flex items-center gap-1.5">

                                    <span className={`w-2.5 h-2.5 rounded-full ${isCloudLive ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                                </div>
                                <p className="text-[10px] text-slate-400">{deviceInfo.name} ({deviceInfo.operator})</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1.5">

                                <i className="fas fa-laptop text-[10px]"></i>
                                <span>Perangkat</span>
                            </button>

                                <i className={`fas ${isFullscreen ? 'fa-compress' : 'fa-expand'}`}></i>

                                                <span className="text-[9px] text-slate-400 block">{deviceInfo.operator}</span>

                                        </div>

                                            <i className="fas fa-times"></i>
                                        </button>

                                        {[
                                            { id: 'pos', icon: 'fa-cash-register', label: 'Kasir Penjualan' },
                                            { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard Store' },
                                            { id: 'sales_history', icon: 'fa-receipt', label: 'Riwayat Penjualan' },
                                            { id: 'pembelian', icon: 'fa-truck-ramp-box', label: 'Pembelian & Kulakan' },
                                            { id: 'mutasi', icon: 'fa-boxes-packing', label: 'Mutasi Stok Gudang' },
                                            { id: 'products', icon: 'fa-cubes', label: 'Stok & Katalog Produk' },
                                            { id: 'piutang', icon: 'fa-hand-holding-dollar', label: 'Piutang Tukang' },
                                            { id: 'utang', icon: 'fa-file-invoice-dollar', label: 'Utang Supplier' },
                                            { id: 'contacts', icon: 'fa-users', label: 'Pelanggan & Supplier' },

                                                <i className={`fas ${item.icon} w-5 text-center`}></i>
                                                <span>{item.label}</span>

                                </div>
                            </div>

                                    <i className="fas fa-truck-ramp-box"></i>

                                            <span>Pulihkan Data Demo / Reset</span>

                                            <i className="fas fa-chart-line text-emerald-500 text-base"></i>

                                    </div>

                                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                                        <div className="flex justify-between items-center text-slate-400 text-xs font-bold">
                                            <span>Total Piutang Tukang</span>
                                            <i className="fas fa-hand-holding-dollar text-amber-500 text-base"></i>
                                        </div>
                                        <div className="text-base sm:text-xl font-black text-amber-600">{formatRupiah(totalPiutangTukang)}</div>
                                        <div className="text-[10px] text-slate-500">Tagihan kasbon pelanggan</div>
                                    </div>

                                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                                        <div className="flex justify-between items-center text-slate-400 text-xs font-bold">
                                            <span>Utang Toko ke Supplier</span>
                                            <i className="fas fa-file-invoice-dollar text-rose-500 text-base"></i>

                                        <div className="text-base sm:text-xl font-black text-rose-600">{formatRupiah(totalUtangSupplier)}</div>

                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                                    <div className="lg:col-span-7 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                        <div className="flex justify-between items-center border-b pb-2">
                                            <h3 className="font-extrabold text-slate-900 text-xs sm:text-sm flex items-center gap-2">
                                                <i className="fas fa-triangle-exclamation text-amber-500"></i>
                                                <span>Peringatan Stok Menipis ({lowStockProducts.length})</span>

                                            <button onClick={() => setActiveTab('products')} className="text-xs font-extrabold text-amber-600 hover:underline">

                                    </div>

                                    <div className="lg:col-span-5 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                        <h3 className="font-extrabold text-slate-900 text-xs sm:text-sm border-b pb-2 flex items-center gap-2">
                                            <i className="fas fa-crown text-amber-500"></i>

                                                    <div className="flex items-center gap-2.5">
                                                        <span className="w-6 h-6 rounded-lg bg-amber-500 text-slate-950 font-black flex items-center justify-center text-[10px]">
                                                            #{idx + 1}
                                                        </span>
                                                        <div>
                                                            <div className="font-bold text-slate-900 line-clamp-1">{p.name}</div>

                                        </div>
                                    </div>
                                </div>
                            </div>

                        {activeTab === 'pos' && (

                                                <th className="p-3">No. Telepon</th>
                                                <th className="p-3">Alamat</th>
                                                <th className="p-3">Tipe / Kategori</th>
                                                <th className="p-3">Sisa Utang/Piutang</th>
                                                <th className="p-3 text-right">Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 font-semibold text-slate-800">

                                                <tr key={item.id} className="hover:bg-slate-50">
                                                    <td className="p-3 font-extrabold text-slate-900">{item.name}</td>
                                                    <td className="p-3 text-slate-500">{item.phone}</td>
                                                    <td className="p-3 text-slate-500">{item.address || '-'}</td>
                                                    <td className="p-3"><span className="bg-slate-100 px-2 py-0.5 rounded text-[10px] font-bold">{item.type || 'Supplier'}</span></td>

                                                    <td className="p-3 text-right space-x-1">
                                                        <button onClick={() => setEditingContact(item)} className="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg">
                                                            <i className="fas fa-pen"></i>
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        {activeTab === 'settings' && (
                            <div className="max-w-3xl mx-auto space-y-4">

                                        <span>Profil & Identitas Toko Material</span>

                                            <label className="block font-bold text-slate-600 mb-1">Nama Toko / Usaha:</label>

                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">Slogan / Tagline:</label>

                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">No. Telepon / WhatsApp:</label>

                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">Alamat Lengkap Toko:</label>
                                            <input type="text" value={storeInfo.address} onChange={e => setStoreInfo({ ...storeInfo, address: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">Nama Bank:</label>
                                            <input type="text" value={storeInfo.bankName || 'BCA'} onChange={e => setStoreInfo({ ...storeInfo, bankName: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold" placeholder="Contoh: BCA" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">Nomor Rekening Bank:</label>
                                            <input type="text" value={storeInfo.bankNumber || ''} onChange={e => setStoreInfo({ ...storeInfo, bankNumber: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold" placeholder="Contoh: 8830123456" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">Nama Pemilik Rekening:</label>
                                            <input type="text" value={storeInfo.bankHolder || ''} onChange={e => setStoreInfo({ ...storeInfo, bankHolder: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold" placeholder="Contoh: TB Jaya Material" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">Nama Merchant QRIS:</label>
                                            <input type="text" value={storeInfo.qrisName} onChange={e => setStoreInfo({ ...storeInfo, qrisName: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold" placeholder="Contoh: TB. JAYA MATERIAL PRO" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">NMID QRIS:</label>
                                            <input type="text" value={storeInfo.qrisNmid} onChange={e => setStoreInfo({ ...storeInfo, qrisNmid: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold font-mono" placeholder="Contoh: ID1020304050607" />
                                        </div>
                                        <div>
                                            <div className="flex justify-between items-center mb-1">
                                                <label className="font-bold text-slate-600">Google Apps Script Web App URL:</label>
                                                <button type="button" onClick={() => setActiveModal('apps_script_guide')} className="text-[10px] text-amber-600 font-extrabold hover:underline">

                                            <label className="block font-bold text-slate-600 mb-1">Catatan Kaki Struk (Footer Struk Thermal):</label>

                                        </button>

                        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
                            <div className="bg-white rounded-2xl p-5 shadow-2xl max-w-2xl w-full space-y-4 relative text-xs my-auto">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <div className="flex items-center gap-2.5 border-b pb-2">
                                    <div className="w-8 h-8 rounded-xl bg-slate-900 text-amber-400 flex items-center justify-center font-black">
                                        <i className="fas fa-file-code"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-extrabold text-slate-900 text-sm">Kode Google Apps Script (Code.gs)</h3>
                                        <p className="text-[10px] text-slate-500">Salin kode di bawah untuk di-paste ke Google Sheets Apps Script Anda</p>
                                    </div>
                                </div>

                                <div className="space-y-2 text-slate-600 text-[11px]">
                                    <p className="font-bold text-slate-800">Langkah Pemasangan di Google Sheets:</p>

                                        <li>Buka Google Sheets baru di browser laptop/PC Anda.</li>
                                        <li>Klik menu <b>Ekstensi</b> &rarr; <b>Apps Script</b>.</li>
                                        <li>Hapus seluruh isi file <code className="bg-slate-100 px-1 py-0.5 rounded">Code.gs</code> lalu <b>Paste</b> kode di bawah ini.</li>
                                        <li>Klik tombol <b>Terapkan (Deploy)</b> &rarr; <b>Penerapan Baru (New Deployment)</b>.</li>
                                        <li>Pilih Jenis: <b>Aplikasi Web (Web App)</b>.</li>
                                        <li>Atur <i>Jalankan Sebagai (Execute as)</i>: <b>Saya (Me)</b> & <i>Yang memiliki akses (Who has access)</i>: <b>Siapa Saja (Anyone)</b>.</li>
                                        <li>Salin <b>URL Aplikasi Web</b> yang dihasilkan dan tempel di Pengaturan Toko aplikasi ini.</li>
                                    </ol>
                                </div>

                                        {APPS_SCRIPT_CODE_TEMPLATE}
                                    </pre>
                                </div>

                                <div className="flex justify-between items-center pt-2 border-t">
                                    <span className="text-[10px] text-slate-400">Google Apps Script v5.0 Ultimate Engine</span>
                                    <div className="flex gap-2">
                                        <button onClick={copyAppsScriptCodeToClipboard} className="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl shadow-md flex items-center gap-1.5">
                                            <i className="fas fa-copy"></i>
                                            <span>Salin Seluruh Kode Script</span>
                                        </button>
                                        <button onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl">Tutup</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <div className="flex items-center gap-2.5 border-b pb-2">
                                    <div className="w-8 h-8 rounded-xl bg-slate-900 text-amber-400 flex items-center justify-center font-black">
                                        <i className="fas fa-folder-plus"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-extrabold text-slate-900 text-sm">Tambah Kategori Material Baru</h3>

                                    <div className="flex justify-end gap-2 pt-2">

                                        <button type="submit" className="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl shadow-md">Simpan Kategori</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                                <button onClick={() => setEditingProduct(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">

                                                    <i className="fas fa-barcode"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div>

                                        <input type="text" required value={editingProduct.name} onChange={e => setEditingProduct({ ...editingProduct, name: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold" placeholder="Contoh: Semen Gresik 50kg" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-500 mb-1">Satuan Jual:</label>
                                            <input type="text" required value={editingProduct.unit} onChange={e => setEditingProduct({ ...editingProduct, unit: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold" placeholder="Sak / Batang / Lembar / Kg" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-500 mb-1">Stok Minimum Alert:</label>

                                        </div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">

                                            <label className="block text-[10px] font-bold text-slate-500 mb-1">Harga Beli HPP (Rp):</label>

                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-500 mb-1">Harga Jual (Rp):</label>
                                            <input type="number" required value={editingProduct.sellPrice} onChange={e => setEditingProduct({ ...editingProduct, sellPrice: parseFloat(e.target.value) || 0 })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold text-emerald-700" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-500 mb-1">Stok Fisik:</label>
                                            <input type="number" required value={editingProduct.stock} onChange={e => setEditingProduct({ ...editingProduct, stock: parseInt(e.target.value) || 0 })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-500 mb-1">Catatan Konversi / Keterangan Tambahan:</label>
                                        <input type="text" value={editingProduct.conversionNote || ''} onChange={e => setEditingProduct({ ...editingProduct, conversionNote: e.target.value })} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs" placeholder="Opsional: Misal '1 Ikat = 10 Batang'" />
                                    </div>
                                    <div className="flex justify-end gap-2 pt-3">
                                        <button type="button" onClick={() => setEditingProduct(null)} className="px-4 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl">Batal</button>
                                        <button type="submit" className="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl shadow-md">Simpan Produk</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                                <button onClick={() => setEditingContact(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <div className="flex items-center gap-2.5 border-b pb-2">

                                        <i className="fas fa-address-book"></i>

                                        <h3 className="font-extrabold text-slate-900 text-sm">

                                </div>

                                                    <option value="Toko/Reseller">Toko / Reseller</option>

                                            </div>
                                        </div>

                                </div>
                                <div className="border-t border-b py-2 space-y-1 max-h-48 overflow-y-auto">
                                    <div className="font-bold text-[10px] text-slate-400 uppercase">Item Material Dibeli:</div>
                                    {selectedSaleDetail.items.map((item, idx) => (
                                        <div key={idx} className="flex justify-between text-xs py-1">
                                            <div>
                                                <div className="font-bold text-slate-900">{item.name}</div>
                                                <div className="text-[10px] text-slate-500">{item.qty} {item.unit} x {formatRupiah(item.price)}</div>
                                            </div>
                                            <div className="font-black text-slate-900">{formatRupiah(item.qty * item.price)}</div>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex justify-between text-sm font-black border-b pb-2">
                                    <span>Total Belanja:</span>
                                    <span className="text-amber-600">{formatRupiah(selectedSaleDetail.total)}</span>
                                </div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button onClick={() => {
                                        setLastCompletedSale(selectedSaleDetail);
                                        setActiveModal('receipt');
                                    }} className="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl shadow-md flex items-center gap-1.5">
                                        <i className="fas fa-print"></i>
                                        <span>Cetak Struk Thermal</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: PRINTABLE KWITANSI */}
                    {activeModal === 'kwitansi' && lastKwitansi && (
                        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-white rounded-2xl p-5 shadow-2xl max-w-md w-full space-y-4 relative text-xs">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 no-print">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <div id="printable-area" className="kwitansi-paper bg-amber-50/50 p-4 rounded border border-amber-200 mx-auto space-y-3">
                                    <div className="text-center border-b border-amber-300 pb-2">
                                        <h3 className="font-black text-sm uppercase">{storeInfo.name}</h3>
                                        <p className="text-[10px]">{storeInfo.address} - Telp: {storeInfo.phone}</p>
                                        <h4 className="font-extrabold text-xs mt-1 underline">KWITANSI BUKTI PEMBAYARAN</h4>
                                    </div>
                                    <div className="space-y-1 text-xs">
                                        <div className="flex justify-between">
                                            <span>No. Bukti:</span>
                                            <span className="font-mono font-bold">{lastKwitansi.id}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Tanggal:</span>
                                            <span>{new Date(lastKwitansi.date).toLocaleString('id-ID')}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Telah Diterima Dari / Ke:</span>
                                            <span className="font-bold">{lastKwitansi.entityName}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Jumlah Pembayaran:</span>
                                            <span className="font-black text-emerald-700 text-sm">{formatRupiah(lastKwitansi.amountPaid)}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Sisa Saldo Tagihan:</span>
                                            <span className="font-bold text-amber-700">{formatRupiah(lastKwitansi.remainingDebt)}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Metode Bayar:</span>
                                            <span>{lastKwitansi.method}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Keterangan:</span>
                                            <span>{lastKwitansi.note}</span>
                                        </div>
                                    </div>
                                    <div className="flex justify-between pt-4 text-[10px] text-center border-t border-amber-300">
                                        <div>
                                            <p>Penerima / Toko</p>
                                            <div className="h-10"></div>
                                            <p className="font-bold">( {deviceInfo.operator} )</p>
                                        </div>
                                        <div>
                                            <p>Penyetor / Pembayar</p>
                                            <div className="h-10"></div>
                                            <p className="font-bold">( {lastKwitansi.entityName} )</p>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-2 pt-2 no-print">
                                    <button onClick={() => window.print()} className="flex-1 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl text-xs shadow-md flex items-center justify-center gap-2">
                                        <i className="fas fa-print"></i>
                                        <span>Cetak Kwitansi</span>
                                    </button>
                                    <button onClick={() => setActiveModal(null)} className="px-4 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs">Tutup</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: RESTORE / RESET DATA DEMO */}
                    {activeModal === 'restore_data' && (
                        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-white rounded-2xl p-5 shadow-2xl max-w-md w-full space-y-4 relative text-xs">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <div className="flex items-center gap-2.5 border-b pb-2">
                                    <div className="w-8 h-8 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-black">
                                        <i className="fas fa-rotate-left"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-extrabold text-slate-900 text-sm">Pulihkan Data Sampel Toko</h3>
                                        <p className="text-[10px] text-slate-500">Kembalikan katalog produk, pelanggan & supplier awal</p>
                                    </div>
                                </div>
                                <p className="text-slate-600 leading-relaxed">
                                    Apakah Anda ingin memulihkan seluruh data awal sampel toko material? Tindakan ini akan memperbarui daftar produk, stok, pelanggan, dan supplier ke setelan awal.
                                </p>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl">Batal</button>
                                    <button onClick={handleRestoreDefaultData} className="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl shadow-md">Ya, Pulihkan Data</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: DEVICE IDENTITY & PIN SETTINGS */}
                    {activeModal === 'device_modal' && (
                        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-white rounded-2xl p-5 shadow-2xl max-w-md w-full space-y-4 relative text-xs">
                                <button onClick={() => { setActiveModal(null); setPinInput(''); setPendingDeviceInfo(null); }} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <div className="flex items-center gap-2.5 border-b pb-2">
                                    <div className="w-8 h-8 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-black">
                                        <i className="fas fa-shield-alt"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-extrabold text-slate-900 text-sm">Profil Perangkat & Keamanan PIN</h3>
                                        <p className="text-[10px] text-slate-500">Wajib masukkan PIN 4 digit untuk mengubah identitas kasir</p>
                                    </div>
                                </div>

                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const form = e.target;
                                    const newName = form.deviceName.value;
                                    const newOp = form.operatorName.value;
                                    const newRole = form.deviceRole.value;
                                    const newPin = form.devicePin.value;
                                    const enteredPin = form.authPin.value;

                                    if (enteredPin !== deviceInfo.pin) {
                                        showToast('PIN keamanan salah! Hubungi Supervisor / Owner.', 'error');
                                        return;
                                    }

                                    if (newPin && newPin.length !== 4) {
                                        showToast('PIN Baru harus tepat 4 digit angka!', 'error');
                                        return;
                                    }

                                    setDeviceInfo({
                                        id: deviceInfo.id,
                                        name: newName,
                                        operator: newOp,
                                        role: newRole,
                                        pin: newPin || deviceInfo.pin
                                    });
                                    showToast('Profil perangkat & PIN berhasil diperbarui!');
                                    setActiveModal(null);
                                    setPinInput('');
                                }} className="space-y-3">
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-500 mb-1">Device ID Unique:</label>
                                        <input type="text" readOnly value={deviceInfo.id} className="w-full bg-slate-100 border border-slate-200 rounded-xl p-2.5 font-mono text-slate-600 font-bold" />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-500 mb-1">Nama Register / Perangkat:</label>
                                        <input type="text" name="deviceName" defaultValue={deviceInfo.name} required className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold" />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-500 mb-1">Nama Operator / Kasir:</label>
                                        <input type="text" name="operatorName" defaultValue={deviceInfo.operator} required className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold" />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-500 mb-1">Peran Perangkat:</label>
                                        <select name="deviceRole" defaultValue={deviceInfo.role} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold">
                                            <option value="Kasir Utama">Kasir Utama (Register 1)</option>
                                            <option value="Kasir Tambahan">Kasir Tambahan</option>
                                            <option value="Tablet Gudang">Tablet Gudang</option>
                                            <option value="Admin Store">Admin Store / Owner</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-500 mb-1">Ganti PIN Keamanan Baru (4 Digit, Kosongkan jika tetap):</label>
                                        <input type="password" name="devicePin" maxLength="4" placeholder="••••" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-mono tracking-widest font-bold" />
                                    </div>

                                    <div className="pt-2 border-t">
                                        <label className="block text-[10px] font-extrabold text-rose-600 mb-1">Masukkan PIN Saat Ini Untuk Konfirmasi (Default: 1234):</label>
                                        <input type="password" name="authPin" required maxLength="4" placeholder="••••" className="w-full bg-rose-50 border border-rose-200 rounded-xl p-2.5 font-mono tracking-widest font-bold text-rose-900" />
                                    </div>

                                    <div className="flex justify-end gap-2 pt-2">
                                        <button type="submit" className="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl shadow-md">Simpan Profil & PIN</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: PRINTABLE RECEIPT */}
                    {activeModal === 'receipt' && lastCompletedSale && (
                        <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-white rounded-2xl p-5 shadow-2xl max-w-sm w-full space-y-4 relative text-xs">
                                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 no-print">
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <div className="text-center pb-3 border-b no-print">
                                    <span className="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 font-black inline-flex items-center justify-center mb-1 text-lg">
                                        <i className="fas fa-check"></i>
                                    </span>
                                    <h3 className="font-extrabold text-slate-900 text-sm">Transaksi Berhasil!</h3>
                                    <p className="text-[10px] text-slate-500">Pratinjau Nota Thermal Kasir</p>
                                </div>
                                <div id="printable-area" className={`mx-auto bg-white p-3 rounded border border-slate-200 ${printThermalSize === '58mm' ? 'thermal-58mm' : 'thermal-80mm'}`}>
                                    <div className="text-center space-y-0.5 border-b border-dashed pb-2 mb-2">
                                        <div className="font-bold text-xs uppercase">{storeInfo.name}</div>
                                        <div className="text-[10px]">{storeInfo.address}</div>
                                        <div className="text-[10px]">Telp: {storeInfo.phone}</div>
                                    </div>
                                    <div className="text-[10px] space-y-0.5 border-b border-dashed pb-2 mb-2">
                                        <div>Nota: {lastCompletedSale.id}</div>
                                        <div>Tgl: {new Date(lastCompletedSale.date).toLocaleString('id-ID')}</div>
                                        <div>Kasir: {lastCompletedSale.device?.operator} ({lastCompletedSale.device?.name})</div>
                                        <div>Pelanggan: {lastCompletedSale.customer?.name}</div>
                                    </div>
                                    <div className="space-y-1 border-b border-dashed pb-2 mb-2">
                                        {lastCompletedSale.items.map((item, idx) => (
                                            <div key={idx} className="text-[10px]">
                                                <div className="font-bold">{item.name}</div>
                                                <div className="flex justify-between">
                                                    <span>{item.qty} {item.unit} x {formatRupiah(item.price)}</span>
                                                    <span>{formatRupiah(item.price * item.qty)}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="space-y-1 text-[10px] border-b border-dashed pb-2 mb-2">
                                        <div className="flex justify-between font-bold">
                                            <span>TOTAL:</span>
                                            <span>{formatRupiah(lastCompletedSale.total)}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Bayar ({lastCompletedSale.paymentMethod}):</span>
                                            <span>{formatRupiah(lastCompletedSale.paidAmount)}</span>
                                        </div>
                                        {lastCompletedSale.change > 0 && (
                                            <div className="flex justify-between">
                                                <span>Kembali:</span>
                                                <span>{formatRupiah(lastCompletedSale.change)}</span>
                                            </div>
                                        )}
                                    </div>
                                    <div className="text-center text-[9px] whitespace-pre-line pt-1 text-slate-600">
                                        {storeInfo.receiptFooter}
                                    </div>
                                </div>
                                <div className="flex gap-2 pt-2 no-print">
                                    <button onClick={() => window.print()} className="flex-1 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl text-xs shadow-md flex items-center justify-center gap-2">
                                        <i className="fas fa-print"></i>
                                        <span>Cetak Nota</span>
                                    </button>
                                    <button onClick={() => setActiveModal(null)} className="px-4 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs">Tutup</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MaterialPOSApp />);
    </script>
</body>
</html>
